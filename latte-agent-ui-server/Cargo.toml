[package]
name = "latte-agent-ui-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embeddable axum HTTP+SSE server that bridges ChatController to the latte-agent web UI"

[lib]
name = "latte_agent_ui_server"
path = "src/lib.rs"

[dependencies]
latte-ai = { workspace = true }
latte-agent-core = { path = "../latte-agent-core" }
latte-rs-agent-tools = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = "0.8"
parking_lot = { workspace = true }
anyhow = "1"
# toml_edit：角色编辑器保存时重写 .latte/agents.d/<id>.toml，
# 保留原文件的字段顺序与格式（toml::Value 默认 BTreeMap 会重排 key）。
toml_edit = "0.22"
# HTTP server: `axum` + `tower-http` for static-file serving + SSE event
# stream. `tokio-stream` needs the `sync` feature for `BroadcastStream`
# (converts `broadcast::Receiver<ChatEvent>` into a Stream) and `time`
# for `IntervalStream` (SSE ping 心跳事件，喂前端看门狗)。
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
futures-util = "0.3"
reqwest = { workspace = true }
base64 = "0.22"

[dev-dependencies]
# tasks.rs 单测：临时 cwd 下的 TaskStore 落盘/恢复。
tempfile = "3"
# notion_sync 集成测试：HTTP mock 验证 PUT 4xx/5xx/2xx 与重试。
wiremock = "0.6"