[package]
name = "latte-agent-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for multi-role agent discussions"

[[bin]]
name = "latte-agent"
path = "src/main.rs"

[dependencies]
latte-agent-core = { path = "../latte-agent-core" }
latte-agent-orchestrator = { path = "../latte-agent-orchestrator" }
latte-ai = { workspace = true }
latte-rs-agent-tools = { workspace = true }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
anyhow = "1"

[dev-dependencies]
# `tempfile` was already in Cargo.lock as a transitive dep; pinning it
# explicitly here avoids surprise version bumps the next time the lock
# is regenerated. Used by tests/blackbox/common to create per-test
# isolated LATTE_HOME directories.
tempfile = "3"
# `parking_lot` mirrors the workspace dep used in the agent / trace
# code so the mock server in `hil_v11_trace_events_e2e` (and any
# future HTTP-mock e2e) can use the same `Mutex` flavor as the
# production code path (no .unwrap() on lock results).
parking_lot = { workspace = true }
