[package]
name = "latte-agent-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "latte-agent"
path = "src/main.rs"

[dependencies]
latte-ai = { path = "../../latte-rs-model-router/latte-ai" }
latte-agent-core = { path = "../latte-agent-core" }
latte-agent-orchestrator = { path = "../latte-agent-orchestrator" }
latte-rs-agent-tools = { path = "../../latte-rs-agent-tools" }
latte-rs-graph = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
clap = { workspace = true }
tracing-subscriber = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
mime_guess = "2"
merge-rs = "0.2.0"
# HTTP server for `latte-agent ui` (web frontend bridge).
# `axum` + `tower-http` for static-file serving + SSE event stream.
# `tokio-stream` needs the `sync` feature for `BroadcastStream`
# (we use it to convert `broadcast::Receiver<ChatEvent>` into a Stream).
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
