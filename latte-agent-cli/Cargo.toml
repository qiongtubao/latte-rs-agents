[package]
name = "latte-agent-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "latte-agent"
path = "src/main.rs"

[dependencies]
latte-ai = { path = "../../latte-rs-model-router/latte-ai" }
latte-agent-core = { path = "../latte-agent-core" }
latte-agent-orchestrator = { path = "../latte-agent-orchestrator" }
# `latte-agent ui` 的 server 实现（axum + SSE + 静态文件），
# 供 CLI 薄壳与 Tauri 编辑器内嵌共用。
latte-agent-ui-server = { path = "../latte-agent-ui-server" }
latte-rs-agent-tools = { path = "../../latte-rs-agent-tools" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
clap = { workspace = true }
tracing-subscriber = "0.3"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
mime_guess = "2"
merge-rs = "0.2.0"

[dev-dependencies]
tempfile = "3"
