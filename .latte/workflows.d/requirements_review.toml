# Workflow: requirements_review
# 注意：本流程尚未按精致化模式重构（缺 output_key 穿线），见看板任务。
# 格式说明参考 config/workflows/bug_triage.toml 头部注释。

name = "requirements_review"
description = "PM 阐述需求，团队讨论可行性和范围。｜落点：对话里的需求结论"
max_rounds = 2
[[steps]]
id = "present"
speakers = ["pm"]
prompt = "为 {{topic}} 阐明需求。包含带验收标准的用户故事。"
[[steps]]
id = "architecture"
speakers = ["architect"]
prompt = "审查技术可行性并为上述需求建议架构。"
[[steps]]
id = "estimate"
speakers = ["programmer", "tester"]
prompt = "估算工期和风险。Programmer：实现复杂度和大致时间线。Tester：测试面和边界用例。"
[[steps]]
id = "decide"
speakers = ["manager", "pm"]
prompt = "基于讨论最终确定范围和优先级。Manager：评估风险和时间线可行性。"
[[steps]]
id = "advisor_verdict"
description = "Reviewer reviews all outputs and gives the final verdict"
speakers = ["reviewer"]
prompt = "你现在是终审顾问。通读上面的全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。"
