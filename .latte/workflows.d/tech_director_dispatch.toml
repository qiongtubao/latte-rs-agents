# Workflow: tech_director dispatch.
#
# Pattern: tech_director (a senior engineering role) reads the user's task,
# decomposes it into per-role subtasks (PM requirements, architect design,
# programmer implementation, tester quality), then summarizes the
# collected subtask outputs into a final answer.
#
# This is the "responsible manager" workflow: rather than broadcasting the
# same prompt to every role, the tech_director acts as a router.

name = "tech_director_dispatch"
description = "技术总监拆解任务，分派给 PM/架构师/程序员/测试员，然后综合总结。"
max_rounds = 1
context_token_budget = 32000

# Step 1: tech_director reads the topic and writes a plan. The plan
# tells subsequent roles what to focus on. We use `output_key` so the
# plan is included in the shared context for the next steps.
[[steps]]
id = "decompose"
description = "技术总监把用户任务拆解成每个角色的子任务。"
speakers = ["manager"]
prompt = """你是技术总监。阅读下面的用户任务，产出一份紧凑的计划，把它拆解成四个并行的子任务 —— 一个给 PM、一个给架构师、一个给程序员、一个给测试员。对每个子任务，写一句话告诉该角色要调查或产出什么。

用户的任务：
{{topic}}

按以下格式回应：

    PM: <PM 应该调查或撰写的内容>
    ARCHITECT: <架构师应该设计或评估的内容>
    PROGRAMMER: <程序员应该调查、勾勒或实现的内容>
    TESTER: <测试员应该检查或测试的内容>

具体、明确。整条回复控制在 200 字以内。"""
output_key = "plan"

# Step 2: PM analyzes the topic along the lines the tech director set
# out. We pass the plan as a context variable so the PM doesn't have
# to re-read the original topic.
[[steps]]
id = "requirements"
description = "PM 审阅计划并产出需求 / 用户面分析。"
speakers = ["pm"]
prompt = """你是产品经理。技术总监已经为用户任务产出了这份计划：

{{plan}}

原始用户任务：{{topic}}

以这份计划为指引，产出一组清晰的需求：用户故事（1-3 个）、验收标准、范围边界、优先级。不要实现或设计 —— 你的工作是把用户需求精准捕获。回复控制在 250 字以内。"""
output_key = "pm"

# Step 3: architect reviews the plan + PM's requirements, produces
# the technical design / risk assessment.
[[steps]]
id = "architecture"
description = "架构师产出技术设计和风险评估。"
speakers = ["architect"]
prompt = """你是系统架构师。技术总监的计划：

{{plan}}

PM 的需求：

{{pm}}

原始用户任务：{{topic}}

产出简洁的技术设计：关键模块、数据流、外部依赖、以及最关键 2-3 个风险或权衡。不要实现。回复控制在 250 字以内。"""
output_key = "architect"

# Step 4: programmer investigates the codebase / produces a concrete
# implementation sketch. This is the only step that should actually
# emit `<tool_call>` blocks to read code.
[[steps]]
id = "implementation"
description = "程序员调查代码 / 勾勒实现。"
speakers = ["programmer"]
prompt = """你是软件工程师。技术总监的计划：

{{plan}}

架构师的设计：

{{architect}}

原始用户任务：{{topic}}

你可以用 file read/list/search 工具先检查代码库再回答。产出：
- 具体的文件级改动列表（如果纯信息性回答，则写"不需要改代码"）。
- 简短的测试计划（添加哪些测试文件、覆盖什么）。

回复控制在 300 字以内。引用你读过的具体路径。"""
output_key = "programmer"

# Step 5: tester reviews the program and reports on test coverage /
# edge cases.
[[steps]]
id = "quality"
description = "测试员评估测试覆盖和边界用例。"
speakers = ["tester"]
prompt = """你是 QA 工程师。技术总监的计划：

{{plan}}

程序员的实现：

{{programmer}}

原始用户任务：{{topic}}

报告：
- 测试覆盖缺口（哪些路径没被测到？）。
- 未处理的边界用例 / 失败模式。
- 你会添加的具体测试用例（文件路径 + 断言什么）。

回复控制在 200 字以内。"""
output_key = "tester"

# Step 6: tech_director synthesizes all four contributions into a
# single concise answer for the user.
[[steps]]
id = "synthesize"
description = "技术总监把四份产出综合成最终答复。"
speakers = ["manager"]
prompt = """你是技术总监。四个角色已经完成他们的产出。你的工作是给用户写一份最终、单一的答复。

用户的原始任务：
{{topic}}

PM 说：
{{pm}}

架构师说：
{{architect}}

程序员说：
{{programmer}}

测试员说：
{{tester}}

产出简洁、结构清晰的最终答复，要求：
- 先用平实语言说明答复或计划。
- 引用关键权衡 / 风险。
- 列出具体的下一步。

整条答复控制在 400 字以内。不要含糊 —— 给一个真实的决策，而不是选项列表。"""
output_key = "final"
[[steps]]
# 终审：Advisor 对整场讨论/全部产出做最终把关，输出 ✅/⚠️/❌ 裁决。
id = "advisor_verdict"
description = "Advisor reviews all outputs and gives the final verdict"
speakers = ["advisor"]
prompt = "你现在是终审顾问。通读上面的全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。"
