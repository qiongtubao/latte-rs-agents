# Workflow: bug_triage
# Bug 分诊流水线：复现定界 → 根因诊断 → 修复方案 → 终审裁决。
# 步骤间用 output_key 显式穿线（mini-engine 跨步骤只传 output_key 变量）。

name = "bug_triage"
description = "Bug 分诊：复现定界 → 根因诊断 → 修复方案 → 终审裁决"
max_rounds = 1

[[steps]]
id = "reproduce"
description = "复现与定界"
speakers = ["tester"]
output_key = "repro"
prompt = "分诊这个 bug：{{topic}}。输出（严格按此结构）：1) 复现步骤（可直接执行的最小序列）；2) 期望行为 vs 实际行为；3) 最小触发输入；4) 初步定级（Critical/High/Medium/Low，按爆炸半径，附一句理由）；5) 你无法复现时的不确定项。只写可验证的事实。"

[[steps]]
id = "diagnose"
description = "根因诊断（读代码取证）"
speakers = ["programmer"]
output_key = "diagnosis"
prompt = "根因诊断。bug 现象与复现：\n{{repro}}\n要求：必须用工具读相关代码取证，禁止凭空猜测。输出：1) 最可能的根因（附代码证据 file:line）；2) 备选根因（如无法排除，说明还缺什么证据）；3) 影响面（受影响的模块/调用方）。"

[[steps]]
id = "fix_plan"
description = "修复方案 + 回归测试"
speakers = ["programmer"]
output_key = "plan"
prompt = "基于诊断提出修复方案：\n{{diagnosis}}\n输出：1) 最小修复思路（改哪个文件哪段逻辑，为什么这样改）；2) 回归测试用例（在旧代码失败、新代码通过的那个测试）；3) 风险与回滚（改坏了怎么退）。"

[[steps]]
id = "verdict"
description = "终审裁决"
speakers = ["reviewer"]
prompt = "你是终审。通读分诊全过程：\n【复现】{{repro}}\n【诊断】{{diagnosis}}\n【方案】{{plan}}\n按裁决格式输出：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需引用证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（含优先级建议）。只报告有证据、可行动的问题。"
