{{topic}}

你只负责 plan.json 中 id = `{{item_id}}` 的知识点（第 {{item_index}} 章）的这几节：
- `{{learn_root}}/{{slug}}/sections/{{item_id}}/1_background.md`
- `{{learn_root}}/{{slug}}/sections/{{item_id}}/2_goals.md`
引擎会给每节加标题（`### n. 节名`）并按顺序装配，**不要写节标题**，从正文开始；节内小标题用 `####`。
只能写上面这几个文件，写别的路径会被拒绝。

本章前面几节（引擎注入，已定稿，不要和它矛盾，也不要重复它）：
<<<
{{chapter_so_far}}
>>>

先读 `{{learn_root}}/{{slug}}/plan.json` 里本知识点及它 `decision` 指向的那条 `design.decisions`，读 `{{learn_root}}/{{slug}}/sections/00_overview.md`
了解本章在全局的位置；涉及源码的，自己读 evidence 行号区间（不许凭记忆）。

返工：读 `{{learn_root}}/{{slug}}/feedback.md`（不存在按 MODE: FULL）。`MODE: PATCH` 且有 `## {{item_id}}` 分组时，只在已有文件上
**增补**这几节里与意见相关的内容（原有段落、`file:line` 出处、代码摘录一律保留）；意见和这几节无关就只输出
`UNCHANGED`。引擎会核对出处和篇幅，改坏了会还原。

## 1. 问题与背景（1_background.md）
这段代码要解决什么问题、在系统里处于什么位置、谁会调用它。给一个**带具体输入的场景**
（plan 的 `scenario`），说明直觉做法在这个场景下哪一步出事。术语首次出现用半句话解释。

## 2. 目标与预期结果（2_goals.md）
解决方案必须满足的目标与硬约束，写成可检验的条目（如「同一个 arena 上的 4 个线程，一次分配
只争 1 把锁」「reset 不能释放分配器自己的元数据」）。再写「做到了会怎样」：上面那个场景的预期结果。
后面的方案对比就按这些目标来比。

通用纪律：
- 只写能从源码/测试/文档推出来的数（字节数、锁个数、循环次数，写出算式）；**不许编造吞吐、延迟、百分比**；
- 依据来自源码注释/测试/文档，无依据标「[推测]」；
- mermaid：第一行写图类型；节点 id 只用字母数字下划线，**标签一律加双引号**（`A["arena->bins[i]"]`），
  单图 ≤ 15 个节点。
- 讲内存怎么摆（页/格子/偏移/字段指针）用 ```memlayout 块，不要用 mermaid 硬画字节布局。语法每行一条：
  `lane <id> "说明"`（一行内存）、`cell <id> <大小> <used|free|meta|data|pad> "标签"`、`gap <大小> "省略说明"`、
  `ptr <lane>.<cell> -> <lane>.<cell> "说明"`；`@偏移` 只用来核对，必须等于前面各格大小之和（跳过的字节写成 `gap`）；
  引擎校验后渲染成 SVG，写错会带行号打回。
  **画之前先读源码核实**：每个格子、每条 `ptr` 都要能指到一处源码（宏、`sizeof`、地址/偏移是怎么算出来的那一行），
  不许凭通用教科书模型想当然。最容易画错的是「元数据内嵌在数据区里，还是放在别的结构里」——以源码里**地址怎么算出来**为准
  （如 `base + idx * size` 说明数据区没有头部），元数据在别处就画成独立 lane、用 `ptr` 指向数据格。
  引擎会对账：行说明/标题里写了 `= N KiB` 的总数必须等于格子之和；数据格和元数据格画在同一行，行说明里必须写 `file:line`；对不上带原因打回。
写完 write 落盘，正文一句话说明写了哪几节。"""

[steps.fan_out]
file = "{{learn_root}}/{{slug}}/plan.json"
items = "knowledge_points"
id_key = "id"
max_items = 32
tolerate_failures = true

