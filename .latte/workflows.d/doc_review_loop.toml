## 3. 多个解决方案（3_solutions.md）
至少 2 个真实可行的方案（含作者选的，来自 `chosen` 与 `alternatives`；稻草人不算）。每个方案一个
`#### 方案 X：<名字>` 小标题，下面写：
- 思路（2-3 句）；
- 结构草图：mermaid 画出它的结构（谁持有什么、锁/数据放在哪），或在本节开头用一张图、每个方案一个 `subgraph`；
- 同一场景推演：把第 1 节的场景放进这个方案，编号步骤写每步的数据/状态变化（来自 `chosen_walkthrough` /
  `walkthrough`）。替代方案走到出问题的那一步，点明「这里坏了」。
本节**不评价优劣**，评价放第 4 节。

## 4. 方案优缺点对比（4_comparison.md）
- 一张对比表：行 = 比较维度（plan 的 `dimensions` + 第 2 节的目标），列 = 各方案。每个单元格写第 3 节推演里
  **能数出来的具体值**（「1 把 bin 锁」「随线程数增长：1000 线程 → 1000 份」「编译期报错」），
  不许只写「极佳 / 灾难级 / 较好」这类形容词——引擎会查；
- 每个方案的优点 / 缺点各一两条，落到表里的具体维度上；
- 翻转条件：什么规模/负载/约束下替代方案反而更好（`wins_when`），作者为什么判断自己不属于那种情况。

通用纪律：
- 只写能从源码/测试/文档推出来的数（字节数、锁个数、循环次数，写出算式）；**不许编造吞吐、延迟、百分比**；
