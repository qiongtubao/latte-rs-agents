{{topic}}

你只负责 plan.json 中 id = `{{item_id}}` 的知识点（第 {{item_index}} 章）的这几节：
- `{{learn_root}}/{{slug}}/sections/{{item_id}}/5_principle.md`
- `{{learn_root}}/{{slug}}/sections/{{item_id}}/6_code.md`
