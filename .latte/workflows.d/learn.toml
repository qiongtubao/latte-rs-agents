# Workflow: learn
# 小白向深度讲解：把一个主题/机制拆成层层递进的图解教程。
# 流水线：investigate（锚定事实）→ structure（六层骨架）→ write（写成教程）
#         → verify（事实校对 + 小白测试，programmer 修正）
#
# 用法：manager 收到「给我讲讲 XXX 的原理」「学习一下 XXX」时调用：
#   workflow { name: "learn", topic: "<主题，如：RocksDB 的写入路径>" }
#
# 产物：docs/learn/<主题slug>.md —— 六层结构 + 每层 Mermaid 图 + 术语解释 + 类比

name = "learn"
command = "/learn"
description = "小白向深度讲解：主题 → 六层图解教程（API→收口→内存→落盘→权衡→优化空间）"
max_rounds = 1

# ── 1. 挖事实：只输出锚定到代码行的事实，不许发挥 ──────────────────
[[steps]]
id = "investigate"
description = "通读真实代码，产出带行号锚点的事实清单"
role = "programmer"
output_key = "facts"
max_retries = 1
task = """围绕主题「{{topic}}」通读本仓库（或用户指定的代码库）的真实代码，产出**事实清单**。你现在是研究员，不是老师——只挖事实，不要写成教程，不要发挥。

必须查清并逐条列出（每条都带 `文件路径:行号` 锚点，锚不到行号的写"未找到，不确定"）：
1. **入口**：完成这件事有多少种方式/API/命令？（列出每个入口的签名或用法）
2. **收口**：这些入口最终汇合到哪个函数/方法/组件？（名字+位置+它做什么）
3. **内存形态**：数据在内存里以什么数据结构存在？（结构名+关键字段+它们的关系）
4. **落盘过程**：从内存到磁盘经过哪些步骤？（按顺序）产出的文件/目录结构是什么？（文件名、格式、各自角色）
5. **关键分支**：过程中的重要 if/else（什么时候走哪条路，比如批量大小、错误处理、并发控制）

规则：禁止凭训练记忆描述本项目——每一条都要真的读到代码才写；找不到就明说找不到。"""

[steps.output_contract]
min_chars = 300
forbid = ["TBD", "待补充", "占位符"]

# ── 2. 搭骨架：把事实组织成六层讲解结构，选好类比与图型 ────────────
[[steps]]
id = "structure"
description = "把事实组织成六层讲解骨架"
role = "architect"
output_key = "skeleton"
max_retries = 1
task = """你是课程设计师。把下面的事实清单组织成一份**六层讲解骨架**，供写手写成小白教程。

【事实清单】
{{facts}}

【主题】{{topic}}

输出骨架，严格按这六层（每层 3-6 个要点）：
- **L0 一句话总览**：这件事用一句大白话说清楚是什么（电梯演讲）。
- **L1 入口层**：有多少种方式能做这件事，各自什么场景用。
- **L2 收口层**：所有路径汇合到哪——解释"统一收口"的意义（单一事实源、所有约束只需守一处）。
- **L3 内存层**：内存数据结构——形状、字段关系、为什么是这个形状（对比：换成别的结构会怎样）。
- **L4 落盘层**：写磁盘的步骤序列 + 文件结构——每个文件的角色、格式的取舍。
- **L5 设计权衡**：为什么这么实现而不是别的方案（至少列 2 个被否掉的方案和原因）。
- **L6 优化空间**：基于事实还能怎么优化（每条标注依据的事实锚点）。

每层还要给出：
- **类比**：一个生活化的比方（小白能懂，如"图书馆的索引卡片"），并说明类比在哪一点上失效；
- **配图建议**：这层用哪种 Mermaid 图（flowchart=流程走向 / graph=数据结构关系 / sequenceDiagram=时序 / stateDiagram=状态迁移），图里画哪几个节点、什么箭头。

只准引用事实清单里的内容；事实清单没覆盖到的层，标"事实不足"，不许编造。"""

[steps.output_contract]
min_chars = 300
require = ["L0", "L1", "L2", "L3", "L4", "L5", "L6"]
forbid = ["TBD", "待补充", "占位符"]

# ── 3. 写教程：六层 + 术语解释 + 类比 + Mermaid 图，写入文件 ───────
[[steps]]
id = "write"
description = "按骨架写成小白教程并写入 docs/learn/"
role = "tech_writer"
output_key = "doc"
max_retries = 1
task = """你是写给零基础读者的技术作家。按下面的骨架，把主题「{{topic}}」写成一篇小白教程，用 write 工具存入 `docs/learn/` 目录（文件名用主题的短英文 slug，如 `rocksdb-write-path.md`）。

【骨架】
{{skeleton}}

【事实清单（供你核对行号引用）】
{{facts}}

写作规则（每条都是硬要求）：
1. **读者设定**：完全不懂这个领域的小白。专业名词第一次出现时，用 `> **名词解释**：...` 引用块给一句人话解释（如 WAL、memtable、SSTable、LSM-tree）。
2. **六层结构**：严格按 L0-L6 组织，层与层之间有一句承上启下（"现在你知道了 X 从哪进来，那它进来之后去了哪？→"）。
3. **每层一张 Mermaid 图**：用 ```mermaid 代码块，图型按骨架建议（flowchart/graph/sequenceDiagram/stateDiagram）。图里的节点文字用中文短词，不要超过 15 个节点，宁可拆两张。
4. **每层一个类比**：用骨架给的类比，并诚实说明它在哪一点上失效。
5. **关键事实带行号**：提到具体实现处，括注（`文件:行号`）——读者可以按图索骥。
6. **结尾**：L6 优化空间之后，加一节"30 秒回顾"：六层每层一句话。
7. 语气：像朋友讲解，不用"显而易见/众所周知"；允许短句；禁止"教程/文档"这种自指措辞。
8. 事实不足的地方如实写"这部分代码里没读到，不确定"，禁止编造。

写完文件后，回复里输出：文件路径 + 全文。"""

[steps.output_contract]
min_chars = 800
require = ["```mermaid", "名词解释", "docs/learn/"]
forbid = ["TBD", "待补充", "占位符", "显而易见", "众所周知"]

# ── 4. 校验：事实校对 + 小白测试，programmer 修正 ──────────────────
[[steps]]
id = "verify"
description = "reviewer 双重校验，programmer 修正"
speakers = ["reviewer", "programmer"]
output_key = "report"
max_retries = 1
task = """校验下面这篇小白教程（文件路径和内容见 write 产出）：

【write 产出】
{{doc}}

reviewer 做双重校验（只检查+列问题，不改文件）：
1. **事实校对**：抽查至少 5 处行号引用和 3 条机制性断言，对照真实代码——有出入的逐条列出（位置/文档说的/代码实际）。"不要相信写手"。
2. **小白测试**：假装自己完全不懂这个领域，只读这篇文档：六层是否都能读懂？哪个名词没解释？哪张图看不懂？类比对理解有帮助还是误导？Mermaid 语法是否有明显错误（节点未闭合、箭头写错）？
输出：PASS（可交付）或 FAIL + 逐条问题清单。

programmer：若 FAIL，用 write 逐条修正文档文件（保持六层结构与写作规则），回复修正了哪些；若 PASS，回复"通过"。"""

[steps.output_contract]
min_chars = 50
