# Workflow: learn
# 小白向深度讲解：把一个主题/机制拆成层层递进的图解教程。
# 流水线：investigate（锚定事实）→ structure（六层骨架）→ write（写成教程）
#         → verify（事实校对 + 小白测试，programmer 修正）
#
# 用法：manager 收到「给我讲讲 XXX 的原理」「学习一下 XXX」时调用：
#   workflow { name: "learn", topic: "<主题>" }
#
# 产物：docs/learn/<主题slug>.md —— 六层结构 + 每层 Mermaid 图 + 术语解释 + 类比
#
# 通用性（2026-08 改进）：主题分三类，investigate 先判型，structure 自适应裁剪：
#   - code：主题是本仓库/某代码库里的一个机制（能读到源码、可锚定行号）
#   - mechanism：主题是一个机制/协议/流程（无仓库可读，靠知识拆解，不强制行号）
#   - concept：主题是一个概念/范式（如"微服务""CAP 定理"），无代码无落盘
# 六层里的 L3（结构层）/L4（流程层）按类型换语义，不再硬编码"内存 / 落盘"。

name = "learn"
command = "/learn"
description = "小白向深度讲解：主题 → 六层图解教程（入口→收口→结构→流程→权衡→优化）｜落点：一篇教程文档 docs/learn/<slug>.md"
max_rounds = 1

# ── 1. 挖事实：先判型再挖，只出事实不清发挥 ─────────────────────
[[steps]]
id = "investigate"
description = "判明主题类型并产出支撑讲解的事实清单"
role = "programmer"
output_key = "facts"
max_retries = 1
task = """围绕主题「{{topic}}」产出**事实清单**。你现在是研究员，不是老师——只挖事实，不要写成教程，不要发挥。

第一步**判型**：先判断主题属于哪一类，在事实清单开头用一行标出：
- `KIND=code`：主题是本仓库或用户指定代码库里的一个机制（能读源码）。此时**能锚定行号就锚**。
- `KIND=mechanism`：主题是一个机制/协议/流程（可能没有该仓库源码）。不依赖行号，靠机制本身拆解。
- `KIND=concept`：主题是概念/范式（如"微服务""CAP 定理"）。没有代码、没有落盘，靠概念结构拆解。

无论哪类，都逐条列出（能定位源码/文档的带 `文件路径:行号` 或「来源」标注，锚不到写"未找到，不确定"）：
1. **入口**：这件事有几种方式/API/入口/触发条件？（列出每个的名称与大致作用）
2. **收口**：这些入口最终汇合到哪个点？（一个函数/约定/核心概念上，它做什么）
3. **核心结构/形态**：关键载体是什么形态？代码类=内存里的数据结构（名称+关键字段+关系）；机制类=它的核心组成部分/状态；概念类=它的组成要素/维度。
4. **过程/流转**：从开始到结束经过哪些步骤？代码类=内存怎么变（落盘/网络/IO）；机制类=流程怎么走（消息/状态迁移）；概念类=要素之间怎么相互作用的。产出/结果长什么样？
5. **关键分支/取舍点**：过程中的关键 if/else、或不同场景下会怎么选（批量大小、错误处理、并发控制、或概念界的重大分歧）。

规则：KIND=code 必须真的读到代码才写、禁止凭训练记忆；KIND=mechanism/concept 可结合公认知识但注明"依据知识/依据源文"；找不到就明说找不到。"""

[steps.output_contract]
min_chars = 300
require = ["KIND="]
forbid = ["TBD", "待补充", "占位符"]

# ── 2. 搭骨架：按主题类型自适应组织六层，选好类比与图型 ─────────
[[steps]]
id = "structure"
description = "按主题类型组织六层讲解骨架"
role = "architect"
output_key = "skeleton"
max_retries = 1
task = """你是课程设计师。把下面的事实清单组织成一份**六层讲解骨架**，供写手写成小白教程。

【事实清单】
{{facts}}

【主题】{{topic}}

事实清单开头有 `KIND=code|mechanism|concept` 标记——**据此自适应**：L3/L4 不固定叫"内存/落盘"，而是按类型换说法（code → 结构/落盘流转；mechanism → 组成部分/流程流转；concept → 组成要素/相互作用）。

输出骨架，严格六层（每层 3-6 个要点）：
- **L0 一句话总览**：这件事用一句大白话说清楚是什么（电梯演讲）。
- **L1 入口层**：有多少种方式/入口能做这件事，各自什么场景用。
- **L2 收口层**：所有入口汇合到哪（一个函数 / 约定 / 核心概念），解释"统一收口"的意义（单一事实源、一处改到处生效）。
- **L3 结构层**：核心载体长什么样——code=内存数据结构（形状/字段/关系，对比换成别的结构会怎样）；mechanism=组成部分与关系；concept=组成要素与相互关系。
- **L4 流转层**：从开始到结束怎么走——code=内存→磁盘/网络/IO 的步骤+产物结构；mechanism=流程步骤/状态迁移；concept=要素间如何相互作用。产出/结果是什么。
- **L5 设计权衡**：为什么这么实现/划分，而不是别的方案（至少列 2 个被否掉的方案或划分、原因）。
- **L6 优化方向**：基于事实还能怎么优化/换个角度理解（code 类每条标注依据的行号；其他类标注依据的事实条目）。

每层还要给出：
- **类比**：一个生活化的比方（小白能懂，如"图书馆的索引卡片"），并说明类比在哪一点上失效；
- **配图建议**：这层用哪种 Mermaid 图（flowchart=流程走向 / graph=关系结构 / sequenceDiagram=时序 / stateDiagram=状态迁移），图里画哪几个节点、什么箭头。

只准基于事实清单里的内容；事实清单没覆盖到的层，标"事实不足"，不许编造。"""

[steps.output_contract]
min_chars = 300
require = ["L0", "L1", "L2", "L3", "L4", "L5", "L6", "KIND"]
forbid = ["TBD", "待补充", "占位符"]

# ── 3. 写教程：六层 + 术语解释 + 类比 + Mermaid 图，写入文件 ───────
[[steps]]
id = "write"
description = "按骨架写成小白教程并写入 docs/learn/"
role = "tech_writer"
output_key = "doc"
max_retries = 1
task = """你是写给零基础读者的技术作家。按下面的骨架，把主题「{{topic}}」写成一篇小白教程，用 write 工具存入 `docs/learn/` 目录（文件名用主题的短英文 slug）。

【骨架】
{{skeleton}}

【事实清单（供你核对引用/行号）】
{{facts}}

写作规则（每条都是硬要求）：
1. **读者设定**：完全不懂这个领域的小白。专业名词第一次出现时，用 `> **名词解释**：...` 引用块给一句人话解释。
2. **六层结构**：严格按 L0-L6 组织（层名用骨架给的，L3/L4 别画蛇添足叫"内存/落盘"除非主题确实是那个），层与层之间有一句承上启下（"现在你知道了 X 从哪进来，那它进来之后去了哪？→"）。
3. **每层一张 Mermaid 图**：用 ```mermaid 代码块，图型按骨架建议（flowchart/graph/sequenceDiagram/stateDiagram）。图里的节点文字用中文短词，不要超过 15 个节点，宁可拆两张。
4. **每层一个类比**：用骨架给的类比，并诚实说明它在哪一点上失效。
5. **关键事实带出处**：KNID=code 提到代码实现处，括注（`文件:行号`）供读者按图索骥；mechanism/concept 类对关键断言给"依据"来源（文档/知识），不编造行号。
6. **结尾**：L6 之后加一节"30 秒回顾"：六层每层一句话。
7. 语气：像朋友讲解，不用"显而易见/众所周知"；允许短句；禁止"教程/文档"这种自指措辞。
8. 事实不足的地方如实写"这部分没读到/不确定"，禁止编造。

写完文件后，回复里输出：文件路径 + 全文。"""

[steps.output_contract]
min_chars = 800
require = ["```mermaid", "名词解释", "docs/learn/", "KIND"]
forbid = ["TBD", "待补充", "占位符", "显而易见", "众所周知"]

# ── 4. 校验：事实校对 + 小白测试，programmer 修正 ──────────────────
[[steps]]
id = "verify"
description = "reviewer 双重校验，programmer 修正"
speakers = ["reviewer", "programmer"]
output_key = "report"
max_retries = 1
task = """校验下面这篇小白教程：

【write 产出】
{{doc}}

reviewer 做双重校验（只检查+列问题，不改文件）：
1. **事实校对**：看 `KIND=` 标记——code 类抽查至少 5 处行号引用和 3 条机制性断言对照真实代码；mechanism/concept 类核对断言是否有事实依据、有没有编造细节。有出入的逐条列出（位置/文档说的/实际）。
2. **小白测试**：假装自己完全不懂这个领域，只读这篇文档：六层是否都能读懂？哪个名词没解释？哪张图看不懂？类比对理解有帮助还是误导？Mermaid 语法是否明显错误（节点未闭合、箭头写错）？
输出：PASS（可交付）或 FAIL + 逐条问题清单。

programmer：若 FAIL，用 write 逐条修正文档文件（保持六层结构与写作规则），回复修正了哪些；若 PASS，回复"通过"。"""

[steps.output_contract]
min_chars = 50
require = ["KIND", "PASS", "FAIL"]
forbid = []
