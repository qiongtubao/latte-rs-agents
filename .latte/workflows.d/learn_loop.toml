# Workflow: learn_loop（v2：文档驱动学习循环）
# plan（取证 + 拆知识点 + 出题）→ annotate（注释版代码副本，默认生成）
#   → doc_review（嵌套 doc_review_loop：outline → 按知识点并发 write_chapter，装配 draft.md）
#   → novice → novice_fix ⇄ novice_recheck（小白先试学一遍，问题由辅导员纠正、小白复查）
#   → read_confirm（「开始答题」按钮，等学员读完）→ quiz（批量出题 + 判分 + 写账本，
#   有错跳回 doc_review，只重写答错的章）→ supplement（全对后问"还有不懂的吗"，有补充跳回 doc_review）
#   → merge（引擎定稿 docs/learn/<主题名>.md）→ [sync_code（可选：注释写进源码）] → report
#
# 用法：/learn_loop <主题>，或 manager 调 workflow { name: "learn_loop", topic: "…" }
#       annotate 默认生成注释版代码副本（.latte/sessions/<会话>/learn/<slug>/code/），不改源码；
#       可选开关：主题里带「同步注释」（或 写进源码）→ merge 之后由 sync_code 步
#       把注释写进真实源文件（只加注释、不改逻辑）——这会修改仓库代码，
#       建议该任务开 isolated worktree 执行（看板编辑弹窗可覆盖）。
# 产物：.latte/sessions/<会话>/learn/<slug>/plan.json（知识点+题目+答案+证据）
#       .latte/sessions/<会话>/learn/<slug>/ledger.json（wrong / passed 事实 + round + supplements）
#       .latte/sessions/<会话>/learn/<slug>/draft.md（学习期间的活文档，逐轮演进）
#       .latte/sessions/<会话>/learn/<slug>/code/（注释版代码副本 + README 索引）
#       docs/learn/<主题名>.md（merge 步定稿的最终交付文档）
#       .latte/sessions/<会话>/learn/<slug>/session.lock（引擎持有：同一主题同时只归一个会话，
#       另一个会话再学同一主题会被拒绝并点名正在学的会话）
#
# 设计文档：docs/learn-loop-doc-driven-design.md
#
# ── 设计约定 ─────────────────────────────────────────────────
# 1. 行为约束写在引擎字段上，不写进 prompt。prompt 是劝告、违反了没人知道；
#    字段是硬约束：tools（拿不到就调不了）、require_tools[_any]、
#    tool_call_limits、output_contract、loop_until / loop_back_routes。
# 2. "文档内容"与"答题按钮"必须分属两步：step 正文只在 step 结束时投递、而 ask
#    在中途阻塞。合成一步时学员会先看到弹窗、答完才看到文档。所以 doc 步正文
#    直接交付 draft.md 全文（chat 里即可阅读），read_confirm 步只负责弹
#    「开始答题」并阻塞等学员读完。
# 3. ask 的 allow_repeat / shuffle / auto_answer 参数未实现（handler 不解析）。
#    后果一：同一 question 文本重问会被"同题复用旧答案"保护静默回放、不弹窗——
#    凡跨轮次重复出现的 ask（read_confirm / quiz 重考 / supplement），题面必须
#    嵌入轮次号使文本不同。quiz 选项由引擎按「slug + 知识点 + 作答次数」洗牌，
#    重考时正确项换位置；补充题（两选一）不洗。
# 4. 跨 step 的结构化状态只走文件（plan.json / ledger.json / draft.md）；
#    quiz / supplement 返工时其产出文本由引擎自动预置进 doc 步的 prompt
#    （pending_feedback），doc 据此决定"增强哪里 / 补充什么"。

name = "learn_loop"
command = "/learn_loop"
description = "文档驱动学习循环：写学习文档 → 学员阅读 → 点「开始答题」→ 答错增强文档再学 → 全对后补充疑问 → 定稿合并｜落点：现在就开始上课：文档+弹窗互动 + docs/learn/<主题名>.md 定稿 + 会话目录下的学习工作区（不进任务看板）｜默认附注释版代码副本（工作区 code/，定稿时随文档发布）；主题带「同步注释」时把注释写进源码（会改仓库文件）"
max_rounds = 1

# ═══ 1. 取证 + 拆解知识点 + 出题 ══════════════════════════════
# tools              无 ask：课程设计阶段不许弹窗打扰学员。
# require_tools_any  取证不可跳过（read/code_graph/search 任一即可）。
# require_tools      plan.json / ledger.json 必须落盘，下游靠文件工作（返工用 edit 改也算落盘）。
# output_contract    产出被当路径片段拼接，所以只能是 slug 本身。
[[steps]]
id = "plan"
description = "读代码取证，拆解知识点、出题并写入 plan.json / ledger.json"
role = "tutor"
output_key = "plan_out"
max_retries = 2
tools = ["read", "code_graph", "search", "write", "edit"]
require_tools_any = ["read", "code_graph", "search"]
require_tools = ["write"]
# 只许写学习工作区里的 plan.json / ledger.json（slug 由本步决定，所以用 `*`）。
# 有 edit：返工只改被点名的字段，不必为几个字段整份重写 19KB 的 plan.json。
write_path_allowlist = ["{{learn_root}}/*/plan.json", "{{learn_root}}/*/ledger.json"]
task = """围绕主题「{{topic}}」设计课程。你是课程设计师，不教学，只产出设计分析、知识点清单与文档大纲。

读者是有编程基础、没读过这段代码的工程师。他要带走的是「作者面对什么问题、做了哪几个取舍、为什么这样选、代价是什么」。通用语言/库概念不配成为知识点。

## 一、先取证

凭记忆出题会造出不存在的符号，学员学到的是假知识。动笔前把涉及的代码/文档读一遍：
`code_graph`（`kind=function`/`struct` + `path`）拿签名行号，`read("<file>:<起>-<止>")`
精读，宏和字符串用 `search`。独立的取证同一轮批量发：`read(paths=[...])`，一次最多 10 个。
涉及"有几个字段""按什么顺序""定义在哪一行"这类事实，必须把定义整段读出来数。

**"为什么"也要取证**：优先找源码注释里的动机（`为什么` / `why` / `否则` / `实测`）、测试名与断言、`docs/` 与 `tasks/lessons.md`。

## 二、设计分析

先写 `design`，没有它后面的章节只能停留在代码概念：

- `problem`：核心问题 + 硬约束，最好带一个「不这样做会出什么事」的真实场景；
- `core_idea`：一句话核心设计思想；
- `decisions`：2-5 个关键决策。每个含 `id`（d1…）、`question`（设计问题，如「多题答案怎么判定收齐」，不要写成「X 函数做什么」）、`chosen`、`alternatives`（≥1 个真实可行方案，各有 `name` 与 `pros` 或 `cons`；「用 stdin」「干脆不加锁」这类稻草人不算）、`why`、`basis`（`file:line`；找不到依据就在 why 里标 `[推测]`）、`cost`。

**对比必须能推演，不能只是背书**。每个决策再写四样东西，后面章节的「方案对比」就是照着它们展开的：

- `scenario`：一个**带具体输入/数量**的场景，所有方案都放进去走一遍（如「4 个线程同时 `malloc(32)`，其中 2 个绑在同一个 arena」）。不要写「高并发场景」这种抽象说法；
- `dimensions`：≥2 个**可比较的具体维度**，是能在场景里数出来/推出来的量（如「一次分配要拿几把锁」「元数据随线程数还是核数增长」「出错时影响范围」）。禁用「性能」「复杂度」「可维护性」这类空词；
- `chosen_walkthrough`：作者的方案在 `scenario` 里一步步发生什么（3-6 步，每步写数据/状态变化）；
- 每个替代方案的 `walkthrough`：**同一个场景**换成它会一步步发生什么、在哪一步出问题；以及 `wins_when`：什么条件下它反而更好（至少一个替代方案要写）。讲不出翻转条件，说明你还没真正理解这个取舍。

数字只写能从源码/测试/文档里推出来的（字段字节数、锁的个数、循环次数）；**不要编造吞吐、延迟、百分比这类性能数字**——没有出处的「暴跌到 10%」比没有数字更糟，学员会当成事实。

## 三、拆知识点 + 定文档大纲

知识点围绕设计决策组织，不按结构体/函数平铺：每个点的 `decision` 指向一个 d_id。拆成 3-6 个，按因果顺序，第一个讲「要解决的问题与整体方案」。

`doc_outline` 第 1 节必须是「核心结论与全局设计」；中间每节回答一个设计问题；**最后一节是「代价、边界与复盘」**。涉及分档/分层时，章节仍要覆盖「怎么存」和「为什么这样存」。

每个知识点写：`id`、`title`（写成设计问题或结论，如「为什么赋值默认是 move」，不要写成「Pending 结构体」）、`decision`、`evidence`（`file:line`）、`why`（一句话）、`teach_points`（至少一半讲为什么/代价）、`example`（最小具体例子；能写就写「换成替代方案会变成什么」）、`doc_section`、`question` + 4 个 `options`、`answer`。

## 三、出题规则

- `options` 里**禁止 `recommended` 字段**——前端会渲染成「✓ 推荐」徽标，等于印上答案。
- `label` 写选项的实际内容（符号名/短语，≤20 字），**不许用 A/B/C/D**——那会让 `answer`
  退化成位置引用。出卷时引擎会洗牌，你写的顺序不影响学员看到的顺序；判分按 label
  文本，与位置无关。
- 四个选项等重：长度、语气、详略、术语密度一致。干扰项必须是真实存在的东西（真函数/宏/
  字段），只是不满足题干条件；一秒能排除的荒谬项（"两者完全等价"）不叫干扰项。
- **考理解，不考查表**：给一个具体小场景让学员推断行为/结果（如"在 GCC 下这段宏
  展开成什么""传 `x` 进去会怎样"）；**不许考"定义在第几行""有几个字段"这种翻
  原文就有答案的记忆题**——那考的是检索不是学会。
- **优先考设计推理**：至少一半题干带「如果 / 换成 / 为什么」。
- 题目考 `title` 说的那个核心，各知识点的题目不得互相重叠。选项 `description` 里的事实
  同样来自取证。

## 四、落盘

**先查重，但重跑不是无操作**（同一任务重复派发是常态，不能因为 slug 已存在就跳过刷新）:
1. 复用已有同主题计划的 slug 与学习账本，但每次运行都必须 write 完整的 plan.json 与 ledger.json（当前源码中的证据、行号、讲解要点、例子、题目和大纲有变化时刷新）；
2. 确实全新才按推导规则写初始文件（slug 从主题推导，小写英文+连字符；**剔除「同步注释」/「写进源码」这类开关标记词**）；

`write` 到 `{{learn_root}}/<slug>/plan.json`：
```json
{
  "slug": "<slug>",
  "topic": "{{topic}}",
  "design": {
    "problem": "不用 GC 也要保证内存安全：没有运行时追踪，谁来决定何时释放？",
    "core_idea": "把谁负责释放编码进类型系统，由编译器在编译期检查",
    "decisions": [{
      "id": "d1",
      "question": "值赋给另一个变量后，原变量还能用吗？",
      "chosen": "默认 move，原变量失效",
      "scenario": "let a = String::from(\"hi\"); let b = a; 之后 a、b 都离开作用域",
      "dimensions": ["离开作用域时释放几次", "赋值时复制多少字节", "错误在编译期还是运行期暴露"],
      "chosen_walkthrough": "1) b 接管堆指针，a 被标记为已移动 2) 再用 a 编译报错 3) 作用域结束只有 b 释放一次",
      "alternatives": [{
        "name": "默认浅拷贝",
        "cons": "两个 owner 指向同一块堆",
        "walkthrough": "1) a、b 复制了同一个堆指针 2) 作用域结束 b 释放一次 3) a 再释放一次 → double free，运行期才暴露",
        "wins_when": "值没有堆内存（i32 这类），复制几个字节比追踪 owner 更简单——这正是 Copy trait 的场景"
      }, {
        "name": "默认深拷贝",
        "cons": "大对象隐式复制",
        "walkthrough": "1) 赋值时重新分配并复制 2 字节堆内存 2) a、b 各自释放一次，安全但多了一次分配"
      }],
      "why": "唯一 owner 让释放点在编译期可判定",
      "basis": "src/ownership.rs:10-11",
      "cost": "共享结构要显式用 Rc"
    }]
  },
  "doc_outline": ["核心结论与全局设计", "为什么默认 move", "代价、边界与复盘"],
  "knowledge_points": [
    {
      "id": "k1",
      "title": "为什么赋值默认是 move",
      "decision": "d1",
      "evidence": "src/ownership.rs:12-48",
      "why": "唯一 owner 让编译器能静态确定释放点",
      "teach_points": ["每个值有唯一 owner（src/ownership.rs:12）", "换成深拷贝会让大对象的复制成本隐形"],
      "example": "let a = String::from(\"hi\"); let b = a; —— 之后用 a 编译报错。若是深拷贝，这里会静默再分配一份堆内存",
      "doc_section": "## 2. 为什么赋值默认是 move",
      "question": "…",
      "options": [
        {"label": "move 语义", "description": "客观描述这一项是什么"},
        {"label": "borrow 语义", "description": "客观描述这一项是什么"},
        {"label": "Copy trait", "description": "客观描述这一项是什么"},
        {"label": "Rc 引用计数", "description": "客观描述这一项是什么"}
      ],
      "answer": "borrow 语义"
    }
  ]
}
```

再 `write` 初始 `{{learn_root}}/<slug>/ledger.json`，**只记事实、不写状态名**（状态由读取方
按 `wrong`+`passed` 推导）：

```json
{"slug":"<slug>","round":0,"knowledge_points":[{"id":"k1","title":"所有权规则","wrong":0,"passed":false}],"supplements":[],"updated_at":"<now>"}
```

## 产出

**只输出 slug 本身**（如 `rust-ownership`），无其他文字——下游直接拼进文件路径。"""

[steps.output_contract]
min_chars = 3
max_chars = 60
forbid = [" ", "/", "\\", "`"]

# ═══ 1b. 注释版代码副本（默认生成）═══════════════════════════════════
# 默认必跑：注释版副本是学习材料的标配。「要不要注释进源码」才是开关——
# 那是 merge 之后 sync_code 步的事（when_any 触发）。
# tools          只有 read + edit，且 write_path_allowlist 只放行 code/ 下的副本：
#                改不到源文件——"不动源码"靠引擎拦截，不靠 prompt 劝告。
# 副本落在 .latte/sessions/<会话>/learn/<slug>/code/，不违反只读类型的 paths 严格校验
# （.latte/ 是学习产物目录，不是仓库源码）。
[[steps]]
id = "annotate"
description = "在引擎逐字拷好的代码副本里插入讲解注释（不改源码，不改代码行）"
budget = "small"
role = "tutor"
output_key = "annotate_out"
max_retries = 1
# 代码由引擎拷（开跑前按 plan 证据写好 code/<知识点>-<文件名> 骨架与 README）。
# 只给 read + edit：模型没有 write，也就无法凭记忆重打整份代码（实测 LAT-110：
# 300+ 行副本里数字、折行、声明被改，3 次 × 40 分钟全被打回）。改坏的代码行
# 由引擎换回原文；只能改 code/ 下的副本。
tools = ["read", "edit"]
require_tools = ["edit"]
write_path_allowlist = ["{{learn_root}}/{{plan_out}}/code/*"]
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

引擎已经把 plan 证据涉及的源码**逐字**拷进 `{{learn_root}}/{{plan_out}}/code/`（索引见
`{{learn_root}}/{{plan_out}}/code/README.md`），文件头写好了原始出处和对应知识点。你的任务
只有一件：**在这些副本里插入中文讲解注释**，让学员读源码时旁边就有讲解。

1. 读 `{{learn_root}}/{{plan_out}}/plan.json`（知识点的 `teach_points`、`why`）和
   README.md，再 `read` 每个副本。
2. 用 `edit` 插注释：`insert_before` / `insert_after` 在关键行前后插整行注释（用该
   语言的注释符号开头），或在代码行尾追加行尾注释。一次 edit 可以带多个插入。
   - 讲「做什么 / 为什么」，不复述代码本身；术语与 `teach_points` 一致，
     **面向零基础学员**——术语随口用半句大白话带过（如"内联：把函数体直接铺到调用处"）。
   - 每个副本至少讲清它对应知识点的关键几行。

代码行一个字符都不要改、不要删、不要新增——改了引擎也会换回原文。不要动 README.md。
正文列出你注释了哪些副本，此外不输出别的。"""

[steps.output_contract]
min_chars = 10

# ═══ 2. 嵌套写作（主体框架 + 章节并发写作）══════════════════════
# doc_review_loop：outline → 各章并发 write。写完就返回，学员开始阅读。
# 放行条件是学员答题，不是审稿员的 LOOKS_CLEAR。
[[steps]]
id = "doc_review"
description = "运行 outline→并发章节写作"
workflow = "doc_review_loop"
output_key = "doc_review_out"
output_from = "chapters_out"
task = """学习文档审查契约：
slug={{plan_out}}
draft={{learn_root}}/{{plan_out}}/draft.md
plan={{learn_root}}/{{plan_out}}/plan.json
ledger={{learn_root}}/{{plan_out}}/ledger.json
"""

# ═══ 2b. 小白试学：学员读之前先替他学一遍，问题交给辅导员纠正 ══════════
# 三步都由引擎前后置（workflow.rs learn_novice_pre / learn_novice_post）：
#   novice          引擎先改正对不上源码的「符号（文件:行号）」，按章节内容哈希只学
#                   变过的章，出不带答案的试学卷；小白写 report.json。引擎核实（摘的
#                   原文要逐字在文档里、依据行号要真实存在），按选项判分，答错自动成为问题。
#   novice_fix      辅导员逐条 FIXED / WONTFIX；改坏的还原，代码副本只留注释。
#   novice_recheck  小白复查；答题类必须重答答对才算解决。最多 2 轮，仍未解决的在原文处
#                   标「⚠️ 待确认」，交给学员。知识点拆分类问题不自动改，直接列为待确认。
# read_path_allowlist 只写禁读项（`!`）：小白要读任意源码，但不许读 plan.json / ledger.json（答案在里面）。
# 没有要学 / 要改 / 要复查的，引擎直接给出产出，不调模型。
[[steps]]
id = "novice"
description = "小白试学：读文档和代码、答试学卷，提出问题"
role = "novice"
output_key = "novice_out"
max_retries = 1
tools = ["read", "code_graph", "search", "write"]
require_tools_any = ["read"]
require_tools = ["write"]
read_path_allowlist = ["!{{learn_root}}/*/plan.json", "!{{learn_root}}/*/ledger.json", "!{{learn_root}}/*/feedback.md", "!{{learn_root}}/*/novice/issues.json"]
write_path_allowlist = ["{{learn_root}}/{{plan_out}}/novice/report.json"]
task = """你在学员之前先学这份学习材料。先 read `{{learn_root}}/{{plan_out}}/novice/brief.md`（试学说明：要学的章节、代码副本、试学卷），
然后按顺序学完，对照源码核对文档里的数字、边界和条件，最后答完试学卷。

把结果 write 到 `{{learn_root}}/{{plan_out}}/novice/report.json`（格式见你的角色说明）。
完成后正文只输出一句话：学了几章、提了几个问题。"""
[steps.output_contract]
min_chars = 4

[[steps]]
id = "novice_fix"
description = "辅导员纠正小白试学提出的问题"
role = "tutor"
output_key = "novice_fix_out"
max_retries = 1
tools = ["read", "code_graph", "search", "edit"]
write_path_allowlist = ["{{learn_root}}/{{plan_out}}/sections/*.md", "{{learn_root}}/{{plan_out}}/sections/*/*.md", "{{learn_root}}/{{plan_out}}/code/*"]
task = """小白在学员之前试学了这份材料，提出的问题已由引擎核实，见 `{{learn_root}}/{{plan_out}}/novice/fix_brief.md`。
逐条处理：先回源码核对，问题成立就用 edit 改对应文件（章节在 sections/，代码副本在 code/，代码副本只改注释）；
问题不成立就不改，并说明理由。只在原文上改，不要整段推倒，原有的正确 `文件:行号` 出处保留。

正文逐条回应，每条单独一行：
FIXED <id>: 改了什么
WONTFIX <id>: 不改的理由（要能说服小白）"""
[steps.output_contract]
min_chars = 4

[[steps]]
id = "novice_recheck"
description = "小白复查纠正结果"
role = "novice"
output_key = "novice_recheck_out"
max_retries = 1
loop_until = "NOVICE_DONE"
loop_back_to = "novice_fix"
max_iterations = 10
tools = ["read", "code_graph", "search", "write"]
require_tools = ["write"]
read_path_allowlist = ["!{{learn_root}}/*/plan.json", "!{{learn_root}}/*/ledger.json", "!{{learn_root}}/*/feedback.md", "!{{learn_root}}/*/novice/issues.json"]
write_path_allowlist = ["{{learn_root}}/{{plan_out}}/novice/recheck.json"]
task = """辅导员处理了你上次提的问题。read `{{learn_root}}/{{plan_out}}/novice/recheck_brief.md`，只看里面列出的条目和改过的地方，
逐条判断问题是否真的解决了，需要重新作答的题照样作答。

write `{{learn_root}}/{{plan_out}}/novice/recheck.json`：
{"issues": [{"id": "n1", "resolved": true, "note": "…"}], "answers": [{"id": "k2", "choice": "选项原文", "basis": "文档原句"}]}
完成后正文只输出一句话。"""
[steps.output_contract]
min_chars = 4

# ═══ 3. 等学员读完：「开始答题」按钮 ═════════════════════════
# tools            只读 + ask：不许改文档和账本。
# require_tools    ask 必须真弹过。
# tool_call_limits ask 恰好一次。
# 本步是纯阻塞点：文档全文已随上一步正文投递，这里只等学员读完点按钮。
[[steps]]
id = "read_confirm"
description = "弹「开始答题」按钮，阻塞等学员读完文档"
role = "tutor"
max_retries = 1
tools = ["read", "ask"]
require_tools = ["ask"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员正在阅读学习文档（路径与要点已在上一条消息里）。你的唯一职责：确认他读完了。

读 `{{learn_root}}/{{plan_out}}/ledger.json` 拿 `round`，然后调一次 `ask`：

- `question`：`学习材料（第 {round+1} 版）：{{learn_root}}/{{plan_out}}/draft.md。读完了吗？`
  ——题面**必须带版本号**：同一题面文本重问会被"同题复用旧答案"保护静默回放、
  根本不弹窗，学员的"读完确认"会被工具层吞掉。
- `document_path`：`{{learn_root}}/{{plan_out}}/draft.md`——UI 会把文档**内容**渲染在
  提问卡片里（选项上方），学员不用离开 chat 去找文件。后端读不到会自动降级为只
  显示路径，不用你兜底。
- `options`：只有一项 `{"label": "开始答题，验证掌握程度", "description": "我已读完文档"}`；
  **不加 `recommended`**。
- 不加多余选项；学员若经「其他（自定义）」回了问题，原样转述即可，不要替他回答。

答案回来后，正文一句话确认（如"好，开始答题"）即可，不要讲课。"""

# ═══ 4. 批量出题 + 判分 + 循环控制 ═══════════════════════════
# tools              无 code_graph / search：题目已定好，本步不取证、不改题。
# require_tools      ask 必须真弹过（否则拿旧答案编造判分结果），write 必须真写
#                    账本（否则同一批点被反复考、循环靠撞满才停）。
# tool_call_limits   ask 恰好一次：用 questions=[...] 一次出全部未掌握点的题，
#                    一轮只弹一窗。
# require            判分结果必须回显给学员。
# last_line_prefix_any 末行状态标记缺失时引擎按"未通过"判，循环停不下来。
# loop_until/routes  全对 QUIZ_PASS → 进 supplement；有错 QUIZ_FAIL → 回 doc 增强。
# max_iterations     引擎硬上限 10（写更大无效），是"学到会为止"的保险丝。
[[steps]]
id = "quiz"
description = "用 ask 批量出全部未掌握点的题、判分并更新账本"
role = "tutor"
max_retries = 2
loop_until = "QUIZ_PASS"
loop_back_routes = { QUIZ_FAIL = "doc_review" }
max_iterations = 10
tools = ["read", "write", "ask"]
require_tools = ["ask", "write"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

读 `{{learn_root}}/{{plan_out}}/plan.json` 与 `ledger.json`，本轮考**所有 `passed == false`**
的知识点（已 passed 的不重考）。考哪个点不需要问别人——账本是唯一事实来源。

1. **出题**：调**一次** `ask`，用 `questions=[...]` 把本轮所有题一次出完（一题一个
   question 元素，各带自己的 `options`）。每题：
   - 若该点 `wrong > 0`（以前考过），题面末尾追加 `［第{wrong+1}次作答］`——同一题面
     文本重问会被"同题复用旧答案"保护静默回放、不弹窗，学员连卷子都看不到；
   - `options` 原样传，**不加 `recommended`**（渲染成「✓ 推荐」等于泄题）；
   - `answer` 只给你判分，永远不下发，也不要在题面或 `description` 里暗示。
2. **判分**：用户答案与 `answer` 按 **label 文本**比对、**绝不按位置**（正确项位置是
   plan 随机打散的，"第几项"没有意义；答案可以带序号前缀，但必须包含完整 label）。
   只回 label 的一部分、对不上任何 label（乱填、空、"不知道"、或走了「其他（自定义）」自由文本）按答错。
3. **更新账本**（write 覆盖写 ledger.json 并刷新 `updated_at`）。只做两件事，不做任何
   状态推理：答对 → 该点 `passed = true`（`wrong` 不动）；答错 → `wrong` = 读到的值
   **+1**（`passed` 保持 false）。`wrong` 只能 +1、绝不跳步；其余知识点原样保留。
4. **反馈**：正文逐题回显 `判分结果`（答对/答错）和 `你选的是`（用户实际选项）。答错时
   说明正确答案是哪个、为什么，带 `file:line`，并告诉学员"这一节的讲解将在下一版
   文档里增强，重读后再考"。
5. **末行**：本轮题目**全对** → `QUIZ_PASS`；有错 → `QUIZ_FAIL`（引擎会带着你的判分
   正文跳回 doc 步增强文档，然后重新阅读、重考）。**除末行外，正文里不得出现
   `QUIZ_PASS` / `QUIZ_FAIL` 原文**——引擎按全文子串判定，正文提了会误判全对。

没有"错几次就放弃"：v2 是学到会为止。若已逼近第 10 轮仍反复答错，在正文里如实
告诉学员，不要假装通过。"""

[steps.output_contract]
require = ["判分结果", "你选的是"]
last_line_prefix_any = ["QUIZ_PASS", "QUIZ_FAIL"]

# ═══ 5. 补充疑问 ═════════════════════════════════════════════
# 仅在 QUIZ_PASS 后进入。有补充 → 记进 ledger.supplements，回 doc 写新章节+
# 新知识点，然后重新"阅读→答题"；没有 → ALL_DONE 进 merge。
# require_tools  ALL_DONE 路径也要 write 一次账本（刷新 updated_at）——
#                require_tools 是机械校验，分不出两条路径。
[[steps]]
id = "supplement"
description = "全对后问学员是否还有不懂的知识点要补充"
role = "tutor"
max_retries = 2
loop_until = "ALL_DONE"
loop_back_to = "doc_review"
max_iterations = 10
tools = ["read", "write", "ask"]
require_tools = ["ask", "write"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员本轮题目全对。读 `{{learn_root}}/{{plan_out}}/ledger.json` 拿 `round`，调一次 `ask`：

- `question`：`第 {round+1} 轮：「{{topic}}」的内容都掌握了吗？还有不懂、想补充讲解
  的知识点吗？`——题面**必须带轮次号**（同题面重问会被静默回放旧答案、不弹窗）。
- `options`：只有一项 `{"label": "没有了，全部理解", "description": "可以定稿结束了"}`；
  **不加 `recommended`**。想补充的学员会走前端自动附带的「其他（自定义）」输入具体
  内容，你不要替他列猜测项。

然后判定：

- 答案是「没有了，全部理解」→ write 一次 ledger.json（只刷新 `updated_at`，其余不动），
  末行写 `ALL_DONE`（进 merge 定稿）。
- 答案是 `其他：<内容>` → 把学员的补充问题原文追加进 ledger.json 的 `supplements`
  数组：`{"round": <当前round>, "asked": "<内容原文>"}`，刷新 `updated_at`（`round`
  不 +1，那是 doc 步的事）；正文复述学员的补充点并说明"将写进文档并补一道题"，
  末行写 `SUPPLEMENT`（引擎会带着你的正文跳回 doc 步）。

**除末行外，正文里不得出现 `ALL_DONE` / `SUPPLEMENT` 原文**——引擎按全文子串判定。"""

[steps.output_contract]
last_line_prefix_any = ["ALL_DONE", "SUPPLEMENT"]

# ═══ 6. 文档合并定稿（引擎确定性步骤）══════════════════════════
# 不调用模型：章节是引擎按固定 9 节装配的（标题、顺序、补充章都已在 draft 里），
# 定稿只需加标题 + 目录、把章节链接改指回 sections/、附注释副本索引。
# 早先让模型整篇重写：4 章 9 节的 draft 实测 191KB，一次 write 远超输出上限。
# 下面的 task 只作说明。
[[steps]]
id = "merge"
description = "引擎把会话工作区的 draft.md 发布到 docs/learn/<主题名>.md（加目录、拷资源、改链接）"
role = "tutor"
max_retries = 1
tools = ["read"]
task = """由引擎把会话工作区里的 `{{learn_root}}/{{plan_out}}/draft.md` 发布到项目，不调用模型：
定稿写 `docs/learn/<主题名>.md`（主题名 = slug 去掉看板任务编号，如 `lat-110-jemalloc-size-class` →
`jemalloc-size-class`），加标题与目录；定稿引用到的章节、注释版代码副本、内存布局图拷到
`docs/learn/<主题名>/`，链接改指那里——定稿脱离会话目录也能完整阅读。定稿后按出处、图数、篇幅核对一遍。"""

# ═══ 6b. 可选：把注释同步进真实源码（when_any 命中才跑）══════════════
# when_any       主题带「同步注释」/「写进源码」才跑——默认只留 .latte/ 副本，
#                不动仓库；开启后本步会修改源文件（只加注释、不改逻辑），
#                建议任务开 isolated worktree（看板编辑弹窗可覆盖）。
# output_key     条件 step 必须绑 output_key（引擎校验），跳过时下游拿到空串。
# require_tools  edit 必须真调过——同步就是改文件，没 edit 就是空口报告。
# 放在 merge 之后：学习已结束，副本是最终版本，一次同步全覆盖。
# 引擎在开跑前给相关源文件留原文，改出注释以外的变化就整体还原并重试。
[[steps]]
id = "sync_code"
description = "可选：把注释版副本里的注释写进真实源文件（只加注释不改逻辑）"
role = "tutor"
output_key = "sync_out"
when_any = ["同步注释", "写进源码"]
max_retries = 2
tools = ["read", "edit"]
require_tools = ["edit"]
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员要求把学习期间生成的注释写进真实源码。读 `{{learn_root}}/{{plan_out}}/code/README.md`
索引与各个注释版副本，按副本头部的原始出处（`file:line`）用 `edit` 把注释逐个应用
到对应源文件：

1. **只加/改注释，绝不改任何代码逻辑**——改动里除了注释行不许出现别的变化；
2. 行号可能已漂移：以副本里的代码原文为锚点定位，对不上就 `read` 源文件重新找，
   找不到锚点的条目跳过并在正文说明，不要硬插；
3. 注释风格与所在文件已有注释一致（注释符号、语言、密度）；
4. 副本头部的"学习副本 / 原始出处"元信息**不要**带进源码。

引擎会逐行比对：去掉注释后，源文件的代码行必须和改之前一模一样；不许碰学习范围
以外的文件；不许把「学习副本 / 原始出处」写进源码。违反任何一条，引擎会把源文件
全部还原，点名哪一行，让你重做。

正文列出改动文件清单 + 每处注释的一句话摘要（跳过项也列出原因），此外不输出别的。"""

[steps.output_contract]
min_chars = 30

# ═══ 7. 掌握报告 ═════════════════════════════════════════════
# 引擎确定性步骤：报告只复述账本事实，由引擎按 ledger.json / plan.json
# 渲染，不调用模型（模型写报告会数错、漏点或美化进度）。下面的 task
# 只作说明。
[[steps]]
id = "report"
description = "引擎按账本输出最终掌握报告"
role = "tutor"
max_retries = 1
tools = ["read"]
task = """由引擎读 `{{learn_root}}/{{plan_out}}/ledger.json` 渲染掌握报告，不调用模型。

`passed == true` → 已掌握；`wrong` 是累计答错次数；`round` 是文档轮次；
`supplements` 是学员补充的疑问。报告含掌握进度、学习过程、学员补充、交付文档
（docs/learn/<主题名>.md）、注释版代码副本（目录存在时）和一句建议。"""

[steps.output_contract]
min_chars = 80
require = ["掌握进度"]
