# Workflow: design_and_plan
# 组合示例：展示"workflow 由多个 workflow 组合"的两种形态——
#   串行链：explore → design_brainstorm → implementation_plan
#           （后者 depends_on 前者，前者的产出经 output_key 注入后者 topic）
#   并行组：requirements_review 与 code_review 无依赖，同一 wave 并行
#
# 嵌套 step 不写 task 时，父 topic 原样透传；写 task 则可引用上游
# output_key（如 {{design}}）做数据衔接。

name = "design_and_plan"
command = "/design-and-plan"
description = "组合 workflow：探索→设计脑暴→实现计划串行链 + 评审并行组（嵌套组合示例）"
max_rounds = 1
# 文档暂存：中途步骤的 write 先落 .latte/staging/<wf_id>/（read 优先读
# 暂存副本），整个 workflow ok 才提升到目标路径——未终审的文档不进仓库。
staging = true

# ── 串行链：探索 → 脑暴 → 计划 ────────────────────────────────────
[[steps]]
id = "explore"
description = "嵌套 explore：摸清背景（空 task，topic 透传）"
workflow = "explore"
output_key = "exploration"

[[steps]]
id = "brainstorm"
description = "嵌套 design_brainstorm：基于探索结论做设计脑暴"
workflow = "design_brainstorm"
depends_on = ["explore"]
task = "{{topic}}\n\n背景探索结论：\n{{exploration}}"
# 子 workflow 最后一步是 advisor_verdict（评审裁决），父级要的是
# synthesize 的方案本体 —— 否则下游拿到的是「裁决：✅ 通过…」评审
# 文本而不是方案（jemalloc 现场实锤：plan/评审步骤全被喂了 verdict）。
output_from = "proposal"
output_key = "design"

[[steps]]
id = "plan"
description = "嵌套 implementation_plan：把设计方案拆成任务清单"
workflow = "implementation_plan"
depends_on = ["brainstorm"]
task = "基于以下设计方案制定实现计划：\n{{design}}"
output_key = "plan"

# ── 并行组：两个评审互不依赖，同一 wave 并行 ──────────────────────
[[steps]]
id = "req_review"
description = "嵌套 requirements_review（与 code_review 并行）"
workflow = "requirements_review"
depends_on = ["brainstorm"]
task = "评审以下设计方案的需求合理性：\n{{design}}"
output_key = "req_verdict"

[[steps]]
id = "code_review"
description = "嵌套 code_review（与 requirements_review 并行）"
workflow = "code_review"
depends_on = ["brainstorm"]
task = "评审以下设计方案涉及代码区域的质量风险：\n{{design}}"
output_key = "code_verdict"

# ── gate：总终审门 ────────────────────────────────────────────────
# 任一评审 ❌/有阻断问题 → gate 输出 VERDICT: REJECT → loop_until
# 不满足 → 自动跳回 brainstorm 重做（REJECT 原因作为【上轮审查反馈】
# 预置进 prompt），重脑暴 → 重计划 → 重评审 → 重判，最多
# max_iterations 轮；耗尽仍 REJECT 才以 failed 收场（带 wf_id 可
# resume）。此前 DAG 不支持返工环，REJECT 被契约 require PASS 判死
# （jemalloc 实锤：gate 如实 REJECT——评审抓到 extent 状态数等真问题
# ——50 分钟流水线零产出）。
# 契约只卡格式（必须有 VERDICT: 标记），放行与否交给 loop_until——
# 不能 require PASS，否则 REJECT 变成契约失败直接判死（同
# implementation_plan.toml 的教训）。
# ⚠️ 有条件通过 → PASS 但条件/修正项必须随计划一并带上（jemalloc
# 实锤：实测行号错误随裸 PASS 被静默丢弃）；有实测错误未吸收进
# 计划时必须 REJECT。
[[steps]]
id = "gate"
description = "总终审门：REJECT 自动返工，耗尽迭代才失败"
role = "reviewer"
depends_on = ["plan", "req_review", "code_review"]
max_retries = 1
loop_until = "VERDICT: PASS"
loop_back_to = "brainstorm"
max_iterations = 2
task = """根据以下两份评审结论判定放行与否：

【需求评审】
{{req_verdict}}

【代码评审】
{{code_verdict}}

规则：
- 两份评审均为 ✅ 通过 → 第一行输出 `VERDICT: PASS`，然后**原样完整附上**下面的实现计划（不得增删改）：

【实现计划】
{{plan}}

- 任一份为 ⚠️ 有条件通过（无阻断问题）→ 第一行输出 `VERDICT: PASS`，然后以「【通过条件/修正项】」为标题**原样附上两份评审的全部条件与修正项**（一条都不许丢），再原样完整附上实现计划。修正项必须随计划一并交付，禁止静默丢弃。
- 任一份（无论裁决为何）指出实测错误（行号/路径/事实核验不符）且这些修正未在实现计划中体现 → 必须输出 `VERDICT: REJECT`，理由列出未吸收的实测错误。
- 任一份为 ❌ 不通过 / changes-requested / 存在阻断问题 → 只输出 `VERDICT: REJECT` 和阻断原因摘要（一两句，写清每条阻断的 file:line 证据，返工要用），**不要**附实现计划。
- 输出 REJECT 时，正文中不得再出现字符串「VERDICT: PASS」（会被循环条件误判为放行）。"""

[steps.output_contract]
require = ["VERDICT:"]
