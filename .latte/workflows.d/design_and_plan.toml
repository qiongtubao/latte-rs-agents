# Workflow: design_and_plan
# 组合示例：展示"workflow 由多个 workflow 组合"的两种形态——
#   串行链：explore → design_brainstorm → implementation_plan
#           （后者 depends_on 前者，前者的产出经 output_key 注入后者 topic）
#   并行组：requirements_review 与 code_review 无依赖，同一 wave 并行
#
# 嵌套 step 不写 task 时，父 topic 原样透传；写 task 则可引用上游
# output_key（如 {{design}}）做数据衔接。

name = "design_and_plan"
command = "/design-and-plan"
description = "组合 workflow：探索→设计脑暴→实现计划串行链 + 评审并行组（嵌套组合示例）"
max_rounds = 1
# 文档暂存：中途步骤的 write 先落 .latte/staging/<wf_id>/（read 优先读
# 暂存副本），整个 workflow ok 才提升到目标路径——未终审的文档不进仓库。
staging = true

# ── 0. 需求澄清：先快速摸清背景，再问用户 ────────────────────────
# tutor 先花少量工具调用了解代码库概况（目录结构、关键模块），然后
# 用 ask 工具弹窗提问，收集用户的目标、水平、时间预算、关注重点，
# 确保问题选项贴合主题。产出 user_profile 供下游 {{var}} 引用。
[[steps]]
id = "interview"
description = "用户需求澄清：先快速摸清背景，再用 ask 弹窗提问"
role = "tutor"
output_key = "user_profile"
task = """先快速摸清代码库背景（3-5 次工具调用：读目录结构、看关键入口文件），然后问用户。用 `ask` 工具弹窗提问，了解用户对「{{topic}}」的背景和需求。问完汇总成一段话输出。

问 3-4 个问题（选择题，每题 3-4 个选项）：
1. **目标**：你最终想达成什么？→ 选项根据 topic 自适应（如"学习代码机制"、"做调优"、"做实现"、"写 PR 注释"）
2. **当前水平**：你对这个主题的熟悉程度？→ "完全新手"、"看过一些代码"、"有经验"、"领域专家"
3. **时间预算**：你打算投入多少时间？→ "1-2h"、"3-5h"、"5-10h"、"10h+"
4. **关注重点**：你的兴趣点在哪？→ 选项根据 topic 自适应（如技术方向的几个分支）

选项文字要贴合第 1 步摸到的代码背景（如引用真实目录/文件/术语），不要放通用选项。
图片支持：ask 选项的 `preview` 字段支持富内容（含图片），当某个选项靠文字说不清时——比如方向对比、架构图、代码摘录、截图——把图片/图示放进该选项的 `preview`，让用户看到图再选。

问完汇总：把 4 个答案整合成一段 100-200 字用户画像，并附带代码背景观察（引用第 1 步在**本仓库**实际看到的目录/模块/入口文件，如"该仓库 src/ 下有 <模块A>/<模块B> 等模块，入口在 <入口文件>"），作为 user_profile 输出。"""

# ── 串行链：探索 → 脑暴 → 计划 ────────────────────────────────────
[[steps]]
id = "explore"
description = "嵌套 explore：摸清背景（注入用户画像）"
workflow = "explore"
depends_on = ["interview"]
task = "{{topic}}\n\n用户画像：\n{{user_profile}}"
# output_key 拿的是 explore 末步（architect 的提炼稿）。
output_key = "exploration"
# 打通信息漏斗：survey 原文（programmer 实读代码得到的文件清单、真实
# 行号、术语解释）也带出来，随方案一起下传给双评审。
# 此前评审只拿到被逐层压缩的 proposal，想核对事实无从核对——
# 实测实锤：双评审共报 5 处实测行号错误，而正确的行号就在 survey
# 原文里，只是从来没往下传。
export = { survey = "exploration" }

[[steps]]
id = "brainstorm"
description = "嵌套 design_brainstorm：基于探索结论做设计脑暴"
workflow = "design_brainstorm"
depends_on = ["explore"]
task = "{{topic}}\n\n用户画像：\n{{user_profile}}\n\n背景探索结论：\n{{exploration}}"
# 子 workflow 最后一步是 advisor_verdict（评审裁决），父级要的是
# synthesize 的方案本体 —— 否则下游拿到的是「裁决：✅ 通过…」评审
# 文本而不是方案（现场实锤：plan/评审步骤全被喂了 verdict）。
output_from = "proposal"
output_key = "design"

[[steps]]
id = "plan"
description = "嵌套 implementation_plan：把设计方案拆成任务清单"
workflow = "implementation_plan"
depends_on = ["brainstorm"]
task = "基于以下设计方案制定实现计划：\n{{design}}"
output_key = "plan"

# ── 并行组：两个评审互不依赖，同一 wave 并行 ──────────────────────
# 两个评审都同时收到「方案 + survey 原文」：方案讲的是要做什么，
# survey 原文是唯一的事实基线（真实文件、真实行号、真实约定）。
# 只给方案 = 让评审凭记忆核事实，必然产出错行号（实测实锤）。
[[steps]]
id = "req_review"
description = "嵌套 requirements_review（与 code_review 并行）"
workflow = "requirements_review"
depends_on = ["brainstorm"]
task = """评审以下设计方案的需求合理性：
{{design}}

【代码调研原文（事实基线，方案中的事实性描述以此为准）】
{{survey}}"""
output_key = "req_verdict"

[[steps]]
id = "code_review"
description = "嵌套 code_review（与 code_review 并行）"
workflow = "code_review"
depends_on = ["brainstorm"]
task = """评审以下设计方案涉及代码区域的质量风险：
{{design}}

【代码调研原文（事实基线，文件/行号/现有约定以此为准；与方案不符处按本节为准并指出）】
{{survey}}"""
output_key = "code_verdict"

# ── gate：总终审门 ────────────────────────────────────────────────
# REJECT → loop_until 不满足 → 自动跳回 brainstorm 重做设计（REJECT
# 原因作为【上轮审查反馈】预置进 prompt），重新脑暴 → 重拆计划 →
# 双评审 → 重判，最多 max_iterations 轮；耗尽仍 REJECT 才以 failed
# 收场（带 wf_id 可 resume）。
# 此前这里是 max_retries=0 + 契约 require PASS ——评审尽职尽责找到
# 真问题反而把整条流水线判死（实测实锤：唯一跑到 gate 的那次
# 运行，双评审共 6 条阻断 + 5 处实测行号错误，44 分钟流水线零产出）。
# 子层 implementation_plan 早已自带 REJECT→返工环，顶层不该更脆。
# ⚠️ 有条件通过 → PASS 但条件/修正项必须随计划一并带上（实测
# 实锤：实测行号错误随裸 PASS 被静默丢弃）；有实测错误未吸收进
# 计划时必须 REJECT。
[[steps]]
id = "gate"
description = "总终审门：REJECT 自动返工重做设计，耗尽迭代才失败"
role = "reviewer"
depends_on = ["plan", "req_review", "code_review"]
max_retries = 1
# REJECT → 跳回 brainstorm 重新生成设计，直到 PASS 或迭代耗尽。
# 契约只卡格式（必须有 VERDICT: 标记），放行与否交给 loop_until——
# 不能 require PASS，否则 REJECT 变成契约失败直接判死。
loop_until = "VERDICT: PASS"
loop_back_to = "brainstorm"
max_iterations = 3
task = """根据以下两份评审结论判定放行与否：

【需求评审】
{{req_verdict}}

【代码评审】
{{code_verdict}}

规则：
- 两份评审均为 ✅ 通过 → 第一行输出 `VERDICT: PASS`，然后**原样完整附上**下面的实现计划（不得增删改）：

【实现计划】
{{plan}}

- 任一份为 ⚠️ 有条件通过（无阻断问题）→ 第一行输出 `VERDICT: PASS`，然后以「【通过条件/修正项】」为标题**原样附上两份评审的全部条件与修正项**（一条都不许丢），再原样完整附上实现计划。修正项必须随计划一并交付，禁止静默丢弃。
- 任一份（无论裁决为何）指出实测错误（行号/路径/事实核验不符）且这些修正未在实现计划中体现 → 必须输出 `VERDICT: REJECT`，理由列出未吸收的实测错误。
- 任一份为 ❌ 不通过 / changes-requested / 存在阻断问题 → 只输出 `VERDICT: REJECT` 和阻断原因摘要（一两句，写清每条阻断的 file:line 证据，返工要用），**不要**附实现计划。
- 输出 REJECT 时，正文中不得再出现字符串「VERDICT: PASS」（会被循环条件误判为放行）。"""

[steps.output_contract]
require = ["VERDICT:"]
