# Workflow: learn_plan
# 学习/课程类拆分专用：把「学透这个仓库/主题」拆成一本书的目录（编/章任务树）。
# 与 implementation_plan 的分工：实现类拆分的产出要被 worker 直接执行，符号
# 拼写就是契约，breakdown 带 require_symbols_resolvable 硬门禁；学习类拆分的
# 产出是一本书的目录，章只锚定**真实存在的文件路径**（tasks_json 的
# require_plan_tasks 校验），符号级取证留给每章的 learn_loop plan 步现场做——
# 实测（2026-09-17 jemalloc 书目录 e2e，5 轮迭代）：把符号门禁套在书目录上
# 是打地鼠（42→7→19→1→21 个未命中），模型每轮重写都从训练记忆漏进新的
# 旧版符号/占位符（extents_pa_alloc、je_xxx、README），而目录章名根本不该
# 点名内部函数。门禁位置错了，不是模型不努力。
#
# 步骤与 implementation_plan 同构：breakdown（出目录草案）→ tasks_json（转
# 看板 JSON，路径存在性机械校验）→ verdict（终审，学习类检查清单）→
# gate（REJECT 按病灶路由返工）。

name = "learn_plan"
command = "/learn-plan"
description = "学习计划拆分：把「学透某仓库/主题」拆成一本书的目录（编=认知阶段、章=一次 learn_loop、节惰性展开），depends_on 先修链串成学习路径｜落点：任务看板条目（plan 弹窗勾选导入）+ 章任务的 learn_loop 流水线｜学习/课程/教材类「拆分任务、出学习计划」走这里，实现类拆分走 /plan"
max_rounds = 1

[[steps]]
id = "breakdown"
description = "出全书目录草案（编/章结构 + 先修链）"
speakers = ["architect"]
output_key = "plan"
max_retries = 1
# 取证下限：目录必须基于真实骨架（目录树/构建文件/模块符号索引），
# 不许凭训练记忆编。但不带 require_symbols_resolvable——见文件头注释。
require_tools_any = ["read", "code_graph", "search"]
prompt = """为以下学习目标设计一本书的目录：{{topic}}。

先读仓库骨架再拆：目录树、构建文件（Makefile/Cargo.toml/package.json 的模块清单）、
code_graph 的模块符号索引。**只读骨架、不逐文件深读**——拆 50 章的书不需要先读完
50 章的内容，file:line 级取证是每章学习阶段（learn_loop plan 步）的事。

输出形态（必须读起来像一本书，不像一摞阅读卡片）。**两条学习原则统领整本书的结构**：

**原则一：先抓主干，再填细节。** 把知识想象成一棵树：先搞懂树干和主要分支（基本原理），再去记树叶（细碎知识点），知识才挂得住。所以每一章必须归入四层之一，**阅读顺序层级只升不降**（地基 → 树干 → 枝干 → 树叶）：
- **层-地基**（0-2 章，可选）：让读者先把东西**跑起来、会用公开 API**（构建运行、入门 API 与配置）。只管“怎么用”，不讲内部原理；topic 里点名了“入门 / 上手”就必须有。
- **层-树干**（1-3 章）：这个系统**为什么存在、整体长什么样**。必含一章「推导章」（见原则二），再加一章「端到端走一遍」（跟一次最典型的请求从入口走到出口，只到模块 / 函数名这一级，不钻实现细节）。树干章用 `learn`（泛读讲解）类型，不锚定具体文件也可以。
- **层-枝干**：主要子系统，每个子系统一章。每章开头要能回答「它是推导里的哪一个必要环节 / 解决推导里的哪个矛盾」，答不上来说明它不该是枝干。
- **层-树叶**：**删掉它不影响理解主干和枝干**的东西——工具类 / 小构件 / 可替换的实现细节 / 调优参数 / 观测工具 / 动手验证。判据：被后面两章以上依赖的章不是树叶（引擎会查）；快照与可见性规则、事务、版本管理这类**别的机制要用它才讲得通**的，是枝干，不是树叶。
  **不要因为“其他章会用到”就把小构件提前**——主干章里把它当黑盒，到树叶层再打开；枝干章里需要时讲到够用即可，不单列。
  （反例：一本书的第 1 章是 `Slice`/`Status`/`Comparator` 这类基础构件，宏观架构排在第 3 章——读者还没见过森林就在认叶子。）

**原则二：回归本质（第一性原理）。** 不照搬别人的结论，拆到最基础的事实，从底层重新推导。树干里的**「推导章」**要做的事：列出 3-5 个最基础的事实（硬件 / 物理 / 业务约束，各带一个具体数字或例子），然后一步一步推出「所以系统必须这样设计」，推到能和真实系统的整体结构对上号为止。标题或描述里写明「推导」。
  （例：磁盘顺序写远快于随机写 + 内存断电即失 + 读要快 → 追加日志 + 内存有序表 + 分层有序文件 → 为什么必须有后台合并。）
  枝干章讲真实代码时，也要回到“这个设计是在应对推导里的哪个事实”，而不是只描述代码做了什么。
  **推导章里的基础事实要编号**（事实1、事实2…）；**每个枝干章的描述以「回应事实N：」开头**，写明它是哪条事实的解法（引擎会查；这句要一路传给后面精读这一章的流程，别省）。

其余规则：

1. **编 = 认知阶段**，按层级排：地基（跑起来、会用 API，可选）→ 树干 → 枝干（先主线后外围）→ 树叶（工具 / 观测 / 验证输出）。环境和入门 API 章属于**地基层**，排在树干前面，不是树叶。
2. **先把 topic 里点名的每一块列成覆盖清单，逐块落到章**——topic 说了“事务 / 并发 / 迭代器 / 缓存”，就每一块都要有章，不许因为凑章数把一块压没了。**大块拆开**：一个子系统含 3 个以上相对独立的机制（如事务含悲观 / 乐观 / 两阶段提交，压缩含选文件 / 执行 / 语义），按机制拆成 2-3 章，每章仍落在 100-6000 行；不要为了章数少把它们压成一章。
   **章 = 一个可独立学习验收的主题**（一章 = 一次 learn_loop）。**体量跟着锚点源码的实际行数走**，不是固定的 3-6 个知识点：
   每章 learn_loop 的产出约为「每个知识点一篇文章」，锚点文件加起来 < 300 行的章 1-2 个知识点就够，
   300-1200 行 2-4 个，更大的才到 5-6 个。**引擎会数**：单个锚点文件超过 3000 行代码、一章锚点合计超过 6000 行、不足 100 行（树干章除外）都会被打回——
   规划时 `wc -l` 锚点文件：超大文件（如几千行的 `db_impl.cc`）**不要整个当锚点**，paths 留空，在章描述里点名要读的函数；过薄的相邻章合并。
   **节不在本阶段展开**。
3. **锚点要能读出验收要求的东西——验收里出现的每个关键机制（类 / 函数），本章锚点里必须有定义它的那个文件**：先 `search` 它的定义（如 `class Arena`、`PessimisticTransaction::TryLock`、`VersionSet::LogAndApply`）确认在哪个文件，再把那个文件放进锚点；工厂 / 壳文件（只有 `new X(...)` 或 `main` 调一个函数的，如 `tools/db_bench.cc` 只有 21 行）不算实现，要锚真正的实现文件。C/C++ 的 `.h` 只有声明，验收若要「讲清成因 / 画时序 / 手绘算法」，必须同时锚定对应的 `.cc` 实现文件；只有头文件的章只能是“接口契约”章，并在描述里写明。
4. **章名用模块名 / 主题词 + 真实文件路径锚点**（如「第 3 编第 1 章 extent 层精读（锚点 src/extent.c）」），**不要点名内部函数 / 宏**——那是节级细节，现在写只会凭记忆编错。引用文件一律写带扩展名的完整相对路径。
5. 每章给出：章标题、**层级（树干 / 枝干 / 树叶）**、学什么（2-3 句）、**验收标准写「能讲清 / 能推出什么」**（如"能画出一次分配从入口到 cache_bin 的完整路径"），不写行号、不考细节记忆。
6. **先修链**：章与章的先后关系（后一章要用到前一章的概念才算真依赖；“主题相邻”“都是同一编”不算依赖——互不相干的章不要硬串成一条链）。
7. **螺旋上升优于一次到位**：同一主题允许出现两次（树干里“先走一遍”，枝干里“再拆开看”），但不许原样复读——后章必须明确写出进阶在哪。
8. **收尾必须有「验证与输出」章**（动手实现一个最小版本 / 写基准测试 / 把全书讲成一张图），归树叶层。

**总章数 ≤ 36（硬上限）**：清单要一次输出，超过 36 章会在输出上限处被截断、整步白跑（实测 50 章的目录转不成清单）。主题大、放不下时按这个顺序取舍：先把**相邻的树叶章**合并成专题章（工具链、IO 与编码、内存预算…），再合并同一机制内过细的枝干章；**不要砍掉 topic 里点名的任何一块**，也不要把互不相干的枝干并在一起。

**篇幅控制（硬约束）**：整份输出（含已核实锚点表）不超过 **16000 字**，超了会在输出上限处被截断、整步白跑。
全书结构说明 ≤ 600 字；推导章单独写 3-5 条“基础事实 → 推论”共 ≤ 800 字（其余章不展开推导）；
**其余每章只写 4 行**：`标题（层级 / 锚点路径）`、`学什么（一句）`、`验收（一句，能讲清 / 能推出什么）`、`先修（章号）`；
先修链、风险各 ≤ 300 字。不要重复解释上面的原则，直接给结果。

**已核实锚点表（必须有，下一步只许从这里取 paths）**：目录末尾附一张表，列出你在各章里用到的**每一个锚点文件**：`路径 | 非空行数`。路径必须是你用 `ls` / `search` / `wc -l` 亲眼确认存在的，行数以 `wc -l` 为准（不要用函数末行号推行数）；确认不了的文件不要放进目录，也不要放进这张表。超过 3000 行的文件不当锚点（不列入表）。表算在总篇幅里，每行一个文件，不加说明。

输出：1) 全书结构说明（为什么这么编排）；2) 编/章目录（每章带上面第 4 条的内容）；
3) 先修链说明；4) 风险与未知项（哪些章的内容你还没把握、学到时可能要调整）。"""

[steps.output_contract]
min_chars = 200
# 目录要转成一次输出的 JSON 清单：目录本身太长（章数过多）就转不下，在这里先拦。
max_chars = 19000
forbid = ["TBD", "待补充", "占位符"]

[[steps]]
id = "tasks_json"
description = "把目录转成任务看板数据结构"
speakers = ["architect"]
output_key = "tasks"
# 清单 JSON 较长，撞输出上限/格式瑕疵时给重试机会（实测第一跑就被截断）。
max_retries = 2
# 机械校验：paths 存在性、清单内重叠、workflow/task_type 名。章任务锚定
# 真实文件路径即可——符号级正确性不在这里卡（见文件头注释）。
require_plan_tasks = true
# 书目录的结构校验（引擎数的）：层级标签齐全且顺序先主干后枝叶、树干里有推导章、锚点体量合理、不只锚头文件。
require_learn_book = true
# 这一步是纯转换：路径已在上一步核实过（目录末尾的「已核实锚点表」），不再需要探索仓库。
# 实测它一边 ls / search 一边把思考过程写进正文，输出预算被耗光，JSON 没出来就被截断。
tools = ["read"]
tool_call_limits = { read = 10 }
prompt = """把这份学习目录转成任务看板数据结构：
{{plan}}
严格输出一个 ```json 代码块。**这一步是纯转换，不要探索仓库，不要输出任何思考 / 核实过程**（正文第一个字符就是 ```json）；paths 从目录末尾的「已核实锚点表」里取。
**返工时**（本 prompt 末尾带【上轮审查反馈】）：只改反馈点名的那几章的 paths / depends_on / 描述，其余章原样照抄；换路径前用 `read` 打开目录核实（read 一个目录会列出它的文件），不许凭印象写；章号、标题、顺序仍与目录一致。**JSON 代码块之外不写任何文字——不写思考过程、不写说明、不写前后缀。**
**JSON 用紧凑格式**（不缩进、不多余换行），且**控制单条规模**：
**章数以 breakdown 的目录为准（≤ 36 个），目录里的章一章不许丢**——合并就是丢覆盖（实测并成 20 章后事务、观测、动手验证被挤进同一章）。
控制规模靠压缩每一条：**description 尽量 ≤ 100 字（引擎硬上限 260，超了打回）**、验收一句话，细节留在 breakdown 文档里，清单只放骨架。**空字段不要写**（`workflow`、`subtasks`、空的 `depends_on` / `paths` 都省略），每条才压得进去；把一整本书一次输出，超过输出上限就整步白跑。
超长的 JSON 会撞输出上限被截断，截断即整步打回（实测多次在此翻车）。
schema：
{"tasks": [{"title": "必填，一句话（带章节号，如「第 2 编第 1 章 fastpath 精读」）", "description": "学什么+验收标准（验收写「能讲清/能推出什么」，不写行号）", "priority": 1-4（1最高）, "labels": ["学习", "只读", "层级标签（必填，四选一）：层-地基 / 层-树干 / 层-枝干 / 层-树叶", "编分组标签，如 第2编-精读主线"], "task_type": "learn_loop（精读者，枝干 / 树叶的精读章）/learn（泛读讲解，树干章用这个）/build_verify（含动手实验、编译构建或验证输出章，如「环境/工具根依赖章」「验证与输出收尾章」）/unit_test（专跑单测验证的章）/research（纯摸底）", "workflow": "默认留空", "depends_on": ["先修章的标题原文——学习类任务不适用默认并行，先修链必须全部落在这里"], "paths": ["可选：只写核实过存在的路径，不确定留空数组"], "subtasks": [同构，任意深度]}]}
要求：
- **章是任务本体，编只是标签**：每章一个任务（标题如「第2编第1章 fastpath 精读」），
  编用 labels 分组（如「第2编-精读主线」）。**禁止编级容器任务**——标题里带
  「（N章）」把多章捆成一个任务是错误形态（那样的任务对 learn_loop 太大，
  一次学不完）。depends_on 串在章与章之间（可以跨编指向另一编的某章）。
- 编用 labels 表达（如「第2编-精读主线」）；depends_on 串起先修链，
  环境/工具章通常是全书的根依赖。
- **章节号顺序 = 阅读顺序 = depends_on 拓扑序**：不允许「第 N 章依赖第 M 章但
  M > N」——编号靠后的章不能被编号靠前的章依赖。发现依赖要求后章先读时，
  要么把被依赖章的编号提前，要么去掉这条伪依赖。
- 章级 paths 写本章锚定的真实文件/目录前缀；labels 必须含「学习」「只读」和**且只有一个**层级标签（`层-地基` / `层-树干` / `层-枝干` / `层-树叶`）。**learn_loop 精读章必须有 paths**（1-4 个 .cc / .c 文件）：paths 留空会让体量检查失效，精读时也不知道读哪儿。**每个路径都必须是你在这一步用 `ls` / `search` 亲眼确认存在的**——不要凭类名猜文件名（类名 ≠ 文件名，如 `ColumnFamilyOptions` 实际在 `options/cf_options.cc`），也不要照搬 breakdown 里标着“未验证”的候选；一次 `ls` 一个目录、一次 `search` 列出同功能的文件，比被机械校验打回两次便宜得多。确认不了就换一个确认存在的同功能文件。
- 标题统一写「第N章 …」，N 从 1 开始连续编号（不跳号、不丢第 1 章；合并章时顺延重排）。枝干章的 description 以「回应事实N：」开头（总长仍尽量 ≤ 100 字）。
- **章号、标题、顺序必须与目录文档完全一致**：这一步只是把目录转成 JSON，不许重排、改名、合并或拆分章（目录和清单两套编号会让终审和读者都无从对照；要调整就回目录改）。树干章（`learn` 类型）允许没有 paths。
- **清单顺序 = 阅读顺序，层级只升不降**：先地基章，再树干章，再枝干章，最后树叶章；树干章里必须有一章标题或描述含「推导」。
- 引擎会按锚点源码数体量并打回：单文件 > 3000 行代码、一章合计 > 6000 行、非树干章 < 100 行、只锚头文件但验收要求读出行为——按提示改（超大文件从 paths 去掉并在描述里点名函数；过薄的合并；头文件配上 .cc）。
- 任务粒度：一章是一次 learn_loop 的体量，不是一天的阅读量；太大就在 subtasks
  里拆节（沿用章节号，如 2.1.1），但默认不拆——节的细化留给学习时的 plan 步。
- 每个任务都能独立验收；depends_on 指向的标题必须是清单里真实存在的标题原文。
- **paths 可选，宁空勿猜**：只写 breakdown 阶段**核实过存在**的路径；不确定就留空——
  章任务的 labels 已带「学习」「只读」，不参与范围冲突校验，执行时由 learn_loop
  现场取证，paths 在这里只是提示锚点。凭印象猜路径（尤其 test/ 下的文件名）会被
  机械校验整单打回（实测 jemalloc 的 test/unit/bin.c 这类幻觉路径反复出现）。"""

[[steps]]
id = "verdict"
description = "终审（学习类检查清单）"
speakers = ["reviewer"]
output_key = "verdict"
# 抽查而非全量核验：实测 reviewer 逐项核验会把工具调用打成小时级
# （2026-09-17 e2e 实录：gate 对着截断 verdict 核验 .rst 引用烧了 4 小时），
# 且工具阶段过长会把输出预算耗尽（verdict 产出被截成 115 字符）。
max_retries = 2
tool_call_limits = { read = 8, search = 8, code_graph = 8 }
require_tools_any = ["read", "code_graph", "search"]
prompt = """终审这份学习计划：
【拆解】{{plan}}
【任务清单】{{tasks}}

按裁决格式输出。**抽查即可**：paths / 符号存在性抽 3-5 处（优先最可疑的），工具调用总量 ≤ 10 次。

**引擎已经机械校验过、不要再审的**（这些不会错，审了也只会制造返工）：清单 JSON 合法；每个 path 真实存在且出自目录的已核实锚点表；
章号连续、清单与目录的章号 / 标题一一对应；depends_on 只指向排在前面的真实章（无倒置、无环）；层级先地基 / 树干后枝叶、树干有推导章；
锚点体量在区间内、没有大文件整份当锚点、同一文件最多 2 章共用；枝干描述带「回应事实N」；描述长度。
目录正文和清单在措辞、锚点细节上的出入以**清单为准**，不算问题。

**阻断（blocking）只有下面三类**，其余一律不是阻断：
- B-覆盖：topic 里**点名**的某一块（如“事务”“Compaction”“Cache”）在清单里**一章都没有**；
- B-倒置：某章验收**必须**用到的知识，只在**它后面**的章才讲（不是“讲得更深”，是“完全没讲过”）；
- B-实测：你抽查发现清单里某个 path / 章名点名的符号**确实不存在**（附上你调用工具的结果）。

**改进意见（important / nit）**：验收与锚点细节不贴、某机制的定义文件没锚上、两章内容有交叉、可以拆得更细、缺某个次要机制、
伪依赖、体量偏薄 / 偏厚……这些写进「改进意见」，**它们随清单交付给精读阶段**（每章 learn_loop 会现场取证、自己补锚点），不阻断放行。

学习类检查清单（据此找问题，再按上面分级）：① 覆盖 topic 点名的每一块；② 编排先主干后枝叶、树干真讲“为什么存在 / 整体长什么样”、推导章从基础事实一步步推；
③ 每章验收是「能讲清 / 能推出什么」；④ 章之间有无复读；⑤ 有无「验证与输出」收尾章；⑥ 伪依赖；⑦ 章体量与验收是否匹配。

裁决只有三种，**和阻断项一致**：没有阻断项 → ✅ 通过（可以带改进意见）；有阻断项 → ❌ 不通过。**不要写“有条件通过”**——
那会和阻断项自相矛盾（实测：裁决写“有条件通过”、正文却列了 3 条阻断，下游无从判断）。
输出结构：`## 裁决` → `## 阻断问题`（没有就写“无”）→ `## 改进意见`（逐条：章号 + 问题 + 建议）。"""

# ── gate：终审门（与 implementation_plan 同一套返工机制）─────────────
[[steps]]
id = "gate"
description = "终审门：REJECT 自动返工，耗尽迭代才失败"
speakers = ["reviewer"]
max_retries = 2
# 同 verdict：抽查复核，不许全量重验（防止对着长清单烧小时级工具调用）。
tool_call_limits = { read = 6, search = 6, code_graph = 6 }
loop_until = "VERDICT: PASS"
loop_back_to = "breakdown"
loop_no_release_on = "VERDICT: REJECT"
max_iterations = 3
prompt = """根据以下终审结论判定放行与否：

【终审结论】
{{verdict}}

规则（只看「阻断问题」一节，不看裁决措辞）：
- 「阻断问题」为“无”（或只有改进意见）→ 第一行输出 `VERDICT: PASS`，然后以「【改进意见（随清单交付精读阶段）】」为标题**原样附上终审的全部改进意见**（一条都不许丢），再原样完整附上下面的任务清单（不得增删改任务）：

【任务清单】
{{tasks}}

- 「阻断问题」里有 B-覆盖 / B-倒置 / B-实测 任一条 → 只输出 `VERDICT: REJECT` 和阻断原因摘要（写清证据，返工要用），**不要**附任务清单。
  终审把改进意见写进了阻断问题一节、但它不属于这三类的，不算阻断。
- 输出 REJECT 时，正文中不得再出现字符串「VERDICT: PASS」（会被循环条件误判为放行）。
- **输出 REJECT 时必须另起一行标注病灶步**，二者选一（照抄，不要改写）：
  - `REWORK: tasks_json` —— 只是清单里某几章的 paths / depends_on / 描述要改，目录本身没问题（B-实测、单条 B-倒置多半是这种）。
  - `REWORK: breakdown` —— 目录层面的：缺整块（B-覆盖）、章序要整体重排。
  判不准时选 `REWORK: tasks_json`（只改清单，便宜得多；真需要动目录，下一轮终审会再指出）。"""

[steps.loop_back_routes]
"REWORK: tasks_json" = "tasks_json"
"REWORK: breakdown" = "breakdown"

[steps.output_contract]
require = ["VERDICT:"]
