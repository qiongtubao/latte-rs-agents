name = "code_review"
description = "多角度代码审查：覆盖安全、风格与逻辑。"
max_rounds = 1

[[steps]]
id = "explain"
speakers = ["programmer"]
prompt = "解释 {{code_path}} 处的代码变更。改了什么，为什么改？"

[[steps]]
id = "review"
speakers = ["reviewer", "security", "tester"]
prompt = "审查上面描述的代码变更。Reviewer：模式与代码质量。Security：漏洞。Tester：边界用例和测试覆盖缺口。"

[[steps]]
id = "respond"
speakers = ["programmer"]
prompt = "回应审查反馈。对每一条意见，要么接受并解释修复方案，要么讲清楚理由反驳。"
[[steps]]
# 终审：Advisor 对整场讨论/全部产出做最终把关，输出 ✅/⚠️/❌ 裁决。
id = "advisor_verdict"
description = "Advisor reviews all outputs and gives the final verdict"
speakers = ["advisor"]
prompt = "你现在是终审顾问。通读上面的全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。"
