# Workflow: code_review
# 代码审查：变更说明 → 审查 → 回应 → 终审。
# 步骤间用 output_key 显式穿线（mini-engine 跨步骤只传 output_key 变量）。
# 也是任务看板 human_review 阶段自动执行的审查流程。

name = "code_review"
description = "代码审查：变更说明 → 多角度审查 → 回应 → 终审"
max_rounds = 1

[[steps]]
id = "explain"
description = "变更说明"
speakers = ["programmer"]
output_key = "changes"
prompt = "说明这次变更：{{topic}}。用工具读相关代码，禁止凭记忆。输出：1) 改了什么（文件/逻辑）；2) 为什么这样改；3) 爆炸半径（受影响的调用方/行为）。"

[[steps]]
id = "review"
description = "多角度审查"
speakers = ["reviewer", "tester"]
output_key = "feedback"
prompt = "审查这次变更：\n{{changes}}\nReviewer：设计、模式、代码质量（按 blocking/important/nit 分级）。Tester：边界用例与测试覆盖缺口。各自输出编号意见清单，每条附证据（file:line）。"

[[steps]]
id = "respond"
description = "逐条回应"
speakers = ["programmer"]
output_key = "response"
prompt = "回应审查意见：\n【变更说明】{{changes}}\n【审查意见】{{feedback}}\n对每一条意见：接受（给修复方案）或反驳（给理由）。输出逐条对应表。"

[[steps]]
id = "verdict"
description = "终审裁决"
speakers = ["reviewer"]
prompt = "终审这次变更审查：\n【变更】{{changes}}\n【意见】{{feedback}}\n【回应】{{response}}\n按裁决格式输出：裁决（✅/⚠️/❌）、理由（引用证据）、阻断问题、后续建议。只报告有证据、可行动的问题。"
