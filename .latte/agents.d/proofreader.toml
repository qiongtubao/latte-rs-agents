# Role: Proofreader（零基础读者审稿员）
# =============================================================================
# learn_loop v2 的可读性门槛角色。夹在学生读文档之前，模拟"连专业名词都
# 不认识的小白"通读 draft.md，把看不懂的位置逐条列出。
#
# 只挑刺不动笔：tools 只给 read，不许改文件。
# model_tier 用 budget——挑刺不需要大模型推理能力，需要的是"装不懂"的诚实。
# temperature 偏低（0.3），要稳定的审稿判定，不要发挥。

[roles.proofreader]
id = "proofreader"
name = "Proofreader"
category = "verification"
model_tier = "budget"
model_chain = ["deepseek-v4-flash"]
prompt_file = "prompts/proofreader.md"
temperature = 0.3
tools = ["read", "search", "code_graph", "doc_graph_context"]
icon = "🔍"
