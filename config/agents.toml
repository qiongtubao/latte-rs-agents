# Agent Role Configuration
# =============================================================================
# This file is the merged single-file agent config — all 10 roles in one file.
# Each [roles.<id>] section defines a role that participates in discussions.
#
# Prefer the per-file layout (config/agents/*.toml) for user editing.
# This merged file exists for backward compatibility and for the install script.
#
# Role categories:
#   planning     — upfront design/requirements (pm, architect, designer, manager)
#   execution    — hands-on implementation (programmer, devops, tech_writer)
#   verification — quality assurance (tester, reviewer, security)
#
# Model tiers:
#   premium  — best quality (Claude Opus)
#   standard — balanced quality (Claude Sonnet, GPT-4o)
#   budget   — fast/cheap (DeepSeek, Qwen)

# ─── Planning Roles ──────────────────────────────────────────────────────

[roles.pm]
id = "pm"
name = "Product Manager"
description = "产品经理：定义要构建什么，写用户故事、排需求优先级、果断砍范围"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/pm.md"
temperature = 0.7
tools = ["read", "list", "search"]
icon = "📋"

[roles.architect]
id = "architect"
name = "System Architect"
description = "系统架构师：评估系统设计、分析模块边界与耦合，把目标拆成可实现的工作项"
category = "planning"
model_tier = "premium"
prompt_file = "prompts/architect.md"
temperature = 0.5
tools = ["read", "list", "search"]
icon = "🏗️"

[roles.designer]
id = "designer"
name = "UI/UX Designer"
description = "UI/UX 设计师：用户体验、无障碍、交互设计与视觉一致性"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/designer.md"
temperature = 0.7
tools = ["read"]
icon = "🎨"

[roles.manager]
id = "manager"
name = "Engineering Manager"
description = "技术负责人：理解需求、把任务分派给专家角色，对最终结果负责"
category = "planning"
model_tier = "premium"
prompt_file = "prompts/manager.md"
temperature = 0.5
tools = ["delegate", "workflow", "read", "search", "plan", "ask"]
icon = "👔"

# Fallback model chain in priority order (highest first).
# See config/agents/manager.toml for rationale.
model_chain = ["deepseek-v4-flash"]

[roles.task_planner]
id = "task_planner"
name = "Task Planner"
description = "任务拆分规划师：把看板任务拆成可独立执行、可独立验收的子任务"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/task_planner.md"
temperature = 0.3
tools = ["read", "search", "plan"]
icon = "🧩"
model_chain = ["deepseek-v4-flash"]

# ─── Execution Roles ─────────────────────────────────────────────────────

[roles.programmer]
id = "programmer"
name = "Software Engineer"
description = "动手实现代码：写功能、修 bug、跑构建和测试验证"
category = "execution"
model_tier = "budget"
prompt_file = "prompts/programmer.md"
temperature = 0.3
tools = ["read", "write", "bash", "search"]
icon = "💻"

[roles.devops]
id = "devops"
name = "DevOps Engineer"
description = "DevOps/SRE 工程师：交付流水线、基础设施即代码、监控告警与事故响应"
category = "execution"
model_tier = "budget"
prompt_file = "prompts/devops.md"
temperature = 0.3
tools = ["read", "bash", "write"]
icon = "🚀"

[roles.tech_writer]
id = "tech_writer"
name = "Technical Writer"
description = "技术文档撰写者：为开发者写精确、可扫读、有证据的文档"
category = "execution"
model_tier = "budget"
prompt_file = "prompts/tech_writer.md"
temperature = 0.5
tools = ["read", "write"]
icon = "📝"


[roles.tutor]
id = "tutor"
name = "Tutor"
description = "互动学习辅导员：把主题拆成知识点逐个教学，用选择题检验掌握程度"
category = "execution"
model_tier = "standard"
prompt_file = "prompts/tutor.md"
temperature = 0.5
tools = ["read", "write", "ask"]
icon = "🎓"
# ─── Verification Roles ──────────────────────────────────────────────────

[roles.tester]
id = "tester"
name = "QA Engineer"
description = "QA 工程师：先用证据证明系统是错的，交付可复现步骤与抓回归的测试"
category = "verification"
model_tier = "budget"
prompt_file = "prompts/tester.md"
temperature = 0.4
tools = ["read", "list", "bash", "search"]
icon = "🧪"

[roles.reviewer]
id = "reviewer"
name = "Code Reviewer"
description = "代码审查者：按证据把关代码质量与缺陷，给出具体可执行的反馈"
category = "verification"
model_tier = "standard"
prompt_file = "prompts/reviewer.md"
temperature = 0.4
tools = ["read", "list", "search"]
icon = "🔍"

[roles.security]
id = "security"
name = "Security Auditor"
description = "安全审计员：系统性评估代码、架构、依赖与运维配置中的漏洞并分级"
category = "verification"
model_tier = "standard"
prompt_file = "prompts/security.md"
temperature = 0.4
tools = ["read", "list", "search"]
icon = "🛡️"

[roles.advisor]
id = "advisor"
name = "Senior Advisor"
description = "资深终审顾问：解释根因、权衡取舍，对方案与结论做最终把关，不动手写代码"
category = "verification"
model_tier = "premium"
prompt_file = "prompts/advisor.md"
temperature = 0.4
tools = ["read", "search"]
icon = "🦉"
