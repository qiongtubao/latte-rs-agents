# Agent Role Configuration
# =============================================================================
# This file is the merged single-file agent config — all 10 roles in one file.
# Each [roles.<id>] section defines a role that participates in discussions.
#
# Prefer the per-file layout (config/agents/*.toml) for user editing.
# This merged file exists for backward compatibility and for the install script.
#
# Role categories:
#   planning     — upfront design/requirements (pm, architect, designer, manager)
#   execution    — hands-on implementation (programmer, devops, tech_writer)
#   verification — quality assurance (tester, reviewer, security)
#
# Model tiers:
#   premium  — best quality (Claude Opus)
#   standard — balanced quality (Claude Sonnet, GPT-4o)
#   budget   — fast/cheap (DeepSeek, Qwen)

# ─── Planning Roles ──────────────────────────────────────────────────────

[roles.pm]
id = "pm"
name = "Product Manager"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/pm.md"
temperature = 0.7
tools = ["read", "list", "search"]
icon = "📋"

[roles.architect]
id = "architect"
name = "System Architect"
category = "planning"
model_tier = "premium"
prompt_file = "prompts/architect.md"
temperature = 0.5
tools = ["read", "list", "search"]
icon = "🏗️"

[roles.designer]
id = "designer"
name = "UI/UX Designer"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/designer.md"
temperature = 0.7
tools = ["read"]
icon = "🎨"

[roles.manager]
id = "manager"
name = "Engineering Manager"
category = "planning"
model_tier = "premium"
prompt_file = "prompts/manager.md"
temperature = 0.5
tools = ["delegate", "workflow", "read", "search", "plan", "ask"]
icon = "👔"

# Fallback model chain in priority order (highest first).
# See config/agents/manager.toml for rationale.
model_chain = ["deepseek-v4-flash"]

[roles.task_planner]
id = "task_planner"
name = "Task Planner"
category = "planning"
model_tier = "standard"
prompt_file = "prompts/task_planner.md"
temperature = 0.3
tools = ["read", "search", "plan"]
icon = "🧩"
model_chain = ["deepseek-v4-flash"]

