# Model Catalog & Tier Configuration
# Compatible with latte-rs-model-router/models.toml format, extended with tier mapping.
#
# This file defines:
#   1. Tier mappings — which model ID to use at each quality tier
#   2. Per-role tier overrides — role-specific model assignments
#   3. Model definitions — concrete model metadata (API, context window, cost, etc.)
#
# Three-layer resolution (lowest → highest priority):
#   1. Global config  (~/.latte/models.yaml or ~/.latte/models.d/*)
#   2. Project config  (this file, typically config/models.toml)
#   3. CLI overrides   (--api-key, --model-override id.field=value)
#
# Within each layer, identical provider/name entries merge by filling empty
# fields (a project model with a real api_key is not clobbered by a global
# entry).
#
# ⚠️ `ModelDef` 没有独立的 `id` 字段：`name` 就是 model id（同时是 API 请求
# 里的 `model` 字段和 tier 映射引用的键）。历史上这里写过
# `id = "claude-opus-4-20250514"` + `name = "Claude Opus 4"`（展示名），
# serde 静默丢弃 `id`，导致 catalog 里出现 `anthropic/Claude Opus 4`
# 这种无法解析的脏条目 —— 不要这么写。

# ─── Tier Mappings ───────────────────────────────────────────────────────────
# Global tier → model_id. These are the defaults used when a role has no
# per-role override. Tiers represent quality/cost levels:
#   premium  — best available model (highest quality, highest cost)
#   standard — balanced quality/cost
#   budget   — fast/cheap model (lowest cost, acceptable quality)
#
# 2026-08-17: 移除 anthropic/openai/ollama 条目（无 API key、qwen2.5-coder
# 未拉取），tier 默认全部落到有 key 的 deepseek。

[models.tiers]  # was: [tiers] (top-level) — serde ignored it; must nest under [models] for AgentConfig::parse
premium = "deepseek-v4-flash"
standard = "deepseek-v4-flash"
budget = "deepseek-chat"

# ─── Per-Role Tier Overrides (optional) ─────────────────────────────────────
# Override which model a specific role uses at each tier.
# Format: [models.role_tiers.<role_id>]
#   premium  = "model-id"   # model used when role runs at premium tier
#   standard = "model-id"   # model used when role runs at standard tier
#   budget   = "model-id"   # model used when role runs at budget tier
#
# Must be nested under [models] because `role_tiers` is a field of
# `ModelCatalog` (the `models` table). A bare `[role_tiers.X]` at the
# top level is silently ignored by serde.
#
# If a role is not listed here, it falls back to the global [models.tiers] mapping.
# If a tier is not specified for a role, that tier falls back to the global tier.

[models.role_tiers.pm]  # was: [role_tiers.pm] (top-level)
premium = "deepseek-v4-flash"  # was: claude-opus (no API key)
standard = "deepseek-v4-flash"  # was: claude-sonnet (no API key) — fallthrough to deepseek-chat hallucinates
budget = "deepseek-chat"

[models.role_tiers.architect]  # was: [role_tiers.architect] (top-level)
premium = "deepseek-v4-flash"  # was: claude-opus (no API key)
standard = "deepseek-v4-flash"  # was: claude-sonnet (no API key)
budget = "deepseek-chat"

[models.role_tiers.programmer]  # was: [role_tiers.programmer] (top-level)
premium = "deepseek-v4-flash"  # was: claude-sonnet (no API key)
standard = "deepseek-v4-flash"  # was: deepseek-chat (hallucinates instead of actually invoking tools)
budget = "deepseek-v4-flash"  # was: qwen2.5-coder-32b-instruct (Ollama timed out at 30s)

[models.role_tiers.manager]  # was: [role_tiers.manager] (top-level)
# 2026-06-25: switched all three tiers to glm-5.2 (5h resource refresh,
# user preference).
premium = "glm-5.2"
standard = "glm-5.2"
budget = "glm-5.2"

[models.role_tiers.reviewer_sanity]  # Layer 1 — fast fact-check
# 2026-06-26: switched all three tiers to deepseek-v4-flash because
# the budget mapping (qwen2.5-coder-32b-instruct via Ollama) was
# timing out at 30s on machines without a local Ollama server.
# The "cheap fact-check on every output" rationale was sound in
# theory but the Ollama dependency made it unreliable in practice.
premium = "deepseek-v4-flash"
standard = "deepseek-v4-flash"
budget = "deepseek-v4-flash"

[models.role_tiers.reviewer_architecture]  # Layer 2 — design/dependency check
premium = "deepseek-v4-flash"  # was: claude-sonnet (no API key)
standard = "deepseek-v4-flash"
# deepseek-chat at the budget tier so this role still has a
# working model even on machines without Ollama running.
budget = "deepseek-chat"

[models.role_tiers.reviewer_security]  # Layer 3 — deep security/audit
# was: premium=opus / standard=sonnet (no API key) — 全部落到有 key 的
# deepseek-v4-flash。
premium = "deepseek-v4-flash"
standard = "deepseek-v4-flash"
budget = "deepseek-v4-flash"

# ─── Model Definitions ───────────────────────────────────────────────────────
# Each [[models.models]] block defines one AI model.
#
# Required fields:
#   name             — model id：tier 映射/CLI 标志引用的键，同时是 API
#                      请求里的 `model` 字段（不是展示名！）
#   api              — API protocol: "anthropic" | "openai" | "google"
#   provider         — provider slug: "anthropic" | "openai" | "deepseek" | "ollama" | "google"
#   base_url         — API endpoint base URL
#   api_key          — API key; use "${ENV_VAR}" to reference environment variables
#   context_window   — max input tokens the model accepts
#   max_tokens       — max output tokens per generation
#
# Optional fields:
#   supports_thinking — whether the model supports extended thinking/reasoning (default: false)
#   cost_per_million_input  — USD per 1M input tokens (for cost tracking)
#   cost_per_million_output — USD per 1M output tokens (for cost tracking)
#   tier             — which tier this model belongs to (informational, not used for resolution)

# ─── DeepSeek Models ─────────────────────────────────────────────────────────

[[models.models]]
name = "deepseek-chat"
api = "openai"
provider = "deepseek"
base_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
context_window = 65536
max_tokens = 8192
supports_thinking = false
cost_per_million_input = 0.27
cost_per_million_output = 1.10
tier = "budget"

[[models.models]]
name = "deepseek-v4-flash"
api = "openai"
provider = "deepseek"
base_url = "https://api.deepseek.com"
api_key = "${DEEPSEEK_API_KEY}"
context_window = 1000000
max_tokens = 384000
supports_thinking = false
cost_per_million_input = 0.14
cost_per_million_output = 0.55
tier = "budget"

# ─── GLM Models ──────────────────────────────────────────────────────────────
# GLM 5.2 (Zhipu/Z.AI). Per-model `timeout_secs = 120` because the model
# is slow on 8-step tasks; the default 60s in the CLI fires before GLM
# can complete. Resolution order in `register_delegate_tool`:
#   1. model.timeout_secs  (this field — 120s for glm-5.2)
#   2. LATTE_AGENT_DELEGATE_TIMEOUT_SECS env var
#   3. DEFAULT_DELEGATE_TIMEOUT_SECS (60s)
#
# `api_key` uses ${GLM_API_KEY} so secrets stay out of git. Operators
# set the env var in their shell, or override via the global
# ~/.latte/models.yaml (which is gitignored).

[[models.models]]
name = "glm-5.2"
api = "openai"
provider = "glm"
base_url = "https://yuanyuaicloud.cn/v1"
api_key = "${GLM_API_KEY}"
context_window = 1000000
max_tokens = 384000
supports_thinking = false
cost_per_million_input = 0.27
cost_per_million_output = 1.10
tier = "standard"
timeout_secs = 120  # GLM 5.2 is slow on 8-step tasks
