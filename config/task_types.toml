# 任务类型注册表（Task Types Registry）
# 可配置：改这里即新增/删除类型与默认工作流；运行时同时支持项目层覆盖
# `<cwd>/.latte/task_types.toml`（存在即覆盖本文件，仅覆盖声明的 type）。
#
# 规则：
# - 未填 task_type 或 workflow 的任务 → 普通 manager 主导的 session（不走 workflow）
# - 填 task_type 未填 workflow → 按本表 default_workflow 自动推导
# - 显式填 workflow → 覆盖类型默认（以显式为准）
# - default_workflow = "" 或缺省 → 不绑定 workflow，走 manager
# - isolated = true/false → 该类型的任务是否在独立 git worktree 里执行；
#   缺省时按内建判断（只读类型 research/learn/learn_loop 关，其余开）

[types.feature]
label = "功能开发"
description = "新功能、迭代需求，测试先行 + 实现 + 双重审查"
default_workflow = "tdd_development"
color = "#3b82f6"
icon = "✨"
isolated = true

[types.bugfix]
label = "缺陷修复"
description = "Bug 分诊：复现 → 根因 → 修复方案 → 终审"
default_workflow = "bug_triage"
color = "#ef4444"
icon = "🐛"
isolated = true

[types.learn]
label = "学习任务"
description = "文档驱动学习：源码取证、教程、弹窗答题、答错返工，直到掌握"
default_workflow = "learn_loop"
color = "#8b5cf6"
icon = "📚"
isolated = false

[types.research]
label = "探索调研"
description = "通读代码/文档，摸清结构与术语，产出决策背景"
default_workflow = "explore"
color = "#06b6d4"
icon = "🔍"
isolated = false

[types.learn_loop]
label = "交互学习"
description = "交互式学习循环：知识点拆解→弹窗出题→掌握报告，每轮 subagent 隔离不涨 token；默认附注释版代码副本，主题带「同步注释」可把注释写进源码"
default_workflow = "learn_loop"
color = "#a78bfa"
icon = "🎓"
isolated = false

[types.docs]
label = "文档写作"
description = "写 doc-graph 文档并更新索引"
default_workflow = "write_doc"
color = "#10b981"
icon = "📝"
isolated = true

[types.build_verify]
label = "构建验证"
description = "跑通工程构建、验证产物、沉淀可复用构建/测试脚本（学习树的「环境/工具根依赖章」与「验证输出收尾章」归此类，而非 feature）"
default_workflow = "build_verify"
color = "#f59e0b"
icon = "🔨"
isolated = true

[types.unit_test]
label = "单测验证"
description = "定位测试体系、运行单测、独立核对真实通过/失败、沉淀可复用测试脚本"
default_workflow = "unit_test"
color = "#eab308"
icon = "🧪"
isolated = true

[types.chore]
label = "杂项/运维"
description = "不适合固定流水线的杂事，走普通 manager 会话"
default_workflow = ""
color = "#64748b"
icon = "🔧"

isolated = false