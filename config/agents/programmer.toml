# Role: Software Engineer
# =============================================================================
# This file defines an AI agent role. Each role has:
#   - a system prompt (markdown file that shapes the agent's personality)
#   - a default model tier (quality/cost level)
#   - allowed tools (what the agent can do)
#   - generation parameters (temperature controls creativity)
#
# Fields explained in detail below.

[roles.programmer]
# Unique identifier — used in CLI flags, workflow steps, and tier mappings.
id = "programmer"

# Human-readable display name — shown in logs and discussion transcripts.
name = "Software Engineer"
description = "动手实现代码：写功能、修 bug、跑构建和测试验证"

# Lifecycle category determines when the role participates in a discussion:
#   planning     — upfront design/requirements (pm, architect, designer, manager)
#   execution    — hands-on implementation (programmer, devops, tech_writer)
#   verification — quality assurance (tester, reviewer, security)
category = "execution"

# Default model tier — which quality/cost level this role uses by default.
#   premium  — best quality (e.g., Claude Opus)
#   standard — balanced (e.g., Claude Sonnet, GPT-4o)
#   budget   — fast/cheap (e.g., DeepSeek, Qwen)
# Override with --tier flag or per-role tier in models.toml.
# Switched from "budget" to "standard" (2026-06-26) so the
# default head model is deepseek-v4-flash via the role_tiers
# mapping, instead of qwen2.5-coder-32b-instruct via Ollama
# (which timed out at 30s on machines without a local server).
model_tier = "standard"

# Fallback model chain — pinned to deepseek-v4-flash so specialists
# always have a working model (deepseek-v4-flash has the real API key
# in ~/.latte/models.yaml, while Ollama/qwen2.5 needs a local server).
model_chain = ["deepseek-v4-flash"]

# Path to the system prompt markdown file (relative to project root).
# This file defines the agent's personality, expertise, and behavioral rules.
prompt_file = "prompts/programmer.md"

# Generation temperature (0.0–1.0).
#   Lower (0.1–0.3) = more deterministic, consistent — good for code, analysis
#   Higher (0.5–0.8) = more creative, varied — good for brainstorming, design
#   Default: 0.7 (if omitted)
temperature = 0.3

# Allowed tools — which capabilities this role has access to in chat mode.
# Available tools: read, write, bash, search, list
#   read    — read files and directories
#   write   — create or overwrite files
#   bash    — execute shell commands
#   search  — regex search across files
#   list    — list agents, workflows, config
#   ask     — 向用户抛选择题并弹框（workflow/delegate 下阻塞等回答）
# ask 是必需的：programmer 在实现过程中撞上「设计没说清、必须用户
# 拍板」的岔路时，唯一的合法提问通道就是它。缺了它模型照样会调，
# 拿到 Tool not found 后只能自己瞎猜或空转（实测实锤：
# programmer 问「归档 3 份还是 5 份」，Tool not found: ask）。
tools = ["read", "write", "bash", "search", "delegate", "code_graph", "ask"]

# Display emoji shown next to the role name in logs and transcripts.
icon = "💻"
