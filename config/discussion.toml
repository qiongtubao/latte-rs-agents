# Discussion Workflow Configuration
# =============================================================================
# This file is the merged single-file workflow config — all workflows in one file.
# Each [default_workflow] or [workflows.<id>] section defines a structured
# multi-agent discussion.
#
# Prefer the per-file layout (config/workflows/*.toml) for user editing.
# This merged file exists for backward compatibility and for the install script.
#
# A workflow defines:
#   - name: unique identifier used in CLI (latte-agent workflow run <name>)
#   - description: human-readable summary
#   - max_rounds: how many times the step sequence repeats (1 = single pass)
#   - context_token_budget: max tokens for shared context (optional)
#   - steps: ordered list of [[steps]] blocks, each with:
#       - id: unique step identifier
#       - speakers: which roles speak (by role id, in order)
#       - prompt: template with {{variable}} substitution
#       - output_key: (optional) save output as named variable for later steps

# ─── Default Workflow ────────────────────────────────────────────────────
# The default workflow used when no workflow is specified.
# Runs the full software discussion cycle: requirements → design → estimate → review → decide.

[default_workflow]
name = "standard-software-discussion"
description = "Standard software development discussion: requirements → design → estimate → review → decide"
max_rounds = 3
context_token_budget = 32000

[[default_workflow.steps]]
id = "requirements"
description = "PM presents the requirements and goals"
speakers = ["pm"]
prompt = "Present the requirements for: {{topic}}. Cover: user story, acceptance criteria, scope boundaries, and priority."

[[default_workflow.steps]]
id = "architecture"
description = "Architect reviews feasibility and suggests design"
speakers = ["architect"]
prompt = "Review the requirements above from a technical perspective. Suggest architecture, identify risks, and discuss tradeoffs."

[[default_workflow.steps]]
id = "implementation"
description = "Programmer estimates effort and implementation approach"
speakers = ["programmer"]
prompt = "Given the requirements and architecture above, estimate the implementation approach. Identify key modules, data flow, and complexity."

[[default_workflow.steps]]
id = "quality"
description = "Tester identifies test strategy and edge cases"
speakers = ["tester"]
prompt = "Review the requirements and implementation plan above. Identify testing strategy, edge cases, and acceptance criteria gaps."

[[default_workflow.steps]]
id = "review"
description = "Reviewer checks quality and security concerns"
speakers = ["reviewer", "security"]
prompt = "Review the full discussion above. Reviewer: code quality and patterns concerns. Security: vulnerability and threat considerations."

[[default_workflow.steps]]
id = "decide"
description = "Manager makes final decision on scope and timeline"
speakers = ["pm", "manager"]
prompt = "Based on the full discussion above, finalize scope, priorities, and timeline. Manager: assess risk and resource constraints."

# ─── Pre-defined Workflows ───────────────────────────────────────────────

# Workflow: requirements_review
# Lightweight requirements review: PM → architect → programmer+tester → manager+pm.
[workflows.requirements_review]
name = "Requirements Review"
description = "PM presents requirements, team discusses feasibility and scope."
max_rounds = 2

[[workflows.requirements_review.steps]]
id = "present"
speakers = ["pm"]
prompt = "Present the requirements for: {{topic}}. Include user stories with acceptance criteria."

[[workflows.requirements_review.steps]]
id = "architecture"
speakers = ["architect"]
prompt = "Review technical feasibility and suggest architecture for the requirements above."

[[workflows.requirements_review.steps]]
id = "estimate"
speakers = ["programmer", "tester"]
prompt = "Estimate effort and identify risks. Programmer: implementation complexity and rough timeline. Tester: test surface and edge cases."

[[workflows.requirements_review.steps]]
id = "decide"
speakers = ["manager", "pm"]
prompt = "Based on the discussion, finalize scope and priorities. Manager: assess risk and timeline feasibility."

# Workflow: code_review
# Multi-perspective code review: programmer explains → reviewers analyze → programmer responds.
[workflows.code_review]
name = "Code Review"
description = "Multi-perspective code review with security, style, and logic checks."
max_rounds = 1

[[workflows.code_review.steps]]
id = "explain"
speakers = ["programmer"]
prompt = "Explain the changes in the code at: {{code_path}}. What was changed and why?"

[[workflows.code_review.steps]]
id = "review"
speakers = ["reviewer", "security", "tester"]
prompt = "Review the code changes described above. Reviewer: patterns and code quality. Security: vulnerabilities. Tester: edge cases and test coverage gaps."

[[workflows.code_review.steps]]
id = "respond"
speakers = ["programmer"]
prompt = "Address the review feedback. For each point, either accept and explain the fix, or push back with reasoning."

# Workflow: design_brainstorm
# Creative open-ended discussion: PM sets context → team brainstorms → evaluators review → synthesize.
[workflows.design_brainstorm]
name = "Design Brainstorm"
description = "Open-ended creative discussion about architecture or feature design."
max_rounds = 2

[[workflows.design_brainstorm.steps]]
id = "context"
speakers = ["pm"]
prompt = "Describe the problem and goals: {{topic}}. What user need are we solving?"

[[workflows.design_brainstorm.steps]]
id = "brainstorm"
speakers = ["architect", "programmer", "designer"]
prompt = "Brainstorm approaches. Architect: system design options. Programmer: practical implementation concerns. Designer: UX implications. Build on each other's ideas."

[[workflows.design_brainstorm.steps]]
id = "evaluate"
speakers = ["reviewer", "security", "devops"]
prompt = "Evaluate the proposed approaches. Consider: maintainability, security, and operational cost."

[[workflows.design_brainstorm.steps]]
id = "synthesize"
speakers = ["architect", "pm"]
prompt = "Synthesize the discussion into a recommended approach with tradeoffs documented."

# Workflow: bug_triage
# Bug analysis: tester describes → programmer diagnoses → security+devops assess → plan fix.
[workflows.bug_triage]
name = "Bug Triage"
description = "Triage a bug report with multi-role analysis."
max_rounds = 2

[[workflows.bug_triage.steps]]
id = "describe"
speakers = ["tester"]
prompt = "Describe the bug: {{topic}}. Include reproduction steps, expected vs actual behavior, and severity."

[[workflows.bug_triage.steps]]
id = "diagnose"
speakers = ["programmer"]
prompt = "Analyze the bug described above. What is the likely root cause? What area of the code is affected?"

[[workflows.bug_triage.steps]]
id = "impact"
speakers = ["security", "devops"]
prompt = "Assess the impact of this bug. Security: any security implications? DevOps: any operational impact?"

[[workflows.bug_triage.steps]]
id = "plan"
speakers = ["programmer", "manager"]
prompt = "Propose a fix plan. Programmer: fix approach and estimate. Manager: priority and scheduling."
