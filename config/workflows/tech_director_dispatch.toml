# Workflow: tech_director_dispatch
# =============================================================================
# A workflow defines a structured multi-agent discussion — a sequence of steps
# where specific roles speak in order, each building on the previous output.
#
# Fields explained in detail below.

# Unique workflow identifier — used in CLI: `latte-agent workflow run <name>`
name = "tech_director_dispatch"

# Human-readable description — shown in `latte-agent list workflows`
description = "Tech director decomposes the task, dispatches to PM/architect/programmer/tester, then summarizes."

# Maximum discussion rounds — how many times the full step sequence repeats.
# Each round, agents can refine their answers based on the previous round.
#   max_rounds = 1  → single pass (e.g., code review)
#   max_rounds = 2  → two passes (e.g., brainstorm then refine)
#   max_rounds = 3  → three passes (e.g., requirements → design → estimate)
max_rounds = 1

# Context token budget — max tokens for the shared discussion context.
# Older messages are summarized/truncated when the budget is exceeded.
# Optional; defaults to a reasonable value if omitted.
context_token_budget = 32000

# ─── Steps ───────────────────────────────────────────────────────────────────
# Each [[steps]] block defines one turn in the discussion.
# Steps execute in order; each step's output is visible to subsequent steps.

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "decompose"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "Tech director decomposes the user's task into per-role subtasks."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["manager"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the Tech Director. Read the user's task below and produce a tight
plan that decomposes it into four parallel subtasks — one for PM, one for
architect, one for programmer, one for tester. For each subtask, write
exactly one sentence telling the role what to investigate or produce.

User's task:
{{topic}}

Format your response as:

    PM: <what the PM should look into or write up>
    ARCHITECT: <what the architect should design or evaluate>
    PROGRAMMER: <what the programmer should investigate, sketch, or implement>
    TESTER: <what the tester should examine or test>

Be specific and concrete. Keep the whole response under 200 words."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "plan"

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "requirements"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "PM reviews the plan and produces requirements / user-facing analysis."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["pm"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the Product Manager. The Tech Director has produced this
plan for the user's task:

{{plan}}

Original user task: {{topic}}

Using the plan as your guide, produce a clear set of requirements:
user stories (1-3), acceptance criteria, scope boundaries, and priority.
Do NOT implement or design — your job is to make sure the user's needs
are captured precisely. Keep your response under 250 words."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "pm"

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "architecture"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "Architect produces a technical design and risk assessment."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["architect"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the System Architect. The Tech Director's plan:

{{plan}}

The PM's requirements:

{{pm}}

Original user task: {{topic}}

Produce a concise technical design: key modules, data flow, external
dependencies, and the top 2-3 risks or trade-offs. Do NOT implement.
Keep your response under 250 words."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "architect"

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "implementation"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "Programmer investigates the code / sketches the implementation."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["programmer"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the Software Engineer. The Tech Director's plan:

{{plan}}

The architect's design:

{{architect}}

Original user task: {{topic}}

You may use file read/list/search tools to inspect the codebase before
answering. Produce:
- A concrete file-by-file change list (or "no code change needed" if
  the answer is purely informational).
- A short test plan (which test files to add, what to cover).

Keep your response under 300 words. Cite specific paths you read."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "programmer"

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "quality"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "Tester evaluates test coverage and edge cases."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["tester"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the QA Engineer. The Tech Director's plan:

{{plan}}

The programmer's implementation:

{{programmer}}

Original user task: {{topic}}

Report on:
- Test coverage gaps (which paths are not exercised?)
- Edge cases / failure modes not handled.
- Concrete test cases you would add (file path + what to assert).

Keep your response under 200 words."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "tester"

[[steps]]
# Step identifier — unique within this workflow, used for output_key references.
id = "synthesize"

# Human-readable step description — shown in progress logs.
# Optional; defaults to the id if omitted.
description = "Tech director synthesizes the four contributions into a final answer."

# Speakers — which roles speak in this step (by role id).
# Multiple speakers means a round-robin: each speaks in turn, seeing the
# previous speaker's output. Order matters.
speakers = ["manager"]

# Prompt template — what to ask the speaker(s).
# Supports {{variable}} substitution from:
#   - CLI flags: --var key=value
#   - Previous step outputs: {{output_key}} (when a step sets output_key)
#   - Built-in variables: {{topic}} (the discussion topic)
prompt = """You are the Tech Director. The four roles have finished their
contributions. Your job is to write the final, single answer for the
user.

User's original task:
{{topic}}

PM said:
{{pm}}

Architect said:
{{architect}}

Programmer said:
{{programmer}}

Tester said:
{{tester}}

Produce a concise, well-structured final answer that:
- States the answer or plan in plain language first.
- References the key trade-offs / risks.
- Lists concrete next steps.

Keep the whole answer under 400 words. Do not hedge — give a real
decision, not a list of options."""

# Output key — save this step's output as a named variable for later steps.
# Optional; when set, later steps can reference this output via {{key}}.
output_key = "final"
[[steps]]
# 终审：Advisor 对整场讨论/全部产出做最终把关，输出 ✅/⚠️/❌ 裁决。
id = "advisor_verdict"
description = "Advisor reviews all outputs and gives the final verdict"
speakers = ["advisor"]
prompt = "你现在是终审顾问。通读上面的全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。"
