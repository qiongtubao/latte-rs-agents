# Workflow: requirements_review
# 需求评审：PM 阐述需求 → 架构可行性 → 工期/风险估算 → 范围拍板 → 终审。
# 步骤间用 output_key 显式穿线（引擎跨步骤只传 output_key 变量 +
# step 内 transcript；"上述需求"这类隐式引用拿不到任何上下文）。
# 格式说明参考 config/workflows/bug_triage.toml 头部注释。

name = "requirements_review"
description = "PM 阐述需求，团队讨论可行性和范围。｜落点：对话里的需求结论"
max_rounds = 1

[[steps]]
id = "present"
description = "PM 阐明需求"
role = "pm"
output_key = "requirements"
task = "为 {{topic}} 阐明需求。包含带验收标准的用户故事。"

[[steps]]
id = "architecture"
description = "架构可行性"
role = "architect"
depends_on = ["present"]
output_key = "arch_review"
task = "需求如下：\n{{requirements}}\n\n审查技术可行性并为这些需求建议架构。"

# ── 估算：programmer 与 tester **并发**（同一 DAG wave）──────────────
#
# 拆成两个单 speaker step 而不是一个多 speaker step：step 内多 speaker
# 是严格串行的（`for speaker in ...`），而 DAG 引擎对同 wave 的 step 并发。
# 两人的估算维度互不依赖（实现复杂度 vs 测试面），没有先后关系。
#
# 两步都只读：本步只估算不实现。工具过滤是引擎层 enforce，不靠 prompt
# 自觉——programmer 的角色 prompt 本身在推「取证到底 / 修复必须先有失败
# 测试」，一旦手里有 write+bash，估算就会滑成完整实现（实测实锤：本步
# 跑了 131 次工具调用、改了 src/tcache.c、编译 + lldb 验证，最后撞 100
# 轮上限，连带整条 design_and_plan 失败）。
[[steps]]
id = "estimate_impl"
description = "programmer：实现复杂度与时间线"
role = "programmer"
depends_on = ["architecture"]
tools = ["read", "search", "code_graph"]
output_key = "estimate_impl"
task = """【需求】
{{requirements}}

【架构建议】
{{arch_review}}

估算**实现复杂度和大致时间线**。

**本步只输出估算，禁止修改任何文件、禁止编译或运行验证**。需要事实支撑就读代码取证（read/search）；信息不足时写明假设与待核实项，不要用动手实现来消除不确定性。"""

[[steps]]
id = "estimate_test"
description = "tester：测试面与边界用例"
role = "tester"
depends_on = ["architecture"]
tools = ["read", "search", "code_graph"]
output_key = "estimate_test"
task = """【需求】
{{requirements}}

【架构建议】
{{arch_review}}

估算**测试面和边界用例**。

**本步只输出估算，禁止修改任何文件、禁止编译或运行验证**。"""

# ── 拍板：manager 与 pm **并发** ────────────────────────────────────
#
# 两人的视角互不依赖（风险/时间线可行性 vs 用户价值取舍），原来串行
# 还有个副作用：多 speaker 步的 output_key 只能绑最后一个人的产出
# （已在引擎层修成聚合，但拆开更清晰，下游能分别引用）。
[[steps]]
id = "decide_risk"
description = "manager：风险与时间线可行性"
role = "manager"
depends_on = ["estimate_impl", "estimate_test"]
# 并发步必须只读：拍板只需读上游产出，不该改文件。
tools = ["read", "search", "code_graph"]
output_key = "scope_risk"
task = """基于以下讨论评估**风险和时间线可行性**。
【需求】
{{requirements}}

【架构建议】
{{arch_review}}

【实现估算】
{{estimate_impl}}

【测试估算】
{{estimate_test}}"""

[[steps]]
id = "decide_value"
description = "pm：用户价值取舍"
role = "pm"
depends_on = ["estimate_impl", "estimate_test"]
tools = ["read", "search", "code_graph"]
output_key = "scope_value"
task = """基于以下讨论从**用户价值角度权衡取舍**，给出范围与优先级。
【需求】
{{requirements}}

【架构建议】
{{arch_review}}

【实现估算】
{{estimate_impl}}

【测试估算】
{{estimate_test}}"""

[[steps]]
id = "advisor_verdict"
description = "Reviewer reviews all outputs and gives the final verdict"
role = "reviewer"
depends_on = ["decide_risk", "decide_value"]
output_key = "verdict"
task = """你现在是终审顾问。通读以下全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。

【需求】
{{requirements}}

【架构建议】
{{arch_review}}

【实现估算】
{{estimate_impl}}

【测试估算】
{{estimate_test}}

【范围决定 · 风险视角】
{{scope_risk}}

【范围决定 · 价值视角】
{{scope_value}}"""
