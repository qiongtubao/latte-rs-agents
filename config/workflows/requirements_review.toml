# Workflow: requirements_review
# 需求评审：PM 阐述需求 → 架构可行性 → 工期/风险估算 → 范围拍板 → 终审。
# 步骤间用 output_key 显式穿线（引擎跨步骤只传 output_key 变量 +
# step 内 transcript；"上述需求"这类隐式引用拿不到任何上下文）。
# 格式说明参考 config/workflows/bug_triage.toml 头部注释。

name = "requirements_review"
description = "PM 阐述需求，团队讨论可行性和范围。｜落点：对话里的需求结论"
max_rounds = 1

[[steps]]
id = "present"
description = "PM 阐明需求"
speakers = ["pm"]
output_key = "requirements"
prompt = "为 {{topic}} 阐明需求。包含带验收标准的用户故事。"

[[steps]]
id = "architecture"
description = "架构可行性"
speakers = ["architect"]
output_key = "arch_review"
prompt = "需求如下：\n{{requirements}}\n\n审查技术可行性并为这些需求建议架构。"

[[steps]]
id = "estimate"
description = "工期与风险估算"
speakers = ["programmer", "tester"]
output_key = "estimate"
# step 级工具过滤：硬性摘掉 write / bash（引擎层 enforce，不靠 prompt
# 自觉）——本步只估算，不实现。programmer 的角色 prompt 本身在推
# 「取证到底 / 修复必须先有失败测试」，一旦手里有 write+bash，估算就会
# 滑成完整实现（实测实锤：本步跑了 131 次工具调用、改了
# src/tcache.c、编译 + lldb 验证，最后撞 100 轮上限，连带整条
# design_and_plan 失败）。
tools = ["read", "search", "code_graph"]
prompt = "【需求】\n{{requirements}}\n\n【架构建议】\n{{arch_review}}\n\n估算工期和风险。Programmer：实现复杂度和大致时间线。Tester：测试面和边界用例。\n\n**本步只输出估算，禁止修改任何文件、禁止编译或运行验证**。需要事实支撑就读代码取证（read/search）；信息不足时写明假设与待核实项，不要用动手实现来消除不确定性。"

[[steps]]
id = "decide"
description = "范围与优先级拍板"
speakers = ["manager", "pm"]
output_key = "scope"
prompt = "基于以下讨论最终确定范围和优先级。\n【需求】\n{{requirements}}\n\n【架构建议】\n{{arch_review}}\n\n【估算】\n{{estimate}}\n\nManager：评估风险和时间线可行性。PM：从用户价值角度权衡取舍。"

[[steps]]
id = "advisor_verdict"
description = "Reviewer reviews all outputs and gives the final verdict"
speakers = ["reviewer"]
prompt = """你现在是终审顾问。通读以下全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。

【需求】
{{requirements}}

【架构建议】
{{arch_review}}

【估算】
{{estimate}}

【范围决定】
{{scope}}"""
