# Workflow: learn_plan
# 学习/课程类拆分专用：把「学透这个仓库/主题」拆成一本书的目录（编/章任务树）。
# 与 implementation_plan 的分工：实现类拆分的产出要被 worker 直接执行，符号
# 拼写就是契约，breakdown 带 require_symbols_resolvable 硬门禁；学习类拆分的
# 产出是一本书的目录，章只锚定**真实存在的文件路径**（assemble 的
# require_plan_tasks 校验），符号级取证留给每章的 learn_loop plan 步现场做——
# 实测（2026-09-17 jemalloc 书目录 e2e，5 轮迭代）：把符号门禁套在书目录上
# 是打地鼠（42→7→19→1→21 个未命中），模型每轮重写都从训练记忆漏进新的
# 旧版符号/占位符（extents_pa_alloc、je_xxx、README），而目录章名根本不该
# 点名内部函数。门禁位置错了，不是模型不努力。
#
# ── 2026-10-31 扇出改造（jemalloc learn_plan 会话 ui-8557 复盘）────────
# 病根：旧 tasks_json 让**一个 architect 在单个 subsession 里把整本 50 章
# 一次性转成清单 JSON**。实测后果：产出冲到 21 万字符、撞 900s 软超时、
# `<think>` 思维链漏进交接、task_type 多轮不收敛，流程跑完 tasks_json 就
# 静默死掉、从没把看板交回用户。根因是「数据过多塞一个会话」，不是模型不努力。
#
# 解法（分解而非截断，对标 learn_loop 串行外层嵌套 DAG 子流程 doc_review_loop）：
#   pages    —— 嵌套 DAG 子流程 learn_book_pages：先出书骨架 chapters.json，
#               再**按章扇出**，每章一个独立 subsession 把自己细化成一条任务
#               条目落盘 .latte/learn-plan/tasks/<chNN>.json。输入输出都小、
#               并发跑、逐章落盘=可续。本层把 prose 结构说明带出为 {{plan}}。
#   assemble —— 轻装配（串行）：按骨架顺序读各 tasks/<chNN>.json，**原样**拼成
#               唯一的 ```json {"tasks":[...]} fence。只拼不设计、不读源码，
#               不会再爆量。require_plan_tasks + require_learn_chapters 落在这。
#   verdict  —— 终审（学习类检查清单，结构化裁决，抽查不全量核验）。
#   gate     —— 零模型机械门：存在 blocking → REJECT，按病灶路由返工。
#
# 为什么外层是串行：fan_out 只在 DAG 引擎可用，而 require_plan_tasks /
# require_verdict_json / gate_from 只在串行引擎可用，当前引擎里两套互斥。
# 于是扇出关进内层 DAG 子流程，外层保持串行、保留全部机械门禁。
#
# 章节号规则（扇出后更重要——各章在不同 subsession 里生成，必须靠内层
# chapters.json 这份单一骨架保证编号/先修链一致）：章号用全书统一稳定编号
# chNN，编只做分组标签，跨章引用一律写 chNN 全称标题原文。
#
# 收敛：gate 有 blocking 自动返工，BLOCKING 数严格下降可延长到 6 轮，
# 返工带历史反馈防矫枉过正。

name = "learn_plan"
command = "/learn-plan"
description = "学习计划拆分：把「学透某仓库/主题」拆成一本书的目录（编=认知阶段、章=一次 learn_loop，逐章独立扇出生成），depends_on 先修链串成学习路径｜落点：任务看板条目（plan 弹窗勾选导入）+ 章任务的 learn_loop 流水线｜学习/课程/教材类「拆分任务、出学习计划」走这里，实现类拆分走 /plan"
max_rounds = 1

# ── pages：嵌套 DAG 子流程，出骨架 + 逐章扇出细化（产物落盘）──────────
# 子流程 learn_book_pages：breakdown（写 .latte/learn-plan/chapters.json + prose）
# → detail（fan_out 按章扇出，写 tasks/<chNN>.json）。
# output_from = "plan"（内层 breakdown 的 output_key）：把内层 breakdown 的 prose 结构说明带出为 {{plan}}，
# 供 verdict 审查（真正的任务数据在落盘文件里，由下游 assemble 读取装配）。
[[steps]]
id = "pages"
description = "出书骨架并按章扇出细化（嵌套 DAG 子流程）"
workflow = "learn_book_pages"
output_key = "plan"
output_from = "plan"
task = "{{topic}}"

[[steps]]
id = "rechapter"
description = "定向返工：只重做被机械门点名的章（首轮零派发直通）"
workflow = "learn_book_pages"
task = "[[learn_plan:rechapter]]\n{{topic}}"

# ── assemble：零模型机械装配——按骨架顺序逐字拼各章条目为唯一 tasks fence ──
# 2026-10-31 扇出 e2e 实录：让 architect 会话把 41 章拼成一个 JSON，吐了
# 3.2 万字符思考、<think> 泄漏、还把 paths 改坏，3 次重试耗尽整步失败。
# 拼接是确定性操作，改用零模型机械步：逐字搬运、不泄漏、不漂移、不爆量。
# require_plan_tasks + require_learn_chapters 仍在本步跑；失败会指名病灶章。
[[steps]]
id = "assemble"
description = "按 chapters.json 顺序机械装配各章条目为唯一 tasks 清单（零模型）"
output_key = "tasks"
require_plan_tasks = true
# 学习书目录的结构校验（引擎数的）：层级标签齐全且顺序先主干后枝叶、树干里有推导章、
# 锚点体量合理、不只锚头文件、先修链不倒置。
require_learn_book = true
require_learn_chapters = true
# on_fail：装配校验失败（只可能是章条目的问题——title/depends_on 以骨架覆盖、
# 骨架扇出前已校验）时，删掉被点名章的条目、带着校验错误跳回 rechapter 只重做
# 它们，最多 2 次；不再一失败就判死整单（jemalloc ui-248856：ch32 description
# 引用了不在先修链里的 ch31，整条 workflow 直接 failed）。
collect_plan_tasks = { order_file = ".latte/learn-plan/chapters.json", order_items = "chapters", order_id = "id", task_file = ".latte/learn-plan/tasks/{{id}}.json", on_fail = { rework = "rechapter", invalidate = ".latte/learn-plan/tasks/{{target}}.json", max_attempts = 2 } }

# ── verdict：终审（学习类检查清单，结构化裁决）─────────────────────────
[[steps]]
id = "verdict"
description = "终审（学习类检查清单，结构化裁决，抽查不全量核验）"
speakers = ["reviewer"]
output_key = "verdict"
max_retries = 2
tool_call_limits = { read = 8, search = 8, code_graph = 8 }
require_tools_any = ["read", "code_graph", "search"]
# 结构化裁决硬校验：下游 gate_from 机械判定的输入，格式不合格就带批注重做本步。
require_verdict_json = true
prompt = """终审这份学习计划：
【拆解骨架】{{plan}}
【装配后的任务清单】{{tasks}}

**抽查即可，不要逐项全量核验**：paths/符号存在性抽 3-5 处验证（优先抽看起来最可疑的），工具调用总量控制在 10 次以内；章名若点名了具体符号则抽查其存在性（查不到的按实测错误处理）。
**引擎已机械校验过、不必再查**：章号 chNN 连续、depends_on 只指向前序章、description 里的 chNN 引用都在先修闭包内、各章条目与骨架一致、层级先地基/树干后枝叶、树干有推导章、锚点体量在区间内、没有大文件整份当锚点。
你要查的是机器查不出的**语义**问题——尤其是没写章号、但验收**实际上**要用到后面章节才讲的知识/产物（如要求"跑基准"而基准在后章才写）。

学习类检查清单：① 目录是否覆盖学习目标（有没有漏掉核心机制）；② 编的顺序是否符合认知规律（环境/补课→地图→主线→外围→底层→验证输出）；③ 先修关系是否完整（后章真用到前章概念却没写 depends_on）；④ 每章验收是否是「能讲清/能推出什么」、有没有语义上依赖未学知识；⑤ 章之间阅读落点是否重复（复读 = important，应合并或改写为进阶深化）；⑥ 有没有「验证与输出」收尾章；⑦ 事实性结论（构建选项、平台差异等）与源码是否一致；⑧ 某章条目是否明显是扇出失败的残次（如 description 空洞、与 brief 完全脱节）。

严重度定义（照此分级，不要凭感觉）：
- blocking：先修倒置 / 验收依赖未学知识 / 漏核心机制 / 事实或路径/符号实测错误 / 某章缺失或残次 / 学习者照做必然卡住。
- important：复读、覆盖缺口中的非核心项、表述会误导但不至于卡住。
- nit：措辞、计数口径、格式。
**不要写「通过/有条件通过/不通过」之类的总裁决**——放行由引擎按「有无 blocking」推导。

输出：先写简短的抽查记录（查了什么、实测结果），然后在末尾输出**唯一一个** ```json 代码块：
{"issues": [{"id": "B1", "severity": "blocking|important|nit", "rework": "pages|rechapter", "targets": ["chNN"], "summary": "一句话问题", "evidence": "file:line 实测或清单原文（blocking 必填）", "fix": "具体改法"}]}
- rework（病灶步）二选一，**能定向就定向**：
  - `rechapter`：问题**局限在个别章的条目内容**（某章 description/验收写错、事实/路径错误、description 空洞残次、与 brief 脱节等），且**骨架里这一章的 title/brief/accept/paths/depends_on 本身没问题**。定向重做的章条目**无权改 title 和 depends_on**（照抄骨架、装配时以骨架覆盖），所以 fix 里只要需要增删 depends_on（补先修、去掉倒置依赖），就**必须**写 `pages`。**必须**在 `targets` 里列出要重做的章号（如 `["ch03","ch07"]`）——只重做这几章，其余章不动。没给 targets 的 rechapter 会被引擎降级为全量返工；同一章上一轮刚定向重做过又被点名，引擎也会自动升级为全量返工。
  - `pages`：问题在**骨架层面**（编排顺序、覆盖缺口、漏核心机制、先修链设计、章号/章节划分本身要改、章数不符要求），**或者某章的问题根子在骨架的 brief/accept/paths 上**（章条目是照骨架写的，只重做条目改不掉）——需要重写骨架并全量重做。判不准写 pages。
- targets 只写 chNN 章号，不写别的。非 rechapter 的问题 targets 留空数组。
- 没有任何问题时输出 {"issues": []}。"""

# ── gate：机械终审门（零模型调用）─────────────────────────────────────
# 读 verdict 的结构化 issues：无 blocking → VERDICT: PASS + 修正项 + 引擎原样
# 附上的任务清单；有 blocking → VERDICT: REJECT + BLOCKING: n + 问题清单 +
# REWORK: <最靠上游的病灶步>，按病灶路由返工。
# 定向返工（gate_invalidate）：rework=rechapter 的 blocking 问题点名的章，其
# tasks/<chNN>.json 被删除；路由到 rechapter 后增量扇出只重做这几章。任一
# blocking 是 pages（骨架级）则取最上游 pages 全量返工。
# 收敛：达到 max_iterations 时 BLOCKING 数比上轮严格下降则继续，最多 6 轮。
[[steps]]
id = "gate"
description = "终审门：按结构化裁决机械放行；有 blocking 自动返工（能定向就只重做点名的章），收敛中可延长"
# 零模型机械门：从 verdict 的结构化 issues 推导放行/驳回（不派 speaker）。
gate_from = "verdict"
# gate_attach：放行时原样附在产出末尾的变量（assemble 的装配产物 = 任务清单）。
gate_attach = "tasks"
# 定向返工：rework=rechapter 的 blocking 问题点名的章，其 tasks/<chNN>.json 被删除；
# 路由到 rechapter 后增量扇出只重做这几章。任一 blocking 是 pages（骨架级）则取
# 最上游 pages 全量返工。
# skeleton_fields：fix 要改这些骨架字段的 rechapter 问题，机械升级为全量返工
# （rechapter 步照抄骨架、无权改 depends_on，派过去只会"成功地什么都没改"）。
gate_invalidate = { path = ".latte/learn-plan/tasks/{{target}}.json", rework = "rechapter", skeleton_fields = ["depends_on"] }
loop_until = "VERDICT: PASS"
loop_back_to = "pages"
loop_no_release_on = "VERDICT: REJECT"
max_iterations = 3
# 收敛度量：BLOCKING 数严格下降时延长到 6 轮（返工真的在收敛就让它继续）。
loop_progress_marker = "BLOCKING:"
max_iterations_on_progress = 6
# 返工时带上此前各轮的审查反馈，防矫枉过正（反复修同一处改出新问题）。
loop_carry_history = true

[steps.loop_back_routes]
"REWORK: rechapter" = "rechapter"
"REWORK: pages" = "pages"

[[steps]]
id = "submit"
description = "引擎机械提交：从装配好的 tasks 清单直接提 plan，弹出导入窗口（零模型调用）"
submit_plan_from = "tasks"
