# Workflow: design_brainstorm
# 设计脑暴：PM 铺需求 → 多角色脑暴 → 评审团评估 → 综合定案 → 终审。
# 步骤间用 output_key 显式穿线（引擎跨步骤只传 output_key 变量 +
# step 内 transcript；"上面的讨论"这类隐式引用拿不到任何上下文）。
# 格式说明参考 config/workflows/bug_triage.toml 头部注释。

name = "design_brainstorm"
description = "关于架构或特性设计的开放式创意讨论。"
max_rounds = 1

[[steps]]
id = "context"
description = "PM 描述需求与目标"
speakers = ["pm"]
output_key = "context"
prompt = "描述这个需求和目标：{{topic}}。我们要解决什么样的用户需求？"

[[steps]]
id = "brainstorm"
description = "多角色方案脑暴"
speakers = ["architect", "programmer", "designer"]
output_key = "ideas"
prompt = """主题：{{topic}}

需求背景：
{{context}}

头脑风暴各种方案。Architect：系统设计选项。Programmer：实现层面的实际考量。Designer：UX 影响。在彼此想法的基础上推进。"""

[[steps]]
id = "evaluate"
description = "评审团评估方案"
speakers = ["reviewer", "security", "devops"]
output_key = "evaluation"
prompt = """主题：{{topic}}

待评估的方案：
{{ideas}}

评估上面 brainstorm 提出的方案。考虑：可维护性、安全性和运维成本。"""

[[steps]]
id = "synthesize"
description = "综合成推荐方案"
speakers = ["architect", "pm"]
output_key = "proposal"
prompt = """主题：{{topic}}

【需求背景】
{{context}}

【脑暴方案】
{{ideas}}

【评审意见】
{{evaluation}}

把上面的讨论综合成一个推荐方案，权衡取舍有据可查。"""

[[steps]]
id = "advisor_verdict"
description = "Reviewer reviews all outputs and gives the final verdict"
speakers = ["reviewer"]
prompt = """主题：{{topic}}

你现在是终审顾问。通读以下全部讨论与产出，按你的裁决格式给出最终结论：裁决（✅ 通过 / ⚠️ 有条件通过 / ❌ 不通过）、理由（1-3 句，需有证据）、阻断问题（如有，逐条：问题 → 影响 → 建议）、条件或后续建议（如有）。只报告影响可证明、可行动的问题。

【推荐方案】
{{proposal}}

【评审意见】
{{evaluation}}"""
