# Workflow: learn_loop（v2：文档驱动学习循环）
# plan（取证 + 拆知识点 + 出题）→ annotate（注释版代码副本，默认生成）
#   → doc（写/增强学习文档 draft.md）
#   → read_confirm（「开始答题」按钮，等学员读完）→ quiz（批量出题 + 判分 + 写账本，
#   有错跳回 doc 增强）→ supplement（全对后问"还有不懂的吗"，有补充跳回 doc）
#   → merge（定稿 docs/learn/<slug>.md）→ [sync_code（可选：注释写进源码）] → report
#
# 用法：/learn_loop <主题>，或 manager 调 workflow { name: "learn_loop", topic: "…" }
#       annotate 默认生成注释版代码副本（.latte/learn/<slug>/code/），不改源码；
#       可选开关：主题里带「同步注释」（或 写进源码）→ merge 之后由 sync_code 步
#       把注释写进真实源文件（只加注释、不改逻辑）——这会修改仓库代码，
#       建议该任务开 isolated worktree 执行（看板编辑弹窗可覆盖）。
# 产物：.latte/learn/<slug>/plan.json（知识点+题目+答案+证据）
#       .latte/learn/<slug>/ledger.json（wrong / passed 事实 + round + supplements）
#       .latte/learn/<slug>/draft.md（学习期间的活文档，逐轮演进）
#       .latte/learn/<slug>/code/（注释版代码副本 + README 索引）
#       docs/learn/<slug>.md（merge 步定稿的最终交付文档）
#
# 设计文档：docs/learn-loop-doc-driven-design.md
#
# ── 设计约定 ─────────────────────────────────────────────────
# 1. 行为约束写在引擎字段上，不写进 prompt。prompt 是劝告、违反了没人知道；
#    字段是硬约束：tools（拿不到就调不了）、require_tools[_any]、
#    tool_call_limits、output_contract、loop_until / loop_back_routes。
# 2. "文档内容"与"答题按钮"必须分属两步：step 正文只在 step 结束时投递、而 ask
#    在中途阻塞。合成一步时学员会先看到弹窗、答完才看到文档。所以 doc 步正文
#    直接交付 draft.md 全文（chat 里即可阅读），read_confirm 步只负责弹
#    「开始答题」并阻塞等学员读完。
# 3. ask 的 allow_repeat / shuffle / auto_answer 参数未实现（handler 不解析）。
#    后果一：同一 question 文本重问会被"同题复用旧答案"保护静默回放、不弹窗——
#    凡跨轮次重复出现的 ask（read_confirm / quiz 重考 / supplement），题面必须
#    嵌入轮次号使文本不同。后果二：没有程序洗牌，选项顺序由 plan 自己随机。
# 4. 跨 step 的结构化状态只走文件（plan.json / ledger.json / draft.md）；
#    quiz / supplement 返工时其产出文本由引擎自动预置进 doc 步的 prompt
#    （pending_feedback），doc 据此决定"增强哪里 / 补充什么"。

name = "learn_loop"
command = "/learn_loop"
description = "文档驱动学习循环：写学习文档 → 学员阅读 → 点「开始答题」→ 答错增强文档再学 → 全对后补充疑问 → 定稿合并｜落点：现在就开始上课：文档+弹窗互动 + docs/learn/<slug>.md 定稿 + .latte/learn/<slug>/ 掌握账本（不进任务看板）｜默认附注释版代码副本（.latte/learn/<slug>/code/）；主题带「同步注释」时把注释写进源码（会改仓库文件）"
max_rounds = 1

# ═══ 1. 取证 + 拆解知识点 + 出题 ══════════════════════════════
# tools              无 ask：课程设计阶段不许弹窗打扰学员。
# require_tools_any  取证不可跳过（read/code_graph/search 任一即可）。
# require_tools      plan.json / ledger.json 必须落盘，下游靠文件工作。
# output_contract    产出被当路径片段拼接，所以只能是 slug 本身。
[[steps]]
id = "plan"
description = "读代码取证，拆解知识点、出题并写入 plan.json / ledger.json"
role = "tutor"
output_key = "plan_out"
max_retries = 2
tools = ["read", "code_graph", "search", "write"]
require_tools_any = ["read", "code_graph", "search"]
require_tools = ["write"]
task = """围绕主题「{{topic}}」设计课程。你是课程设计师，不教学，只产出知识点清单与文档大纲。

## 一、先取证

凭记忆出题会造出不存在的符号，学员学到的是假知识。动笔前把涉及的代码/文档读一遍：
`code_graph`（`kind=function`/`struct` + `path`）拿签名行号，`read("<file>:<起>-<止>")`
精读，宏和字符串用 `search`。独立的取证同一轮批量发：`read(paths=[...])`，一次最多 10 个。
涉及"有几个字段""按什么顺序""定义在哪一行"这类事实，必须把定义整段读出来数。

## 二、拆知识点 + 定文档大纲

拆成 3-6 个，互不重叠，**按由浅入深排序**：第一个必须是"这东西是什么、整体怎么运转"
这种门外汉也能听懂的层级，越往后越细。若 topic 已给出分层（L0/L1/… 或阶段清单），
就照它的顺序覆盖，不要跳过浅层直接挑深处的细节考。

再定 `doc_outline`：学习文档的章节骨架，按主题定制——**第 1 节必须是「全局心智模型与贯穿比喻（它是什么、整体怎么运转）」**；后续章节严格按主线逻辑展开核心分级/数据结构/运行原理/链路图；**凡涉及分档/分类/分层，章节必须覆盖「怎么存（物理视图）」与「为什么这样存（权衡与反向思考）」**，章节之间具备清晰的因果串联。

每个知识点写：`id`（短英文）、`title`（中文）、`evidence`（`file:line`，必须真实存在）、
`teach_points`（讲解要点数组，每条一句话 + 出处）、`example`（**最小具体例子**：讲参数
就写"传什么进去 → 出来什么"，讲分支就写"A 情况下变成什么、B 情况下变成什么"——
例子是小白理解的入口，不许只给抽象描述）、`doc_section`（该点在文档里的章节
标题，如 `## 2. 所有权规则`）、`question` + 4 个 `options`、`answer`（正确选项的 label 原文）。

## 三、出题规则

- `options` 里**禁止 `recommended` 字段**——前端会渲染成「✓ 推荐」徽标，等于印上答案。
- `label` 写选项的实际内容（符号名/短语，≤20 字），**不许用 A/B/C/D**——那会让 `answer`
  退化成位置引用。**正确项的位置由你自己随机打散**（ask 没有洗牌实现，写在第几项就是
  第几项）；判分按 label 文本，与位置无关。
- 四个选项等重：长度、语气、详略、术语密度一致。干扰项必须是真实存在的东西（真函数/宏/
  字段），只是不满足题干条件；一秒能排除的荒谬项（"两者完全等价"）不叫干扰项。
- **考理解，不考查表**：给一个具体小场景让学员推断行为/结果（如"在 GCC 下这段宏
  展开成什么""传 `x` 进去会怎样"）；**不许考"定义在第几行""有几个字段"这种翻
  原文就有答案的记忆题**——那考的是检索不是学会。
- 题目考 `title` 说的那个核心，各知识点的题目不得互相重叠。选项 `description` 里的事实
  同样来自取证。

## 四、落盘

**先查重，但重跑不是无操作**（同一任务重复派发是常态，不能因为 slug 已存在就跳过刷新）:
1. 复用已有同主题计划的 slug 与学习账本，但每次运行都必须 write 完整的 plan.json 与 ledger.json（当前源码中的证据、行号、讲解要点、例子、题目和大纲有变化时刷新）；
2. 确实全新才按推导规则写初始文件（slug 从主题推导，小写英文+连字符；**剔除「同步注释」/「写进源码」这类开关标记词**）；

`write` 到 `.latte/learn/<slug>/plan.json`：
```json
{
  "slug": "<slug>",
  "topic": "{{topic}}",
  "doc_outline": ["它是什么、整体怎么运转", "核心数据结构", "模块调用交互", "流程图"],
  "knowledge_points": [
    {
      "id": "k1",
      "title": "所有权规则",
      "evidence": "src/ownership.rs:12-48",
      "teach_points": ["每个值有唯一 owner（src/ownership.rs:12）"],
      "example": "let a = String::from(\"hi\"); let b = a; —— 之后用 a 直接编译报错：owner 已移给 b",
      "doc_section": "## 2. 所有权规则",
      "question": "…",
      "options": [
        {"label": "move 语义", "description": "客观描述这一项是什么"},
        {"label": "borrow 语义", "description": "客观描述这一项是什么"},
        {"label": "Copy trait", "description": "客观描述这一项是什么"},
        {"label": "Rc 引用计数", "description": "客观描述这一项是什么"}
      ],
      "answer": "borrow 语义"
    }
  ]
}
```

再 `write` 初始 `.latte/learn/<slug>/ledger.json`，**只记事实、不写状态名**（状态由读取方
按 `wrong`+`passed` 推导）：

```json
{"slug":"<slug>","round":0,"knowledge_points":[{"id":"k1","title":"所有权规则","wrong":0,"passed":false}],"supplements":[],"updated_at":"<now>"}
```

## 产出

**只输出 slug 本身**（如 `rust-ownership`），无其他文字——下游直接拼进文件路径。"""

[steps.output_contract]
min_chars = 3
max_chars = 60
forbid = [" ", "/", "\\", "`"]

# ═══ 1b. 注释版代码副本（默认生成）═══════════════════════════════════
# 默认必跑：注释版副本是学习材料的标配。「要不要注释进源码」才是开关——
# 那是 merge 之后 sync_code 步的事（when_any 触发）。
# tools          只有 read + write：副本是新文件，用不上 edit；没有 edit 也就
#                不可能改到源文件——"不动源码"靠工具隔离，不靠 prompt 劝告。
# 副本落在 .latte/learn/<slug>/code/，不违反只读类型的 paths 严格校验
# （.latte/ 是学习产物目录，不是仓库源码）。
[[steps]]
id = "annotate"
description = "为 plan 取证的代码生成注释版学习副本（不改源码）"
role = "tutor"
output_key = "annotate_out"
max_retries = 2
tools = ["read", "write"]
require_tools = ["write"]
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

读 `.latte/learn/{{plan_out}}/plan.json`，为每个知识点的 `evidence`（file:line）
生成**注释版代码副本**，让学员读源码时旁边就有讲解：

1. 按 `evidence` 的行号区间 `read` 原文件（函数/结构体读完整定义，前后带少量
   上下文）；同一文件被多个知识点引用时合并成一个副本。
2. `write` 到 `.latte/learn/{{plan_out}}/code/<知识点id>-<原文件名>`（如
   `k1-ownership.rs`）：**逐字保留代码原文，只加中文注释**——
   - 文件头注释块：原始出处（`file:line`）、对应知识点标题、"学习副本——
     源文件未改动，行号可能随后续源码演进漂移"；
   - 关键行上方用注释讲「做什么 / 为什么」，不复述代码本身；术语与
     plan.json 的 `teach_points` 保持一致，且**面向零基础学员**——术语随口
     用半句大白话带过（如"内联：把函数体直接铺到调用处"），不甩生词。
3. 最后 `write` 索引 `.latte/learn/{{plan_out}}/code/README.md`：知识点 →
   副本文件 → 原始出处的对照表。

**绝不修改 `code/` 目录以外的任何文件**——源文件保持原样，学员对照副本
阅读即可。

引擎写完后会核对：README.md 存在；每个副本文件头写了真实存在的原始出处
（`file:line`）；副本里每一行非注释代码都能在源文件里找到原样（行尾追加注释可以）；
plan 证据涉及的每个源文件都有副本。所以讲解一律写成以该语言注释符号开头的整行
注释（`//`、`#` 等）或行尾注释，不要省略代码、不要写伪代码。不合格会点名哪一行
对不上，让你重写。正文列出副本清单（副本路径 → 原始出处），此外不输出别的。"""

[steps.output_contract]
min_chars = 30
require = ["code/"]

# ═══ 2. 嵌套写作（主体框架 + 章节并发写作）══════════════════════
# doc_review_loop：outline → 各章并发 write。写完就返回，学员开始阅读。
# 放行条件是学员答题，不是审稿员的 LOOKS_CLEAR。
[[steps]]
id = "doc_review"
description = "运行 outline→并发章节写作"
workflow = "doc_review_loop"
output_key = "doc_review_out"
output_from = "chapters_out"
task = """学习文档审查契约：
slug={{plan_out}}
draft=.latte/learn/{{plan_out}}/draft.md
plan=.latte/learn/{{plan_out}}/plan.json
ledger=.latte/learn/{{plan_out}}/ledger.json
"""

# 兼容保留旧定义；实际执行由上面的 doc_review 嵌套 step 接管。
[[steps]]
id = "legacy_doc"
description = "兼容保留：旧扁平 doc step（已由 doc_review 接管）"
role = "tutor"
output_key = "legacy_doc_out"
when_any = ["__legacy_flat_learn_loop__"]
max_retries = 1
tools = ["read", "code_graph", "search", "edit", "write"]
require_tools_any = ["edit", "write"]
task = """你是互动学习辅导员，负责维护学习文档。当前主题 slug：{{plan_out}}。

读 `.latte/learn/{{plan_out}}/plan.json` 与 `ledger.json`，若已经存在 `draft.md`，必须先读取并刷新它。

## 首次进入（prompt 里没有上一轮的判分结果或补充问题）

按 plan.json 的 `doc_outline` 写或刷新 `.latte/learn/{{plan_out}}/draft.md`。**读者是零
基础小白**——写得像考据报告就是失败。开头先讲大白话和全局心智模型，按大纲展开核心数据结构与运行原理；
术语首次出现一句大白话解释；每个知识点必须带最小具体例子（以 example 为底）；
代码摘录后必须跟逐行讲解；每节末尾用一句「人话总结」收束本节。

## 返工进入：QUIZ_FAIL（prompt 里带上一轮的「判分结果」「你选的是」）

学员答错了。只增强答错点对应的 `doc_section`：加「易错点辨析」小节，讲清正确答案与干扰项区别。
用 `edit` 做局部修改，不要用 `write` 整文件覆写。

## 返工进入：SUPPLEMENT（prompt 里带学员的补充问题）

学员全对后主动提出还有不懂的。用 `edit` 把补充内容追加为 draft.md 的新章节，并补全 plan/ledger。

## 正文（学员在 chat 里直接读的部分）

把 draft.md 的全文原样作为正文输出，文末注明路径并提示「读完后点击「开始答题」」。
返工轮次只输出本轮变更部分。"""
[steps.output_contract]
min_chars = 500
forbid = ["正确答案是", "答案：", "选项 A", "选项一"]

[[steps]]
id = "legacy_proofread"
description = "兼容保留：旧扁平 proofread step"
role = "proofreader"
output_key = "legacy_proofread_out"
when_any = ["__legacy_flat_learn_loop__"]
max_retries = 1
tools = ["read"]
require_tools = ["read"]
task = """你是零基础读者 proofreader，只读不改。通读 draft.md，检查大白话解释、代码注释、推导与例子。"""

# ═══ 3. 等学员读完：「开始答题」按钮 ═════════════════════════
# tools            只读 + ask：不许改文档和账本。
# require_tools    ask 必须真弹过。
# tool_call_limits ask 恰好一次。
# 本步是纯阻塞点：文档全文已随上一步正文投递，这里只等学员读完点按钮。
[[steps]]
id = "read_confirm"
description = "弹「开始答题」按钮，阻塞等学员读完文档"
role = "tutor"
max_retries = 1
tools = ["read", "ask"]
require_tools = ["ask"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员正在阅读学习文档（路径与要点已在上一条消息里）。你的唯一职责：确认他读完了。

读 `.latte/learn/{{plan_out}}/ledger.json` 拿 `round`，然后调一次 `ask`：

- `question`：`学习材料（第 {round+1} 版）：.latte/learn/{{plan_out}}/draft.md。读完了吗？`
  ——题面**必须带版本号**：同一题面文本重问会被"同题复用旧答案"保护静默回放、
  根本不弹窗，学员的"读完确认"会被工具层吞掉。
- `document_path`：`.latte/learn/{{plan_out}}/draft.md`——UI 会把文档**内容**渲染在
  提问卡片里（选项上方），学员不用离开 chat 去找文件。后端读不到会自动降级为只
  显示路径，不用你兜底。
- `options`：只有一项 `{"label": "开始答题，验证掌握程度", "description": "我已读完文档"}`；
  **不加 `recommended`**。
- 不加多余选项；学员若经「其他（自定义）」回了问题，原样转述即可，不要替他回答。

答案回来后，正文一句话确认（如"好，开始答题"）即可，不要讲课。"""

# ═══ 4. 批量出题 + 判分 + 循环控制 ═══════════════════════════
# tools              无 code_graph / search：题目已定好，本步不取证、不改题。
# require_tools      ask 必须真弹过（否则拿旧答案编造判分结果），write 必须真写
#                    账本（否则同一批点被反复考、循环靠撞满才停）。
# tool_call_limits   ask 恰好一次：用 questions=[...] 一次出全部未掌握点的题，
#                    一轮只弹一窗。
# require            判分结果必须回显给学员。
# last_line_prefix_any 末行状态标记缺失时引擎按"未通过"判，循环停不下来。
# loop_until/routes  全对 QUIZ_PASS → 进 supplement；有错 QUIZ_FAIL → 回 doc 增强。
# max_iterations     引擎硬上限 10（写更大无效），是"学到会为止"的保险丝。
[[steps]]
id = "quiz"
description = "用 ask 批量出全部未掌握点的题、判分并更新账本"
role = "tutor"
max_retries = 2
loop_until = "QUIZ_PASS"
loop_back_routes = { QUIZ_FAIL = "doc_review" }
max_iterations = 10
tools = ["read", "write", "ask"]
require_tools = ["ask", "write"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

读 `.latte/learn/{{plan_out}}/plan.json` 与 `ledger.json`，本轮考**所有 `passed == false`**
的知识点（已 passed 的不重考）。考哪个点不需要问别人——账本是唯一事实来源。

1. **出题**：调**一次** `ask`，用 `questions=[...]` 把本轮所有题一次出完（一题一个
   question 元素，各带自己的 `options`）。每题：
   - 若该点 `wrong > 0`（以前考过），题面末尾追加 `［第{wrong+1}次作答］`——同一题面
     文本重问会被"同题复用旧答案"保护静默回放、不弹窗，学员连卷子都看不到；
   - `options` 原样传，**不加 `recommended`**（渲染成「✓ 推荐」等于泄题）；
   - `answer` 只给你判分，永远不下发，也不要在题面或 `description` 里暗示。
2. **判分**：用户答案与 `answer` 按 **label 文本**比对、**绝不按位置**（正确项位置是
   plan 随机打散的，"第几项"没有意义；答案可以带序号前缀，但必须包含完整 label）。
   只回 label 的一部分、对不上任何 label（乱填、空、"不知道"、或走了「其他（自定义）」自由文本）按答错。
3. **更新账本**（write 覆盖写 ledger.json 并刷新 `updated_at`）。只做两件事，不做任何
   状态推理：答对 → 该点 `passed = true`（`wrong` 不动）；答错 → `wrong` = 读到的值
   **+1**（`passed` 保持 false）。`wrong` 只能 +1、绝不跳步；其余知识点原样保留。
4. **反馈**：正文逐题回显 `判分结果`（答对/答错）和 `你选的是`（用户实际选项）。答错时
   说明正确答案是哪个、为什么，带 `file:line`，并告诉学员"这一节的讲解将在下一版
   文档里增强，重读后再考"。
5. **末行**：本轮题目**全对** → `QUIZ_PASS`；有错 → `QUIZ_FAIL`（引擎会带着你的判分
   正文跳回 doc 步增强文档，然后重新阅读、重考）。**除末行外，正文里不得出现
   `QUIZ_PASS` / `QUIZ_FAIL` 原文**——引擎按全文子串判定，正文提了会误判全对。

没有"错几次就放弃"：v2 是学到会为止。若已逼近第 10 轮仍反复答错，在正文里如实
告诉学员，不要假装通过。"""

[steps.output_contract]
require = ["判分结果", "你选的是"]
last_line_prefix_any = ["QUIZ_PASS", "QUIZ_FAIL"]

# ═══ 5. 补充疑问 ═════════════════════════════════════════════
# 仅在 QUIZ_PASS 后进入。有补充 → 记进 ledger.supplements，回 doc 写新章节+
# 新知识点，然后重新"阅读→答题"；没有 → ALL_DONE 进 merge。
# require_tools  ALL_DONE 路径也要 write 一次账本（刷新 updated_at）——
#                require_tools 是机械校验，分不出两条路径。
[[steps]]
id = "supplement"
description = "全对后问学员是否还有不懂的知识点要补充"
role = "tutor"
max_retries = 2
loop_until = "ALL_DONE"
loop_back_to = "doc_review"
max_iterations = 10
tools = ["read", "write", "ask"]
require_tools = ["ask", "write"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员本轮题目全对。读 `.latte/learn/{{plan_out}}/ledger.json` 拿 `round`，调一次 `ask`：

- `question`：`第 {round+1} 轮：「{{topic}}」的内容都掌握了吗？还有不懂、想补充讲解
  的知识点吗？`——题面**必须带轮次号**（同题面重问会被静默回放旧答案、不弹窗）。
- `options`：只有一项 `{"label": "没有了，全部理解", "description": "可以定稿结束了"}`；
  **不加 `recommended`**。想补充的学员会走前端自动附带的「其他（自定义）」输入具体
  内容，你不要替他列猜测项。

然后判定：

- 答案是「没有了，全部理解」→ write 一次 ledger.json（只刷新 `updated_at`，其余不动），
  末行写 `ALL_DONE`（进 merge 定稿）。
- 答案是 `其他：<内容>` → 把学员的补充问题原文追加进 ledger.json 的 `supplements`
  数组：`{"round": <当前round>, "asked": "<内容原文>"}`，刷新 `updated_at`（`round`
  不 +1，那是 doc 步的事）；正文复述学员的补充点并说明"将写进文档并补一道题"，
  末行写 `SUPPLEMENT`（引擎会带着你的正文跳回 doc 步）。

**除末行外，正文里不得出现 `ALL_DONE` / `SUPPLEMENT` 原文**——引擎按全文子串判定。"""

[steps.output_contract]
last_line_prefix_any = ["ALL_DONE", "SUPPLEMENT"]

# ═══ 6. 文档合并定稿 ═════════════════════════════════════════
# require_tools  最终文档必须真落盘。
# require        正文必须给出交付路径。
[[steps]]
id = "merge"
description = "把 draft.md 与学习期间的补充合并定稿到 docs/learn/<slug>.md"
role = "tutor"
max_retries = 2
tools = ["read", "write"]
require_tools = ["write"]
task = """你是技术写作者。当前主题 slug：{{plan_out}}。

学习已结束（题目全对、学员无更多疑问）。读 `.latte/learn/{{plan_out}}/draft.md`、
`plan.json` 与 `ledger.json`，产出最终交付文档 `docs/learn/{{plan_out}}.md`：

- 把 `supplements` 对应的补充章节**融进正文结构**（按主题归位到合适章节附近，去掉
  "补充"字样的临时痕迹），答错轮次产生的「易错点辨析」保留但润色为正式小节；
- 重排章节、生成目录、去重，清理一切轮次/过程痕迹（如"第几版""本轮新增"）；
- 保留全部 `file:line` 出处与代码摘录——这是文档的可信度来源；
- draft 里的 ```mermaid 图块**原样保留**（不改写图源；chat 与文档预览都会渲染成
  SVG），不是过程痕迹，不要当轮次痕迹清理掉；
- draft 中对 `.latte/learn/{{plan_out}}/code/` 注释版副本的引用同样**保留**（学习资产，
  不是轮次痕迹）；若该目录存在，文末加「注释版代码副本」一节列出副本索引；
- draft.md 原样保留作存档，不要删。

引擎写完后会核对：定稿文件存在；draft 里的每个 `file:line` 出处都还在；mermaid 图
不少于 draft；篇幅不少于 draft 的一半。不合格会带原因让你重写。

正文给出最终文档的完整路径（`docs/learn/{{plan_out}}.md`）和一句内容概要，
此外不输出别的。"""

[steps.output_contract]
require = ["docs/learn/"]

# ═══ 6b. 可选：把注释同步进真实源码（when_any 命中才跑）══════════════
# when_any       主题带「同步注释」/「写进源码」才跑——默认只留 .latte/ 副本，
#                不动仓库；开启后本步会修改源文件（只加注释、不改逻辑），
#                建议任务开 isolated worktree（看板编辑弹窗可覆盖）。
# output_key     条件 step 必须绑 output_key（引擎校验），跳过时下游拿到空串。
# require_tools  edit 必须真调过——同步就是改文件，没 edit 就是空口报告。
# 放在 merge 之后：此时 supplement 新增的副本也已由 doc 步补齐，一次同步全覆盖。
[[steps]]
id = "sync_code"
description = "可选：把注释版副本里的注释写进真实源文件（只加注释不改逻辑）"
role = "tutor"
output_key = "sync_out"
when_any = ["同步注释", "写进源码"]
max_retries = 1
tools = ["read", "edit"]
require_tools = ["edit"]
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

学员要求把学习期间生成的注释写进真实源码。读 `.latte/learn/{{plan_out}}/code/README.md`
索引与各个注释版副本，按副本头部的原始出处（`file:line`）用 `edit` 把注释逐个应用
到对应源文件：

1. **只加/改注释，绝不改任何代码逻辑**——改动里除了注释行不许出现别的变化；
2. 行号可能已漂移：以副本里的代码原文为锚点定位，对不上就 `read` 源文件重新找，
   找不到锚点的条目跳过并在正文说明，不要硬插；
3. 注释风格与所在文件已有注释一致（注释符号、语言、密度）；
4. 副本头部的"学习副本 / 原始出处"元信息**不要**带进源码。

正文列出改动文件清单 + 每处注释的一句话摘要（跳过项也列出原因），此外不输出别的。"""

[steps.output_contract]
min_chars = 30

# ═══ 7. 掌握报告 ═════════════════════════════════════════════
# 引擎确定性步骤：报告只复述账本事实，由引擎按 ledger.json / plan.json
# 渲染，不调用模型（模型写报告会数错、漏点或美化进度）。下面的 task
# 只作说明。
[[steps]]
id = "report"
description = "引擎按账本输出最终掌握报告"
role = "tutor"
max_retries = 1
tools = ["read"]
task = """由引擎读 `.latte/learn/{{plan_out}}/ledger.json` 渲染掌握报告，不调用模型。

`passed == true` → 已掌握；`wrong` 是累计答错次数；`round` 是文档轮次；
`supplements` 是学员补充的疑问。报告含掌握进度、学习过程、学员补充、交付文档
（docs/learn/{{plan_out}}.md）、注释版代码副本（目录存在时）和一句建议。"""

[steps.output_contract]
min_chars = 80
require = ["掌握进度"]
