# Workflow: learn_loop
# 交互式学习循环：plan（取证 + 拆知识点 + 出题）→ teach（只讲）
#   → quiz（弹窗出题 + 判分 + 写账本，未学完跳回 teach）→ report
#
# 用法：/learn_loop <主题>，或 manager 调 workflow { name: "learn_loop", topic: "…" }
# 产物：.latte/learn/<slug>/plan.json（知识点+题目+答案+证据）
#       .latte/learn/<slug>/ledger.json（只记 wrong / passed 两个事实）
#
# ── 两条设计约定 ──────────────────────────────────────────────
# 1. 行为约束写在引擎字段上，不写进 prompt。prompt 是劝告、违反了没人知道；
#    字段是硬约束：tools（拿不到就调不了）、require_tools[_any]、
#    tool_call_limits、output_contract、loop_until / loop_back_to。
#    每个 step 上方的注释列出它被钉住的行为，prompt 里不再重复。
# 2. teach 与 quiz 必须分成两步。合成一步时 step 正文只在结束时交付、而 ask
#    在中途阻塞，结果是学员先看到考题、讲解答完题才出现。

name = "learn_loop"
command = "/learn_loop"
description = "交互式学习循环：知识点拆解 → 讲解 → 弹窗出题 → 掌握报告｜落点：现在就开始上课：逐题弹窗互动 + .latte/learn/<slug>/ 掌握账本（不进任务看板）"
max_rounds = 1

# ═══ 1. 取证 + 拆解知识点 ═══════════════════════════════════════
# tools              无 ask：课程设计阶段不许弹窗打扰学员。
# require_tools_any  取证不可跳过（read/code_graph/search 任一即可）。
# require_tools      plan.json / ledger.json 必须落盘，下游靠文件工作。
# output_contract    产出被当路径片段拼接，所以只能是 slug 本身。
[[steps]]
id = "plan"
description = "读代码取证，拆解知识点并写入 plan.json / ledger.json"
role = "tutor"
output_key = "plan_out"
max_retries = 1
tools = ["read", "code_graph", "search", "write"]
require_tools_any = ["read", "code_graph", "search"]
require_tools = ["write"]
task = """围绕主题「{{topic}}」设计课程。你是课程设计师，不教学，只产出知识点清单。

## 一、先取证

凭记忆出题会造出不存在的符号，学员学到的是假知识。动笔前把涉及的代码/文档读一遍：
`code_graph`（`kind=function`/`struct` + `path`）拿签名行号，`read("<file>:<起>-<止>")`
精读，宏和字符串用 `search`。独立的取证同一轮批量发：`read(paths=[...])`，一次最多 10 个。
涉及"有几个字段""按什么顺序""定义在哪一行"这类事实，必须把定义整段读出来数。

## 二、拆知识点

拆成 3-6 个，互不重叠，**按由浅入深排序**：第一个必须是"这东西是什么、整体怎么运转"
这种门外汉也能听懂的层级，越往后越细。若 topic 已给出分层（L0/L1/… 或阶段清单），
就照它的顺序覆盖，不要跳过浅层直接挑深处的细节考。

每个知识点写：`id`（短英文）、`title`（中文）、`evidence`（`file:line`，必须真实存在）、
`teach_points`（讲解要点数组，每条一句话 + 出处）、`question` + 4 个 `options`、
`answer`（正确选项的 label 原文）。

## 三、出题规则

- `options` 里**禁止 `recommended` 字段**——前端会渲染成「✓ 推荐」徽标，等于印上答案。
- `label` 写选项的实际内容（符号名/短语，≤20 字），**不许用 A/B/C/D**——那会让 `answer`
  退化成位置引用。选项顺序不用管，quiz 步的 `ask` 会洗牌。
- 四个选项等重：长度、语气、详略、术语密度一致。干扰项必须是真实存在的东西（真函数/宏/
  字段），只是不满足题干条件；一秒能排除的荒谬项（"两者完全等价"）不叫干扰项。
- 题目考 `title` 说的那个核心，各知识点的题目不得互相重叠。选项 `description` 里的事实
  同样来自取证。

## 四、落盘

`write` 到 `.latte/learn/<slug>/plan.json`（slug 从主题推导，小写英文+连字符）：

```json
{
  "slug": "<slug>",
  "topic": "{{topic}}",
  "knowledge_points": [
    {
      "id": "k1",
      "title": "所有权规则",
      "evidence": "src/ownership.rs:12-48",
      "teach_points": ["每个值有唯一 owner（src/ownership.rs:12）"],
      "question": "…",
      "options": [
        {"label": "move 语义", "description": "客观描述这一项是什么"},
        {"label": "borrow 语义", "description": "客观描述这一项是什么"},
        {"label": "Copy trait", "description": "客观描述这一项是什么"},
        {"label": "Rc 引用计数", "description": "客观描述这一项是什么"}
      ],
      "answer": "borrow 语义"
    }
  ]
}
```

再 `write` 初始 `.latte/learn/<slug>/ledger.json`，**只记事实、不写状态名**（状态由读取方
按 `wrong`+`passed` 推导）：

```json
{"slug":"<slug>","knowledge_points":[{"id":"k1","title":"所有权规则","wrong":0,"passed":false}],"updated_at":"<now>"}
```

## 产出

**只输出 slug 本身**（如 `rust-ownership`），无其他文字——下游直接拼进文件路径。"""

[steps.output_contract]
min_chars = 3
max_chars = 60
forbid = [" ", "/", "\\", "`"]

# ═══ 2. 讲解 ═══════════════════════════════════════════════════
# tools                只读：既拿不到 ask（不许出题），也拿不到 write（不许改账本）。
# min_chars            堵"讲解全写进 <think>、可见正文为空"。
# forbid               不许摊开选项或点出答案。
# last_line_prefix_any 下游靠末行 `TEACH_DONE <id>` 决定考哪个点；写在正文中间会解析失败。
[[steps]]
id = "teach"
description = "讲解当前知识点（引擎层禁出题、禁改账本）"
role = "tutor"
output_key = "teach_out"
max_retries = 1
tools = ["read", "code_graph", "search"]
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

读 `.latte/learn/{{plan_out}}/plan.json` 与 `ledger.json`，取**当前知识点**：按 plan.json
顺序第一个 `passed == false 且 wrong < 2` 的（`passed` 为真的已掌握、`wrong >= 2` 的已放弃）。

正文**开头先给一行进度**：全部知识点标题依次列出、标出当前在第几个（学员需要看到整条
学习路径，而不是被直接扔进某一课）。

然后把这个知识点讲透：

- 以它的 `teach_points` 为骨架展开，按需再读代码补细节（独立取证用 `paths` 批量发）。
- **必须带 `file:line`**，关键处摘几行真实代码。说不出出处的结论不要写。
- 要覆盖它 `question` 会考的那个点——下一步就考它，不许突袭。
- 若 `wrong == 1`（上轮答错过），说明第一次没讲明白：换个角度重讲，重点讲清 `answer`
  那个选项与其余选项的区别。
- 长度服从内容，不设上限。

**最后一行写 `TEACH_DONE <知识点id>`**（如 `TEACH_DONE k1`）。"""

[steps.output_contract]
min_chars = 500
forbid = ["正确答案是", "答案：", "选项 A", "选项一"]
last_line_prefix_any = ["TEACH_DONE"]

# ═══ 3. 弹窗出题 + 判分 + 循环控制 ═══════════════════════════
# tools                无 code_graph / search：题目已定好，本步不取证、不改题。
# require_tools        ask 必须真弹过（否则会拿旧答案编造判分结果），write 必须真写
#                      账本（否则同一个点被反复考、循环靠撞满才停）。
# tool_call_limits     ask 恰好一次：弹两次就是连考两遍、账本按最后一次覆盖。
# require              判分结果必须回显给学员。
# last_line_prefix_any 末行状态标记缺失时引擎按"未完成"判，循环停不下来。
# max_iterations       引擎硬上限 10（写更大无效）。撞满时带最后产出降级收尾。
[[steps]]
id = "quiz"
description = "用 ask 弹窗出题、判分并更新账本"
role = "tutor"
output_key = "quiz_out"
max_retries = 2
loop_until = "STATUS_ALL_DONE"
loop_back_to = "teach"
max_iterations = 10
tools = ["read", "write", "ask"]
require_tools = ["ask", "write"]
tool_call_limits = { ask = 1 }
task = """你是互动学习辅导员。当前主题 slug：{{plan_out}}。

考哪个知识点**由 teach 步决定**，不要自己按 ledger 重挑（挑歪了就是"刚讲完 k1 却拿 k2
考人"）。teach 的完整输出如下，末行是 `TEACH_DONE <id>`，从那里取 id，只考这一个；那行
缺失才退回"plan.json 顺序里第一个 `passed == false 且 wrong < 2` 的"。

```
{{teach_out}}
```

读 `.latte/learn/{{plan_out}}/plan.json` 拿该点的 `question` / `options` / `answer`，
读 `ledger.json` 拿它的 `wrong` / `passed`。

1. **出题**：`ask` 弹出该点的 `question` 和 `options`，三个参数必须带：
   - `allow_repeat: true` —— 不带会被"同题复用旧答案"保护静默拦掉，压根不弹窗；
   - `shuffle: true` —— 让程序洗牌选项；判分按 label 文本，与顺序无关；
   - `auto_answer: false` —— 关掉超时兜底，否则会替学员选一项、造出假作答记录。

   `options` 原样传，**不加 `recommended`**（渲染成「✓ 推荐」等于泄题）。`answer` 只给你
   判分，永远不下发，也不要在题面或 `description` 里暗示。
2. **判分**：用户答案与 `answer` 按 **label 文本**比对、**绝不按位置**（顺序已被 shuffle
   打乱，"第几项"没有意义；用户可能只回 label 的一部分或带前缀）。
   对不上任何 label（乱填、空、"不知道"）按答错。若 tool result 是"用户此前已回答过…"
   这类复用提示，说明漏传了 `allow_repeat: true`，带上它重调一次，别拿旧答案判分。
3. **更新账本**（write 覆盖写 ledger.json 并刷新 `updated_at`）。只做两件事之一，不做
   任何状态推理：答对 → 该点 `passed = true`（`wrong` 不动）；答错 → `wrong` = 读到的值
   **+1**（`passed` 保持 false）。`wrong` 只能 +1、绝不跳步（读到 0 就写 1）；"还有没有
   重考机会"不由你判；其余知识点原样保留。
4. **反馈**：正文回显 `判分结果`（答对/答错）和 `你选的是`（用户实际选项）。答错时说明
   正确答案是哪个、为什么，带 `file:line`。
5. **末行**：plan.json 里每个知识点都 `passed == true 或 wrong >= 2` → `STATUS_ALL_DONE`，
   否则 `STATUS_CONTINUE`。

每次只处理一个知识点。"""

[steps.output_contract]
require = ["判分结果", "你选的是"]
last_line_prefix_any = ["STATUS_ALL_DONE", "STATUS_CONTINUE"]

# ═══ 4. 掌握报告 ═══════════════════════════════════════════════
# tools     只读：报告步不许改账本（改了就掩盖真实掌握情况），也不许弹窗。
# require   必须含进度小节，防一句话敷衍。
[[steps]]
id = "report"
description = "输出最终掌握报告"
role = "tutor"
output_key = "report"
max_retries = 1
tools = ["read"]
task = """读 `.latte/learn/{{plan_out}}/ledger.json`，输出掌握报告。

账本只有 `wrong` 和 `passed` 两个事实，状态这样推导：`passed == true` → 已掌握；
`passed == false` 且 `wrong >= 2` → 未掌握（已放弃重教）；`wrong == 1` → 未掌握（还差
一次机会，循环提前结束）；`wrong == 0` → 未涉及。

```
## 学习报告：{{topic}}

**掌握进度**：X/Y（已通过 X 个，共 Y 个知识点）

**未通过知识点**：
- 知识点标题（答错 N 次，建议重看 <plan.json 里该点的 evidence>）

**建议**：一句总结。
```

需要 evidence 时读 plan.json。除报告文本外不输出别的。"""

[steps.output_contract]
min_chars = 80
require = ["掌握进度"]
