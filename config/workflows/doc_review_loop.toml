# Workflow: doc_review_loop
# 学习文档「主体框架 + 并发写作」（DAG，按 wave 执行）：
#   wave0 outline   ：写主体框架 sections/00_overview.md + index.md（子章节链接）
#   wave1 write_chapter：引擎按 plan.json 的 knowledge_points **每章派发一次**（fan_out），
#                     并发度受引擎信号量限制（LATTE_WORKFLOW_CONCURRENCY，缺省 4），
#                     章节比并发度多时引擎自动排队，有空位就派下一章——章节数不受限，
#                     分派完全由引擎负责，模型只写自己被分到的那一章
# 每章分 10 节（0-9），6 个阶段依次写：ch_logic（第 0 节代码逻辑解析：先读代码——控制流图、逐行中文注释、
# 循环逐轮推演、代码直接暴露的问题）→ ch_frame（问题与背景从第 0 节长出来）→ ch_options → ch_design / ch_usage → ch_wrap。
# 章节写完就返回外层。学员阅读、答题；答错才按 feedback.md 重写被点名的章。
# 不再等另一个模型输出 LOOKS_CLEAR。
# draft.md 由引擎在控制步（read_confirm/quiz）前从 sections 自动装配，writer 不写它。
name = "doc_review_loop"
description = "主体框架先行 + 各章并发写作，写完即交给学员｜落点：{{learn_root}}/<slug>/{index.md,sections/*.md}"
max_rounds = 1

[[steps]]
id = "outline"
description = "写主体框架(00_overview.md)与 index.md；返工时把审查意见按章拆到 feedback.md"
budget = "small"
role = "tutor"
output_key = "outline_out"
max_retries = 1
tools = ["read", "code_graph", "search", "edit", "write"]
require_tools_any = ["edit", "write"]
task = """你是学习文档的总编，负责**主体框架**与**返工分派**，不写各章正文（各章由并发的章节 writer 写）。

契约：
{{topic}}

先读 `{{learn_root}}/{{slug}}/plan.json`、`{{learn_root}}/{{slug}}/ledger.json`（以及已有的 `{{learn_root}}/{{slug}}/sections/` 文件，若有）。下文的相对路径都相对这个工作目录（会话目录下的学习工作区），工具调用里要写完整路径。

## 一、主体框架 sections/00_overview.md（必写；返工时仅当意见涉及全局设计/主线时改）
这一页是电梯演讲：只读这一页也要能说出问题、核心思路和关键取舍。以 plan.json 的 `design` 为底
（没有 `design` 时从知识点和源码注释归纳）。**引擎会在文档最前面自动生成「先看一个例子（`design.hook`）+ 一句话结论 +
取舍一览表」，这里不要再写那个例子和那张表**（读者的第一屏已经是例子了），用图把它讲直观：
1. **要解决的问题与约束**：`design.problem` 展开成读者能复述的几句话 + 硬约束。开头那个小例子已经由引擎放在文档最前面，
   这里**引用它、接着讲**，不要重写一遍，也不要在这里先列「作者选了什么、放弃了什么」。
   **例外**：plan.json 的 `design` 既没有 `hook`、各决策也没有 `pain` 时，引擎放不出开篇例子——这时由你在本节**最前面**写一个
   `#### 先看一个例子`：5-10 行代码或几步带具体数字的推演，写清不用这套设计时在哪一步出什么事，再接着讲问题；
2. **整体架构图**（mermaid `flowchart`）：系统里有哪些部件、数据/请求怎么流过它们。
   节点写「部件 + 它负责什么」，不写裸函数名；
   主题涉及内存/数据怎么存时，再给一张 ```memlayout 物理视图（一页/一个对象怎么切、元数据指向哪里；
   语法：`lane <id> "说明"`、`cell <id> <大小> <used|free|meta|data|pad> "标签"`、`gap <大小> "说明"`、
   `ptr <lane>.<cell> -> <lane>.<cell> "说明"`，引擎渲染成 SVG）。**这张图先于各章写成、之后没人回头核对，
   所以必须现在就读源码核实**：格子布局以源码里地址/偏移怎么算出来为准，元数据在别的结构里就画成独立 lane
   再用 `ptr` 指过去，不要画成内嵌头部；行说明里写了 `= N KiB` 的总数要等于格子之和；数据格和元数据格画在
   同一行必须在行说明里写 `file:line`。引擎会对账，对不上带原因打回。拿不准就不画这张图（用 mermaid 讲结构），
   各章的内存布局图由各章 writer 读源码后画；
3. **决策地图**（mermaid `flowchart LR`）：`问题 → 每个决策（选了什么）→ 对应章节`。
   只有 `alternatives` 非空（带出处）的决策，才在旁边用虚线连一个「放弃了：<替代方案>」节点；
   没有真实替代方案的决策不画这个节点，**不要自己补方案**；
4. **端到端走一遍**：一次典型操作从头到尾（`sequenceDiagram` 优先），标出每一步对应哪个决策；
5. **学习路径**：各章要回答的设计问题，后一章解决前一章留下的哪个矛盾；
6. **概念归属表**：`| 概念 | 负责讲解的章 |`，每个会被多章用到的概念只归一章讲完；
7. 各章链接：`[k1 标题](k1.md)`。
比喻可选，全文最多一个。不科普通用语言/库概念。不编造吞吐/延迟/百分比这类性能数字。

mermaid 语法：第一行写图类型；节点 id 只用字母数字下划线，**标签一律加双引号**
（`A["arena->bins[i]"]`，标签里的 `[](){}<>|#` 不加引号会渲染失败）；单图 ≤ 15 个节点。

## 二、index.md（必写）
文档入口：一句话主题 + 阅读顺序 + 各章相对链接（sections/<k_id>.md）+ 一句话摘要。

## 三、feedback.md（必写，供并发派发的章节 writer 读取）
- 本 prompt 末尾**没有**【上轮审查反馈】→ 首轮：写入单行 `MODE: FULL`（全部章节重写）。
- **有**【上轮审查反馈】→ `MODE: PATCH`，随后按章节 id 分组抄录每条 ISSUE 的原文：
  `## k3\n- <ISSUE 原文>`；只有被点名的章节会被重写，未点名的章节保持不动。
    全局性意见（比喻/主线/章节顺序）用 `## overview` 分组并当场改 00_overview.md 与 index.md。
  绝不自己去改 sections/k*.md。

若 feedback.md 已含 `SOURCE: engine`（quiz 答错或学员补充由引擎写入）：
- 保持 `MODE: PATCH`，保留已有 `## <章节id>` 分组，不要改成 `MODE: FULL`，不要删这些分组；
- 只允许追加 `## overview`；
- `supplement` 为 true、或 id 形如 `sup1` 的知识点，选项和 answer 由引擎维护（两选一），不要改它们，不要补成四选项。章节 writer 只写 sections/<id>.md。

严格以源码为事实来源；无法取证的写「[推测]」。输出：一句话说明写了哪些文件与本轮模式。"""
[steps.output_contract]
min_chars = 10

[[steps]]
id = "ch_logic"
description = "章节第 0 节：代码逻辑解析（先读代码：控制流图、逐行注释、循环逐轮推演、代码暴露的直接问题；引擎按知识点 fan_out）"
budget = "small"
role = "tutor"
write_path_allowlist = ["{{learn_root}}/{{slug}}/sections/{{item_id}}/0_logic.md"]
depends_on = ["outline"]
max_retries = 2
tools = ["read", "code_graph", "search", "edit", "write"]
task = """你是学习文档的章节写作者，每次只写分给你的几节。是哪一章、哪几个文件、本章前面已写好的内容、本知识点的 plan 内容，都在文末「本次任务」里（那一部分每章不同，前面的规则对所有章节一样）。

引擎会给这一节加标题（`### 0. 代码逻辑解析`）并排在本章最前面，**不要写节标题**，从正文开始；节内小标题用 `####`。
只能写文末「本次任务」里列出的这个文件，写别的路径会被拒绝。

**这一节在整章里的位置：先读代码，再谈问题。** 读者此刻还没看过这段代码。后面的「问题与背景」「方案对比」都建立在
这一节之上：问题要从这里讲出来的逻辑里"看出来"，而不是凭空设定。所以这一节只做一件事——**带读者把代码一行一行读懂**，
不评价好坏、不讲替代方案（那是第 3、4 节）。

## 全局总览（已定稿，只读，对所有章节相同）
<<<
{{overview_text}}
>>>

本知识点（含 `evidence`、`teach_points`）和它依据的设计决策已经在文末「本次任务」里给全，**不必再 read plan.json**；总览也已在上面给全，**不必再 read 00_overview.md**。
**evidence 的完整源码已在文末「本次任务」里带行号给出**
（函数体读全，不许凭记忆、不许只读签名）；需要区间之外的代码再 `read`。`{{learn_root}}/{{slug}}/code/` 下若有本知识点的注释版副本，可参考其注释，
但贴进文档的代码以 `read` 到的源码原文为准。

返工：本章的返工模式与意见在文末「本次任务」里（不必 read feedback.md）。`MODE: PATCH` 且列出了本章的意见时，只在已有文件上
**增补**这一节里与意见相关的内容（原有段落、`file:line` 出处、代码摘录一律保留）；意见和这一节无关就只输出
`UNCHANGED`。引擎会核对出处和篇幅，改坏了会还原。

## 0. 代码逻辑解析（0_logic.md）
按下面 6 块依次写：

**⓪ 先看问题**（小节标题固定写 `#### 先看问题`，必须是这一节**最先出现**的小节，排在任何流程图和源码解析之前；引擎会查）：
读者此刻还不知道为什么需要这段代码。用「本次任务」里本知识点所依据决策的 `pain`（没有就从 `scenario` / `example` 推）
做一个**读者一眼看得懂的小例子**——5-10 行代码，或几步带具体数字的推演（要标明这是「假想的直觉写法」，不是仓库里的代码；
仓库里的真实代码放在后面逐行读），写清**走到第几步、出了什么事**（崩溃 / 读到脏数据 / 结果错）。代码块照样每行带中文注释。
最后一句话把读者引向下面：「下面读仓库里的真实代码，看它怎么避开这件事」。
这里**不讲**作者选了什么、放弃了什么，也不讲替代方案。

**① 这段代码是什么**：一句话讲清它的输入、输出和副作用（改了哪些状态、拿/放了哪些锁、有没有 IO），入口函数在哪（`file:line`）。

**② 控制流图**：一张 mermaid `flowchart TD`，画这段代码的执行流程——入口、每个 `if` 分支、**循环（回边要画出来）**、
提前返回/`break`/`continue`、出口。节点写动作（"遍历 bin 找第一个非空"），不写裸函数名。

**③ 逐行解析**：按执行顺序把 evidence 里的函数**原文**分段贴出来（每段 ≤ 30 行，每段一个 ```代码块 + `file:start-end` 出处，
段前一句话说这段在流程图的哪一步、做什么）。**代码块里每一行都要带中文注释**：
- 写在行尾（`// ...` / `# ...`）或紧挨着的上一行；一句话盖不住多行，**每行各写各的**；
- 讲这一行**做了什么、为什么这样写、变量此刻是什么值**（用上面那个具体场景的数字），不要复述代码本身（`i++ // i 加一` 不算）；
- 术语面向零基础：随口用半句大白话带过（如"CAS：比较并交换，失败说明别人先改了"）；
- 源码自带的英文注释**不算**；除了加注释，代码本身一个字符都不许改、不许删、不许"简化"；
- 只有括号的行不用注释。

**④ 循环详解**（代码里**有任何** `for` / `while` / `loop` / 迭代器 `for_each` 就必须写；每个循环一个 `#### 循环：<名字>` 小节）：
- 遍历的是什么、初值、每轮的进入条件、终止条件；
- 每一轮做什么、哪些变量在变、哪个量在整个循环中保持不变（循环不变量）；
- 怎么退出：正常结束 / `break` / `return` / `continue` 跳过了什么；
- 嵌套循环：说明外层一轮里内层跑几轮、总共多少次；
- **逐轮推演表**：取一个具体输入（带真实数值），列表 `| 轮次 | 进入时的关键变量 | 这一轮做了什么 | 是否退出 |`，
  至少推演前 2 轮和最后一轮；退出轮要标明是哪个条件触发的。表里的数必须能从代码和输入推出来。
  引擎会查：有循环却没有「循环」小节、没有至少 2 行数据的推演表，会带原因打回。

**⑤ 从逻辑里直接看出的问题**：读完上面的逻辑，**这段代码直接暴露出的 1-3 个问题/约束/代价**——
每条一句话，并指回上面具体的 `file:line`（例如"第 42-47 行的循环在最坏情况下要扫完全部 bin，复杂度随 bin 数线性增长"；
"第 60 行拿着锁调用了可能阻塞的函数"）。这些问题是第 1 节「问题与背景」展开的起点，**只陈述现象，不给解决方案**。

通用纪律：
- **篇幅跟体量走**：「本次任务」里的「本章体量」说明了这一章是简单 / 中等 / 复杂档和每节的字数上限；简单档讲清楚就停，不凑篇幅，同一件事只讲一次；
- 只写能从源码/测试/文档推出来的数（字节数、锁个数、循环次数，写出算式）；**不许编造吞吐、延迟、百分比**；
- 依据来自源码注释/测试/文档，无依据标「[推测]」；
- mermaid：第一行写图类型；节点 id 只用字母数字下划线，**标签一律加双引号**（`A["arena->bins[i]"]`），
  单图 ≤ 15 个节点。
**数字以你自己对源码的推导为准**：`item_brief` 里 plan 的 `example` / `why` 等字段里的具体数值是规划阶段的估算，没有逐行核对；
你推导出的值与它不同时，用推导值，不要照抄。全文同一个宏只能有一个值，引擎会扫描全文，矛盾会被打回。
**写完不要回读自己刚写的文件**（`read` 一次就把整个文件塞回上下文，之后每一轮都要重传）——引擎会逐节检查，有问题会带着原因让你改。
写完 write 落盘，正文一句话说明写了几段代码、几个循环小节。

