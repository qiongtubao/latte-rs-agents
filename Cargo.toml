[workspace]
members = [
    "latte-agent-core",
    "latte-agent-orchestrator",
    "latte-agent-ui-server",
    "latte-agent-cli",
]
# Force resolver = "2" because latte-rs-graph (a path dep) is
# edition 2024 with deps that need MSRV-aware resolution. The default
# resolver=1 picks the wrong clap version when features::derive are
# requested, leaving clap::Args / #[command(...)] unresolved.
resolver = "2"
# 编译它. 不加 exclude 的话, cargo 看到 rtk 在 workspace 子目录里,
# 又没在 members, 会报 "current package believes it's in a workspace
# when it's not".
exclude = ["vendor/rtk"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates (path references to sibling projects)
latte-ai = { path = "../latte-rs-model-router/latte-ai" }
latte-rs-agent-tools = { path = "../latte-rs-agent-tools" }
latte-rs-graph = { path = "../latte-rs-graph" }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"

# Error handling
thiserror = "2"
# Templating
handlebars = "6"

# Logging facade (advisor monitor degradation warnings, etc.)
tracing = "0.1"

# CLI
# Sync primitives (used by agent cooldown map for non-blocking &self access)
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
# 终端控制（chat 的输入/显示分离）。刻意只用 crossterm 而非 ratatui：
# 后者默认 alt-screen 全屏重绘会毁掉终端 scrollback，而我们要的正是
# 「历史推进 scrollback + 底部固定输入块」——与 oh-my-pi 的 pi-tui
# 同一取舍（它也刻意不进 alt screen）。
crossterm = "0.28"
# HTTP client (used by `latte-agent test --raw` for raw request debugging).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
