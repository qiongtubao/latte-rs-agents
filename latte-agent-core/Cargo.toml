[package]
name = "latte-agent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core agent runtime: role system, model resolution, conversation context, turn-based execution"

[lib]
name = "latte_agent_core"
path = "src/lib.rs"

[dependencies]
latte-ai = { workspace = true }
latte-rs-agent-tools = { workspace = true }

tokio = { workspace = true }
tokio-util = "0.7"
futures = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }

# Used by config / role modules in the library
serde = { workspace = true }
serde_json = { workspace = true }
# plan 工具参数报错带字段路径（裸 serde_json 的 "invalid type" 不说是
# 哪个字段，模型会对着错误字段空转重试——实测 manager 把子任务里
# subtasks:"" 的报错误诊成 workflow 字段，原样重撞两次）。
serde_path_to_error = "0.1"
toml = { workspace = true }
serde_yaml = { workspace = true }
handlebars = { workspace = true }

# HTTP client + base64 for the image-generation tool (OpenAI-compatible
# /v1/images/generations endpoint, b64_json response).
reqwest = { workspace = true }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
