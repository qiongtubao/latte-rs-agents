# Used by config / role modules in the library
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
serde_yaml = { workspace = true }
handlebars = { workspace = true }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
futures = "0.3"
